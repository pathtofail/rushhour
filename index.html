          //     (alpha 0 = off). The grid stays calm where nothing's
          //     happening.
          //   • Cells with at least one move/exit this pass → 'red' on
          //     the non-moving arms (visible context: this cell's car
          //     isn't going that way), then 'green' on the current
          //     move's arm and 'yellow' on queued moves' arms.
          const targets = scene._trafficCells.map(() => ['dim', 'dim', 'dim', 'dim']);
          // Mark cells whose car is STILL going to move (or exit) at
          // or after the current tick. Cars that already moved leave
          // their source cell empty, so its lights should go off.
          for (let mi = currentMoveIdx >= 0 ? currentMoveIdx : 0; mi < moves.length; mi++) {
            const m = moves[mi];
            if (!m) continue;
            if (m.kind !== 'move' && m.kind !== 'exit') continue;
            const idx = m.from.r * _COLS + m.from.c;
            if (targets[idx]) targets[idx] = ['red', 'red', 'red', 'red'];
          }
          // Overlay green/yellow for actual move arms (exits don't fire
          // a directional arm since edge cells' outward arms are null).
          for (let mi = currentMoveIdx >= 0 ? currentMoveIdx : 0; mi < moves.length; mi++) {
            const m = moves[mi];
            if (!m || m.kind !== 'move') continue;
            const arm = armDirForArrow[m.arrow];
            if (arm == null) continue;
            const idx = m.from.r * _COLS + m.from.c;
            const cur = targets[idx];
            if (!cur) continue;
            if (mi === currentMoveIdx) cur[arm] = 'green';
            else if (cur[arm] !== 'green') cur[arm] = 'yellow';
          }
          // Apply each arm's target. applyArmState handles green→fade.
          // Skip null arms (edges that face the outer conveyor exits).
          for (let i = 0; i < scene._trafficCells.length; i++) {
            const tc = scene._trafficCells[i];
            const t = targets[i];
            for (let d = 0; d < 4; d++) {
              const arm = tc.arms[d];
              if (!arm) continue;
              if (arm.state !== t[d]) {
                scene._applyArmState(arm, t[d]);
              }
            }
          }
        };
        // Initial state for the pass — all upcoming arms yellow, rest red.
        if (typeof TRAFFIC_LIGHTS_ENABLED !== 'undefined' && TRAFFIC_LIGHTS_ENABLED) {
          updateLights(-1);
        }

        for (let mi = 0; mi < moves.length; mi++) {
          const m = moves[mi];
          // Mark this move as the active "their turn" before the
          // animation starts.
          if (typeof TRAFFIC_LIGHTS_ENABLED !== 'undefined' && TRAFFIC_LIGHTS_ENABLED) {
            updateLights(mi);
          }
          if (m.kind === 'move') {
            const src = scene.symbols[m.from.r][m.from.c];
            if (!src) { await this._wait(STEP_DELAY); continue; }
            const fromCtr = slotCellCenter(m.from.r, m.from.c);
            const toCtr   = slotCellCenter(m.to.r,   m.to.c);
            // Exhaust puff trailing behind the car as it pulls away.
            spawnExhaustPuff(scene.fxLayer, fromCtr.x, fromCtr.y, m.arrow, 1);
            // Lift sprite into fxLayer, animate to target, then re-parent
            // to the destination cell container at local (0,0).
            const cellFrom = scene.cells[m.from.r][m.from.c];
            this._killSpriteTweens(src);
            cellFrom.removeChild(src);
            scene.symbols[m.from.r][m.from.c] = null;
            src.x = fromCtr.x; src.y = fromCtr.y;
            scene.fxLayer.addChild(src);
            await new Promise(res => {
              gsap.to(src, {
                x: toCtr.x, y: toCtr.y,
                duration: HOP_DUR, ease: 'power2.inOut',
                onComplete: res,
              });
            });
            // Re-parent into destination cell.
            scene.fxLayer.removeChild(src);
            scene.cells[m.to.r][m.to.c].addChild(src);
            src.x = 0; src.y = 0;
            scene.symbols[m.to.r][m.to.c] = src;
          } else if (m.kind === 'exit') {
            const src = scene.symbols[m.from.r][m.from.c];
            const fromCtr = slotCellCenter(m.from.r, m.from.c);
            const cs = L.cellSize + L.cellGap;
            const off = {
              up:    { x: 0,   y: -cs },
              down:  { x: 0,   y:  cs },
              left:  { x: -cs, y:  0  },
              right: { x:  cs, y:  0  },
            }[m.arrow] || { x: 0, y: 0 };
            const exitCtr = { x: fromCtr.x + off.x, y: fromCtr.y + off.y };
            spawnExhaustPuff(scene.fxLayer, fromCtr.x, fromCtr.y, m.arrow, 1.5);
            // Notify the bet resolver — the moment the car visibly leaves
            // the grid is when the player should see their stake on this
            // arrow pay out.
            if (typeof this.onRushExit === 'function' && m.ringPos != null) {
              // Pass the car's color name so the resolver can apply
              // the per-car payMult.
              this.onRushExit(m.ringPos, fromCtr, m.color);
            }
            // Sequential exit animation — await it so the next move can't
            // start sliding INTO the cell while a car is still mid-exit
            // through it. Prevents visual overlap between cars.
            if (src) {
              const cellFrom = scene.cells[m.from.r][m.from.c];
              this._killSpriteTweens(src);
              cellFrom.removeChild(src);
              scene.symbols[m.from.r][m.from.c] = null;
              src.x = fromCtr.x; src.y = fromCtr.y;
              scene.fxLayer.addChild(src);
              await new Promise(res => {
                gsap.timeline({ onComplete: () => {
                    try { src.destroy({ children: true }); } catch (e) {}
                    res();
                  } })
                  .to(src,       { x: exitCtr.x, y: exitCtr.y, duration: EXIT_DUR, ease: 'power2.in' }, 0)
                  .to(src,       { alpha: 0,                    duration: EXIT_DUR * 0.8, ease: 'power2.in' }, EXIT_DUR * 0.4)
                  .to(src.scale, { x: 0.6, y: 0.6,             duration: EXIT_DUR, ease: 'power2.in' }, 0);
              });
            }
          }
          await this._wait(STEP_DELAY);
        }
        // End of pass — fade arms to dim until the next pass relights them.
        if (scene.setTrafficAllDim) scene.setTrafficAllDim();
      }

      // ── Rush Hour: gravity refill ─────────────────────────────────────
      // Existing cars fall to the bottom of their column; new vehicles
      // drop in from above the top conveyor row. The fall can unlock a
      // gridlock by repositioning stuck cars closer to an edge.
      async _playRushRefill(ev) {
        const drops  = ev.drops  || [];
        const spawns = ev.spawns || [];
        const DROP_DUR = 0.30;
        const tweens = [];
        // Phase 1 — survivors fall to their new rows.
        for (const d of drops) {
          const src = scene.symbols[d.from.r][d.from.c];
          if (!src) continue;
          const cellFrom = scene.cells[d.from.r][d.from.c];
          const fromCtr  = slotCellCenter(d.from.r, d.from.c);
          const toCtr    = slotCellCenter(d.to.r,   d.to.c);
          this._killSpriteTweens(src);
          cellFrom.removeChild(src);
          scene.symbols[d.from.r][d.from.c] = null;
          src.x = fromCtr.x; src.y = fromCtr.y;
          scene.fxLayer.addChild(src);
          tweens.push(new Promise(res => {
            gsap.to(src, {
              x: toCtr.x, y: toCtr.y,
              duration: DROP_DUR, ease: 'power2.in',
              onComplete: () => {
                scene.fxLayer.removeChild(src);
                scene.cells[d.to.r][d.to.c].addChild(src);
                src.x = 0; src.y = 0;
                scene.symbols[d.to.r][d.to.c] = src;
                res();
              },
            });
          }));
        }
        // Phase 2 — new spawns drop in from above the top conveyor row.
        const cs = L.cellSize + L.cellGap;
        for (const s of spawns) {
          const sym = makeSlotSymbol(
            { color: s.color, arrow: s.arrow },
            L.cellSize,
          );
          const cell = scene.cells[s.to.r][s.to.c];
          sym.x = 0;
          sym.y = -(s.to.r + 2) * cs;
          cell.addChild(sym);
          scene.symbols[s.to.r][s.to.c] = sym;
          tweens.push(new Promise(res => {
            gsap.to(sym, {
              y: 0, duration: DROP_DUR + 0.05, ease: 'power2.in',
              onComplete: res,
            });
          }));
        }
        await Promise.all(tweens);
      }

      async _playInner(spinResult, beforeTokens) {
        this.runningWin = 0;
        setWinDisplay(0);

        // 0. Creating tile puffs smoke at the start of every spin —
        //    whether or not a new token actually spawns this spin (per
        //    spec: "puffing out a symbol or not"). When a token IS
        //    spawning this spin, the puff is a touch denser.
        if (scene.creatingTileCtr) {
          const newSpawnIncoming =
            spinResult.events.find(e => e.type === 'conveyorSnapshot')?.tokens?.some(t => t.spawnedThisSpin) ||
            (beforeTokens && spinResult.events.find(e => e.type === 'conveyorSnapshot')?.tokens?.length > beforeTokens.length);
          spawnSmokePuff(
            scene.fxLayer,
            scene.creatingTileCtr.x, scene.creatingTileCtr.y,
            newSpawnIncoming ? 1.4 : 0.9,
          );
        }

        // 0b. Wipe any stamps left behind by the previous spin. Stamps are
        //     supposed to clear at spin end; this is a belt-and-suspenders
        //     fix for races where a stamp tween outlives its spin.
        this._clearAllStamps();

        // Token motion (shift + new-spawn slide-in) STARTS NOW — concurrent
        // with drop-out + drop-in — and is sized to last the full
        // click-to-symbols-settled span (~1s) so all token movement lands
        // when the last symbol lands. Engine now shifts at the START of
        // runSpin and intercepts using POST-shift positions, so the
        // visual shift advances every token (no skip set needed) and
        // the cascade animation finds each token at its intercept slot.
        const SHIFT_DURATION = 1.0;
        const snapEv = spinResult.events.find(e => e.type === 'conveyorSnapshot');
        const newSpawn = snapEv?.tokenSpawned || null;
        const tokenMotionPromises = [
          this._animateConveyorShift(new Set(), SHIFT_DURATION, snapEv?.tokens || []),
        ];
        if (newSpawn && !scene.ringTokens[newSpawn.pos]) {
          tokenMotionPromises.push(this._animateTokenSpawn(newSpawn, SHIFT_DURATION));
        }

        // 1. Drop existing slot grid out (token motion runs in parallel).
        await this._spinDropOut();

        // 2. Drop new grid in (still in parallel with token motion).
        const concurrent = [...tokenMotionPromises];
        const spawnEv = spinResult.events.find(e => e.type === 'spawn');
        if (spawnEv) concurrent.push(this._spinDropIn(spawnEv.grid));
        await Promise.all(concurrent);

        // 3. Cascades — intercepts use engine's ringPos directly because
        //    intercepted tokens haven't shifted (we skipped them above).
        for (const ev of spinResult.events) {
          if (ev.type === 'clusters') {
            const ics = spinResult.intercepts.filter(i => i.cascade === ev.cascadeIndex);
            // Pass the cluster event into intercept FX so the multiplier
            // traversal can read componentId / appliedMult per cluster.
            await this._animateIntercepts(ics, ev);
            // Sequence cluster shows when wilds are involved (wild fired
            // this cascade or sticky wild participates). When sequenced,
            // ordering is closest-cluster-to-wild-anchor first.
            const wildIc = ics.find(i => i.fired && i.fired.type === 'wild');
            const wildsInvolved = !!wildIc
              || ev.clusters.some(cl => cl.cells.some(xy => xy.wild));
            const wildAnchor = wildIc ? wildIc.clusterCellRC : null;
            await this._playClusters(ev, { wildsInvolved, wildAnchor });
            await this._wait(220);
          } else if (ev.type === 'refill') {
            await this._playRefill(ev);
            await this._wait(150);
          } else if (ev.type === 'multiplierApply') {
            // Activator-mode end-of-spin: slam the charged ×N badge
            // onto the win pill and bump the running win.
            await this._applyMultiplierCharge(ev);
          } else if (ev.type === 'rushMovePass') {
            await this._playRushMovePass(ev);
          } else if (ev.type === 'rushRefill') {
            await this._playRushRefill(ev);
          }
        }

        // Fizzle: a multiplier was charged this spin but engine emitted
        // no multiplierApply event (no clusters paid → nothing to
        // multiply). Fade the centre badge away.
        if (this._chargedMultBadge) this._fizzleMultiplierCharge();
      }

    }

    const animator = new SpinAnimator();

    // Persisted grid (BB pattern). buildScene() reads this back on every
    // rebuild so resize/orientation changes don't blank the slot.
    let currentGrid = null;

    const game = {
      state: { conveyor: [], freeSpinsBank: 0, inFreeSpin: false },
    };

    // Tracks whether the previous spin landed in a state that should
    // auto-chain into the next spin (free-spin feature). Set in the
    // animator-finished branch and consumed after the busy flag is cleared
    // so popups (retrigger / congrats) can pause the chain naturally.
    let _chainNextSpin = false;

    async function onSpinClick() {
      if (!scene.spinBtn || scene.spinBtn.busy) return;
      const totalWager = sumArrowBets(player.arrowBets);
      if (totalWager <= 0) {
        // No bets placed — nothing to spin for.
        return;
      }
      // Ante cost — TOTAL multiplier on the per-arrow stake.
      // base.costMult = 1 → player pays exactly the stake.
      // ante1.costMult = 2 → each arrow's stake is deducted ×2 (e.g.
      //   $5 chip → $10 deducted), but the win is still calculated
      //   against the base $5 (the extra $5 buys the buffed mechanics).
      const ante = getAnteDef();
      const anteCostMult = ante.costMult || 1;
      const totalCost = totalWager * anteCostMult;
      if (totalCost > player.balance) {
        flashInsufficientBalance();
        return;
      }
      // Snapshot the bets — the resolution reads from this even if
      // arrowBets is mutated mid-flight, and REPEAT pulls from lastBets
      // after the round clears.
      const placedBets = { ...player.arrowBets };
      player.lastBets  = { ...player.arrowBets };
      player.balance -= totalCost;
      refreshHUD({ animateBalance: true });
      scene.spinBtn._setBusy(true);
      setRoundStatus('spinning');
      refreshHUD();
      refreshArrowBetVisuals();   // dim no-bet arrows for the round

      // Roll the round's bonus boosts ONCE, before cars run. The
      // base mode returns empty {boosts: {}, fired: []}; the officer
      // mode returns real per-arrow multipliers. The per-exit
      // resolver reads boosts[ringPos] regardless.
      const { boosts: roundBoosts, fired: officersFired } =
        getModeDef().rollRoundBoosts(player.bet);

      // Per-exit bet resolution — every car that visibly exits through
      // a staked arrow pays:
      //     stake × arrow odds × car payMult × officer boost (if any)
      // The per-car factor lets a 4-car spawn distribution drive the
      // long-run RTP: avg payMult ≈ 0.445 against flat 4× / 5× odds
      // gives ~95% RTP without leaning on per-arrow tuning.
      let totalWin = 0;
      animator.onRushExit = (ringPos, atPt, colorName) => {
        const stake = placedBets[ringPos];
        if (!stake) return;
        const boost = roundBoosts[ringPos] || 1;
        const carDef = colorName && COLOR_BY_NAME[colorName];
        const carMult = (carDef && typeof carDef.payMult === 'number')
          ? carDef.payMult
          : 1;
        const win = stake * arrowOddsFor(ringPos) * boost * carMult;
        totalWin += win;
        player.balance += win;
        animator._addToRunningWin(win);
        if (atPt) {
          animator._spawnPayText(atPt.x, atPt.y, win, win >= 5 * totalWager);
        }
        // Cash bursts originate at the EXIT — the ring/conveyor cell
        // with the arrow drawn on it, not the inner-grid cell the
        // car left from. Reads as "money flying out the staked exit".
        const ringCell = scene.ringCells && scene.ringCells[ringPos];
        const burstPt = ringCell
          ? { x: ringCell.x, y: ringCell.y }
          : atPt;
        if (burstPt) {
          const cashCount = win >= 5 * totalWager ? 14 : (win >= 2 * totalWager ? 10 : 7);
          animator._spawnCashScatter(burstPt.x, burstPt.y, cashCount);
        }
      };

      try {
        // Officers send out their multipliers BEFORE the cars run —
        // sticky badges land on target arrows and stay through the
        // round, then get cleared at the end.
        animator._clearOfficerBoosts();
        await animator._playOfficerBoosts(officersFired);

        const beforeTokens = game.state.conveyor.map(t => ({ ...t }));
        const result = window.RushHour.runSpin(totalWager, game.state);
        await animator.play(result, beforeTokens);
        // Leave the leftover cars visible — the player sees what got
        // stuck this round. They're cleared by the next round's
        // _spinDropOut when the player presses PLAY again.
        currentGrid = result.finalGrid;

        // ── Total-clearance bonus ──
        // Count exit events and check whether the entire grid emptied
        // out (every car drove off). Happens ~5% of rounds with a 4×4
        // grid. Pays a flat +10× total-wager bonus on top of the
        // per-exit pays + triggers the full-screen celebration.
        let _exitCount = 0;
        for (const ev of result.events) {
          if (ev.type !== 'rushMovePass') continue;
          for (const m of (ev.moves || [])) {
            if (m.kind === 'exit') _exitCount++;
          }
        }
        const _totalCells = GAME.ROWS * GAME.COLS;
        const _isClearance = _exitCount >= _totalCells && totalWager > 0;
        if (_isClearance) {
          // Clearance bonus = 1× wager. With ~5.3% clearance rate this
          // adds ~5.3% RTP on top of the arrow-pay baseline. (Was 10×,
          // which over-paid the system to ~147% RTP.)
          const clearanceBonus = 1 * totalWager;
          totalWin += clearanceBonus;
          player.balance += clearanceBonus;
          // Show ONLY the clearance celebration first (CLEAR! + bonus
          // amount + YAY! button). The regular end-of-round popup
          // (total win + REPEAT BET button) is held back until YAY
          // is pressed, so the two dialogs never overlap.
          await animator._celebrateClearance(clearanceBonus);
          // After YAY: fold the bonus into the running WIN counter so
          // the top-of-screen total now reflects the full round win.
          animator._addToRunningWin(clearanceBonus);
        }

        if (totalWin >= 10 * totalWager) {
          shakeStage(8 * (L.gameScale || 1), 0.45);
          pulseWinPill();
        }
        // Breather — give the player a moment to register the last
        // exit / pay-text / officer hit before the round-end popup
        // slides in. Skipped after a clearance celebration since the
        // YAY! tap already broke the rhythm.
        if (!_isClearance) {
          await animator._wait(700);
        }
        // Round done — bets cleared, status reflects outcome. For a
        // clearance round we get here AFTER the player tapped YAY,
        // so the regular popup (total win + REPEAT BET) opens cleanly
        // on top of an empty stage.
        player.arrowBets = {};
        setRoundStatus(totalWin > 0 ? 'won' : 'lost', { amount: totalWin });
        refreshArrowBetVisuals();
      } catch (e) {
        console.error('spin failed:', e);
        setRoundStatus('idle');
      } finally {
        animator.onRushExit = null;
        animator._clearOfficerBoosts();
        scene.spinBtn._setBusy(false);
        // Correct the per-spin stats. The engine returns finalWin=0
        // for rush mode (per-exit pay is resolved in the onRushExit
        // callback above, not in the engine), so runSpinDebug never
        // saw the real win. Push it in here so the bottom-of-screen
        // RTP overlay reflects actual play.
        // Also correct the wager: runSpinDebug only counted the base
        // 1× stake (`totalWager`). The actual deducted cost is
        // `totalWager × ante.costMult`; add the surplus so RTP =
        // totalWin / actualWagered reflects what the player paid.
        const _anteCostMult = (getAnteDef().costMult || 1);
        stats.totalWager += totalWager * (_anteCostMult - 1);
        stats.totalWin += totalWin;
        if (totalWin > 0) stats.hitCount += 1;
        if (totalWin > stats.maxWin) stats.maxWin = totalWin;
        refreshHUD({ animateBalance: true });
        refreshArrowBetVisuals();
      }
    }

    // ── Boot ─────────────────────────────────────────────────────────────────
    // Round flow: PLACE BETS → press PLAY → grid populates with random
    // cars + arrows → cars move/exit → round resolves. Between rounds
    // the grid is EMPTY (no leftover cars) so the next bet phase has a
    // clean canvas.
    function emptyRushGrid() {
      const R = window.RushHour.GAME.ROWS, C = window.RushHour.GAME.COLS;
      const g = [];
      for (let r = 0; r < R; r++) {
        const row = [];
        for (let c = 0; c < C; c++) row.push(null);
        g.push(row);
      }
      return g;
    }
    // Fade + destroy every car still on the grid at round end so the
    // next round starts on an empty board.
    async function fadeOutLeftoverCars() {
      if (!scene.symbols) return;
      const tweens = [];
      for (let r = 0; r < scene.symbols.length; r++) {
        for (let c = 0; c < scene.symbols[r].length; c++) {
          const sym = scene.symbols[r][c];
          if (!sym) continue;
          scene.symbols[r][c] = null;
          tweens.push(new Promise(res => {
            gsap.timeline({ onComplete: () => {
                try { sym.destroy({ children: true }); } catch (e) {}
                res();
              } })
              .to(sym,       { alpha: 0, duration: 0.30, ease: 'power2.in' }, 0)
              .to(sym.scale, { x: 0.6, y: 0.6, duration: 0.30, ease: 'power2.in' }, 0);
          }));
        }
      }
      if (tweens.length) await Promise.all(tweens);
    }
    currentGrid = emptyRushGrid();
    buildScene();

    // Debounced resize — collapse a flurry of resize events into one
    // rebuild (BB pattern). Deferred during in-flight spins: tearing down
    // sprites the animator is still tweening produces ghost references
    // and visual glitches. The animator's finally block calls
    // `_runPendingRebuild()` to catch up once the spin lands.
    let resizeTimer = null;
    let _pendingRebuild = false;
    const _doRebuild = () => {
      if (animator && animator.playing) { _pendingRebuild = true; return; }
      _invalidateLayout();
      buildScene();
      animator._restoreConveyor(game.state.conveyor);
    };
    function _runPendingRebuild() {
      if (!_pendingRebuild) return;
      _pendingRebuild = false;
      _invalidateLayout();
      buildScene();
      animator._restoreConveyor(game.state.conveyor);
    }
    const _onResize = () => {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(_doRebuild, 120);
    };
    window.addEventListener('resize', _onResize);
    window.addEventListener('orientationchange', () => {
      _onResize();
      setTimeout(_onResize, 350);
    });

    // Spacebar = spin (also closes paytable on Esc). Any open modal —
    // paytable OR a simple-modal popup (buy feature, congrats, etc.) —
    // blocks the spin so space can't fire while a dialog is up.
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (scene.paytableModal) return;          // paytable blocks spin
        if (_openSimpleModalCount > 0) return;    // any popup blocks spin
        onSpinClick();
      }
    });
  })();
  </script>
</body>
</html>
