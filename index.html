      // WIN block — anchored to the GRID TOP (not the canvas top) with
      // a fixed breathing-room gap. WIN headline sits on top, status
      // subtitle directly below it. The whole block hugs the grid so
      // both elements are visually associated with the play area, not
      // the BALANCE pill above.
      const HUD_BREATH = L.isMobile ? 14 : 24;   // breathing room between HUD blocks and grid
      const STATUS_GAP = L.isMobile ? 4 : 6;     // inner gap between WIN amount and status line
      const winCenterX = L.frameX + L.frameSize / 2;
      // Status — anchor bottom-centre, bottom edge sits HUD_BREATH above grid.
      scene.statusText = new PIXI.Text('PLACE YOUR BETS', {
        fontFamily: FONT, fontSize: L.isMobile ? 12 : 14,
        fill: 0xFFFFFF, letterSpacing: L.isMobile ? 2 : 3, fontWeight: '700',
      });
      scene.statusText.anchor.set(0.5, 1);
      scene.statusText.x = winCenterX;
      // Bumped up a hair to leave room for a subtitle in the gap
      // between status and the grid.
      scene.statusText.y = L.frameY - HUD_BREATH - (L.isMobile ? 11 : 14);
      scene.stage.addChild(scene.statusText);
      // Subtitle — small helper line under PLACE YOUR BETS, only
      // visible while the player is in the bet phase.
      scene.statusSubtext = new PIXI.Text('You can place multiple bets', {
        fontFamily: FONT, fontSize: L.isMobile ? 9 : 11,
        fill: 0xA8AEB6, fontWeight: '500', letterSpacing: L.isMobile ? 0.8 : 1.2,
      });
      scene.statusSubtext.anchor.set(0.5, 1);
      scene.statusSubtext.x = winCenterX;
      scene.statusSubtext.y = L.frameY - HUD_BREATH;
      scene.stage.addChild(scene.statusSubtext);
      // WIN amount — anchor bottom-centre, bottom edge sits STATUS_GAP
      // above the status text. Stacks above status, block hugs grid.
      // Format includes a "WIN " prefix so the meaning of the number
      // is unambiguous; the smaller font size matches the more compact
      // top-bar feel.
      const bigWinTxt = new PIXI.Text(fmtWin(0), {
        fontFamily: FONT, fontSize: L.isMobile ? 22 : 28,
        fill: 0xFFD23F, fontWeight: '800',
      });
      bigWinTxt.anchor.set(0.5, 1);
      bigWinTxt.x = winCenterX;
      bigWinTxt.y = scene.statusText.y - scene.statusText.height - STATUS_GAP;
      scene.stage.addChild(bigWinTxt);
      // winPill.y is consumed by fx animations as the WIN visual centre
      // (e.g. pay-text flights). Anchor is (0.5, 1) so visual centre is
      // at .y - .height/2.
      scene.winPill = {
        valText: bigWinTxt,
        x: winCenterX,
        y: bigWinTxt.y - bigWinTxt.height / 2,
      };

      // ── Bottom panel ───────────────────────────────────────────
      // Two layouts share the same controls; placement differs.
      //
      //   Desktop (sw ≥ MOBILE_BREAKPOINT) — single-row cluster:
      //     [info]  [BALANCE pill]  ┌── Clear ──┐  [TOTAL BET]  [PLAY]
      //             [   chips    ]  └── Repeat ─┘
      //
      //   Mobile (sw < MOBILE_BREAKPOINT) — vertical stack:
      //     top bar:  INFO   ────────────────  BALANCE
      //     panel:    [ chips row, full width ]
      //               [ Clear ]  [ Repeat ]   (smaller)
      //               [        TOTAL BET    ]
      //               [          PLAY       ] (full-width CTA)
      const panelTop    = L.frameY + L.frameH + HUD_BREATH;
      const panelBottom = panelTop + L.bottomPanelH;
      const panelCY     = (panelTop + panelBottom) / 2;

      // Chip selector — small rectangular chips. Mobile uses bigger
      // tap-target sizes (≥44pt iOS / ≥48dp Android minimum).
      const chipW   = L.isMobile ? 60 : 44;
      const chipH   = L.isMobile ? 44 : 28;
      const chipGap = L.isMobile ? 12 : 10;
      const chipsW  = CHIP_VALUES.length * chipW + (CHIP_VALUES.length - 1) * chipGap;
      // TOTAL BET — full-width slim row on mobile; fixed-size box on desktop.
      const totalBoxW = L.isMobile ? Math.min(L.sw - 2 * L.hpad, 360) : 150;
      const totalBoxH = L.isMobile ? 40 : 56;
      // CLEAR / REPEAT controls — sized for thumb taps on mobile.
      const ctrlW = L.isMobile ? Math.floor((Math.min(L.sw - 2 * L.hpad, 360) - 12) / 2) : 110;
      const ctrlH = L.isMobile ? 44 : 28;
      const stackInnerGap = 4;
      const stackH        = ctrlH * 2 + stackInnerGap;
      // PLAY button — full canvas-width on mobile.
      const playW = L.isMobile ? Math.min(L.sw - 2 * L.hpad, 360) : 180;
      const playH = L.isMobile ? 56 : 60;
      const sectionGap = 26;

      // ── Helpers (shared between layouts) ──────────────────────
      const makeBalancePill = (label, value, w, h) => {
        const cont = new PIXI.Container();
        const bg = new PIXI.Graphics();
        bg.lineStyle(2, 0xFFD23F, 1);
        bg.beginFill(0x2A3548, 1);
        bg.drawRoundedRect(-w / 2, -h / 2, w, h, 10);
        bg.endFill();
        cont.addChild(bg);
        const lbl = new PIXI.Text(label, {
          fontFamily: FONT, fontSize: 9, fill: 0xFFD23F,
          letterSpacing: 1.8, fontWeight: '700',
        });
        const val = new PIXI.Text(value, {
          fontFamily: FONT, fontSize: 14, fill: 0xFFFFFF, fontWeight: '800',
        });
        const padX = 10;
        lbl.anchor.set(0, 0.5);
        val.anchor.set(1, 0.5);
        lbl.x = -w / 2 + padX;
        val.x =  w / 2 - padX;
        cont.addChild(lbl);
        cont.addChild(val);
        cont.labelText = lbl;
        cont.valText = val;
        return cont;
      };
      const makeChipButton = (value) => {
        const cont = new PIXI.Container();
        cont._chipValue = value;
        const bg = new PIXI.Graphics();
        const txt = new PIXI.Text(`$${value}`, {
          fontFamily: FONT, fontSize: L.isMobile ? 16 : 13,
          fill: 0xFFFFFF, fontWeight: '800',
        });
        txt.anchor.set(0.5);
        cont._draw = (active) => {
          bg.clear();
          bg.lineStyle(active ? 3 : 2, active ? 0x1A2332 : 0xFFD23F, 1);
          bg.beginFill(active ? 0xFFD23F : 0x2A3548, 1);
          bg.drawRoundedRect(-chipW / 2, -chipH / 2, chipW, chipH, 10);
          bg.endFill();
          txt.style.fill = active ? 0x1A2332 : 0xFFFFFF;
        };
        cont._draw(value === player.bet);
        cont.addChild(bg);
        cont.addChild(txt);
        cont.eventMode = 'static';
        cont.cursor = 'pointer';
        cont.hitArea = new PIXI.Rectangle(-chipW / 2, -chipH / 2, chipW, chipH);
        cont.on('pointerover', () => gsap.to(cont.scale, { x: 1.08, y: 1.08, duration: 0.12 }));
        cont.on('pointerout',  () => gsap.to(cont.scale, { x: 1, y: 1, duration: 0.12 }));
        cont.on('pointertap',  () => setChipValue(value));
        return cont;
      };
      const makeControlButton = (label, accent, onTap, w = ctrlW, h = ctrlH, opts = {}) => {
        const cont = new PIXI.Container();
        // Optional dark radial halo behind the button — gives the same
        // "vignette popup" treatment as the end-of-round WIN overlay.
        // Sized ~1.6× the button width so the glow extends visibly past
        // the pill edges without spilling across the whole row.
        if (opts.halo) {
          const halo = makeRadialHalo(Math.max(w * 1.6, h * 3.2));
          halo.x = 0; halo.y = 0;
          cont.addChild(halo);
        }
        const bg = new PIXI.Graphics();
        const draw = (hover = false) => {
          bg.clear();
          bg.lineStyle(2, accent, 1);
          bg.beginFill(hover ? 0x3D4A66 : 0x2A3548, 1);
          bg.drawRoundedRect(-w / 2, -h / 2, w, h, 10);
          bg.endFill();
        };
        draw();
        cont.addChild(bg);
        const t = new PIXI.Text(label, {
          fontFamily: FONT, fontSize: L.isMobile ? 13 : 11,
          fill: 0xFFFFFF, fontWeight: '800', letterSpacing: 1.2,
        });
        t.anchor.set(0.5);
        cont.addChild(t);
        cont.eventMode = 'static';
        cont.cursor = 'pointer';
        cont.hitArea = new PIXI.Rectangle(-w / 2, -h / 2, w, h);
        cont.on('pointerover', () => { draw(true); });
        cont.on('pointerout',  () => { draw(false); });
        cont.on('pointertap', onTap);
        return cont;
      };
      const makeTotalBetBox = (cx, cy, w, h) => {
        const totalBg = new PIXI.Graphics();
        totalBg.lineStyle(2, 0xFFD23F, 1);
        totalBg.beginFill(0x2A3548, 1);
        totalBg.drawRoundedRect(cx - w / 2, cy - h / 2, w, h, 10);
        totalBg.endFill();
        scene.stage.addChild(totalBg);
        if (L.isMobile) {
          // Slim inline row: "TOTAL BET" left, value right.
          const lbl = new PIXI.Text('TOTAL BET', {
            fontFamily: FONT, fontSize: 11, fill: 0xFFD23F,
            letterSpacing: 1.6, fontWeight: '700',
          });
          lbl.anchor.set(0, 0.5);
          lbl.x = cx - w / 2 + 14;
          lbl.y = cy;
          scene.stage.addChild(lbl);
          const txt = new PIXI.Text(fmtCash(0), {
            fontFamily: FONT, fontSize: 16, fill: 0xFFFFFF, fontWeight: '800',
          });
          txt.anchor.set(1, 0.5);
          txt.x = cx + w / 2 - 14;
          txt.y = cy;
          scene.stage.addChild(txt);
          scene.totalBetPill = { valText: txt };
        } else {
          // Stacked label-on-top layout — original desktop look.
          const lbl = new PIXI.Text('TOTAL BET', {
            fontFamily: FONT, fontSize: 9, fill: 0xFFD23F,
            letterSpacing: 1.8, fontWeight: '700',
          });
          lbl.anchor.set(0.5);
          lbl.x = cx;
          lbl.y = cy - h / 2 + 12;
          scene.stage.addChild(lbl);
          const txt = new PIXI.Text(fmtCash(0), {
            fontFamily: FONT, fontSize: 20, fill: 0xFFFFFF, fontWeight: '800',
          });
          txt.anchor.set(0.5);
          txt.x = cx;
          txt.y = cy + 8;
          scene.stage.addChild(txt);
          scene.totalBetPill = { valText: txt };
        }
      };
      const makePlayButton = (cx, cy, w, h) => {
        const btn = new PIXI.Container();
        btn.x = cx; btn.y = cy;
        const playBg = new PIXI.Graphics();
        const drawPlay = (hover = false, dim = false) => {
          playBg.clear();
          playBg.lineStyle(2, 0x065F46, 1);
          playBg.beginFill(dim ? 0x065F46 : (hover ? 0x34D399 : 0x10B981), 1);
          playBg.drawRoundedRect(-w / 2, -h / 2, w, h, 10);
          playBg.endFill();
        };
        drawPlay();
        btn.addChild(playBg);
        const playLbl = new PIXI.Text('PLAY', {
          fontFamily: FONT, fontSize: L.isMobile ? 22 : 24,
          fill: 0xFFFFFF, fontWeight: '800', letterSpacing: 5,
        });
        playLbl.anchor.set(0.5);
        btn.addChild(playLbl);
        btn.eventMode = 'static'; btn.cursor = 'pointer';
        btn.hitArea = new PIXI.Rectangle(-w / 2, -h / 2, w, h);
        btn.on('pointerover', () => { if (!btn.busy) { drawPlay(true);  gsap.to(btn.scale, { x: 1.02, y: 1.02, duration: 0.12 }); } });
        btn.on('pointerout',  () => { if (!btn.busy) { drawPlay(false); gsap.to(btn.scale, { x: 1, y: 1, duration: 0.12 }); } });
        btn.on('pointerdown', () => { if (!btn.busy) gsap.to(btn.scale, { x: 0.97, y: 0.97, duration: 0.08 }); });
        btn.on('pointerup',   () => gsap.to(btn.scale, { x: 1, y: 1, duration: 0.12, ease: 'back.out(2)' }));
        btn.on('pointertap',  () => onSpinClick());
        btn._setBusy = (b) => {
          btn.busy = b;
          btn.alpha = b ? 0.55 : 1;
          btn.cursor = b ? 'default' : 'pointer';
          if (b) {
            playLbl.text = 'UNJAMMING';
            playLbl.style.fontSize = L.isMobile ? 14 : 16;
            playLbl.style.letterSpacing = 1.5;
          } else {
            playLbl.text = 'PLAY';
            playLbl.style.fontSize = L.isMobile ? 22 : 24;
            playLbl.style.letterSpacing = 5;
          }
          drawPlay(false, b);
        };
        scene.stage.addChild(btn);
        return btn;
      };

      scene.ctrlButtons = {};
      // BUY FEATURE intentionally off in rush mode.
      scene.buyBtn = null;

      // ── SPECIAL BETS button + radio ─────────────────────────────
      // Two layouts:
      //   Desktop: SQUARE block placed to the LEFT of the grid (matches
      //     the Pragmatic-Play "SPECIAL BETS / N OPTIONS" tile). Two
      //     stacked text lines: caption ("SPECIAL BETS" or active mode
      //     name) + sub-line ("4 OPTIONS" or active cost).
      //   Mobile: Horizontal PILL at the top of the bottom panel
      //     (single line: name + cost when active, "SPECIAL BETS"
      //     otherwise) — no horizontal space beside the grid in
      //     portrait.
      // The radio sits below the desktop block / beside the mobile
      // pill and uses the standard radio look (outline + filled inner
      // dot when active).
      const sbW = L.isMobile ? Math.min(L.sw - 2 * L.hpad, 360) : 110;
      // Desktop block now houses the toggle inside, so it needs more
      // vertical room (text rows up top + toggle near the bottom).
      const sbH = L.isMobile ? 38 : 140;
      const sbRadioR = L.isMobile ? 14 : 16;
      const makeSpecialBetsBtn = () => {
        const cont = new PIXI.Container();
        const bg = new PIXI.Graphics();
        cont.addChild(bg);
        const isMobile = L.isMobile;
        // Two text rows on desktop (caption + sub-line). Mobile uses
        // a single line and ignores the sub-line.
        const lblTop = new PIXI.Text('', {
          fontFamily: FONT, fontSize: isMobile ? 13 : 14,
          fill: 0xFFFFFF, fontWeight: '800', letterSpacing: 1.6,
          align: 'center',
        });
        lblTop.anchor.set(0.5);
        cont.addChild(lblTop);
        const lblSub = new PIXI.Text('', {
          fontFamily: FONT, fontSize: 11,
          fill: 0xFFD23F, fontWeight: '700', letterSpacing: 1.2,
          align: 'center',
        });
        lblSub.anchor.set(0.5);
        if (!isMobile) cont.addChild(lblSub);
        const draw = (active, hover = false) => {
          bg.clear();
          const fill   = active ? 0xFFD23F : (hover ? 0x3D4A66 : 0x2A3548);
          const stroke = active ? 0x1A2332 : 0xFFD23F;
          bg.lineStyle(active ? 3 : 2, stroke, 1);
          bg.beginFill(fill, 1);
          bg.drawRoundedRect(-sbW / 2, -sbH / 2, sbW, sbH, 10);
          bg.endFill();
          lblTop.style.fill = active ? 0x1A2332 : 0xFFFFFF;
          lblSub.style.fill = active ? 0x1A2332 : 0xFFD23F;
        };
        // Desktop: caption sits at the top, sub-line just below it,
        // toggle slot at the bottom of the block (added externally).
        // Mobile: single centred caption.
        if (isMobile) {
          lblTop.x = 0; lblTop.y = 0;
        } else {
          lblTop.x = 0; lblTop.y = -sbH * 0.30;
          lblSub.x = 0; lblSub.y = -sbH * 0.04;
        }
        cont._draw = draw;
        cont._lblTop = lblTop;
        cont._lblSub = lblSub;
        cont.eventMode = 'static';
        cont.cursor = 'pointer';
        cont.hitArea = new PIXI.Rectangle(-sbW / 2, -sbH / 2, sbW, sbH);
        cont.on('pointerover', () => { if (ANTE_MODE === 'base') draw(false, true); });
        cont.on('pointerout',  () => { if (ANTE_MODE === 'base') draw(false, false); });
        cont.on('pointertap',  () => openSpecialBetsModal());
        return cont;
      };
      // iOS-style toggle switch — pill-shaped track with a sliding
      // knob. Off: knob left + dark track. On: knob right + yellow
      // track. Tapping the toggle while ON returns to base mode;
      // tapping while OFF opens the modal so the player can pick a
      // special bet to activate.
      const sbToggleH = sbRadioR * 2;        // track height
      const sbToggleW = sbToggleH * 1.85;    // standard ~2:1 aspect
      const makeSpecialBetsRadio = () => {
        const cont = new PIXI.Container();
        const track = new PIXI.Graphics();
        const knob  = new PIXI.Graphics();
        cont.addChild(track);
        cont.addChild(knob);
        const knobR = sbToggleH / 2 - 3;
        const knobOff = -sbToggleW / 2 + knobR + 3;
        const knobOn  =  sbToggleW / 2 - knobR - 3;
        let _activeState = false;
        const draw = (active) => {
          _activeState = active;
          track.clear();
          // Off: dark slate track + dim grey border, knob is muted
          //      grey (clearly "inactive" — no yellow accent at all).
          // On:  saturated yellow track + dark navy knob (active accent).
          // Pairing knob colour to state makes off-vs-on read-at-a-glance
          // even on small displays.
          if (active) {
            track.lineStyle(2, 0x1A2332, 1);
            track.beginFill(0xFFD23F, 1);
          } else {
            track.lineStyle(2, 0x4A5C7A, 1);
            track.beginFill(0x2A3548, 1);
          }
          track.drawRoundedRect(-sbToggleW / 2, -sbToggleH / 2,
                                sbToggleW, sbToggleH, sbToggleH / 2);
          track.endFill();
          knob.clear();
          knob.beginFill(active ? 0x1A2332 : 0x6E7B8C, 1);
          knob.drawCircle(0, 0, knobR);
          knob.endFill();
          // Animate knob slide on state changes; instant snap on first paint.
          gsap.killTweensOf(knob);
          gsap.to(knob, {
            x: active ? knobOn : knobOff,
            duration: cont._initialised ? 0.18 : 0,
            ease: 'power2.out',
          });
          cont._initialised = true;
        };
        cont._draw = draw;
        cont.eventMode = 'static';
        cont.cursor = 'pointer';
        cont.hitArea = new PIXI.Rectangle(
          -sbToggleW / 2 - 4, -sbToggleH / 2 - 4,
          sbToggleW + 8, sbToggleH + 8,
        );
        cont.on('pointertap', (e) => {
          // Toggle now lives INSIDE the block container; without
          // stopPropagation the parent block's pointertap would also
          // fire (and re-open the modal on every off→on toggle tap).
          if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
          if (ANTE_MODE === 'base') {
            // Off → tap opens the modal so the player picks a mode.
            openSpecialBetsModal();
          } else {
            // On → tap reverts to base.
            setAnteMode('base');
            if (scene._refreshSpecialBetsBtn) scene._refreshSpecialBetsBtn();
            if (typeof refreshHUD === 'function') refreshHUD();
          }
        });
        return cont;
      };
      scene.specialBetsBtn   = makeSpecialBetsBtn();
      scene.specialBetsRadio = makeSpecialBetsRadio();
      // Module-scoped refresher so other call sites (modal selection,
      // refreshHUD on bet change) can sync the button label/state.
      function refreshSpecialBetsBtn() {
        if (!scene.specialBetsBtn) return;
        const ante = getAnteDef();
        const active = ante.key !== 'base';
        scene.specialBetsBtn._draw(active);
        const top = scene.specialBetsBtn._lblTop;
        const sub = scene.specialBetsBtn._lblSub;
        if (L.isMobile) {
          if (top) {
            top.text = active
              ? `${ante.name} · +${ante.costMult}× BET`
              : 'SPECIAL BETS';
          }
        } else {
          if (top) top.text = active ? ante.name      : 'SPECIAL\nBETS';
          if (sub) sub.text = active ? `+${ante.costMult}× BET` : '4 OPTIONS';
        }
        if (scene.specialBetsRadio) scene.specialBetsRadio._draw(active);
      }
      scene._refreshSpecialBetsBtn = refreshSpecialBetsBtn;

      if (L.isMobile) {
        // ─── Mobile portrait: top bar + vertical bottom panel ─────
        // Top bar — INFO icon left, BALANCE pill right.
        const tbCY = L.topBarH / 2;
        scene.infoBtn.x = L.hpad + infoSize / 2;
        scene.infoBtn.y = tbCY;
        const balW = Math.min(190, L.sw / 2);
        scene.balancePill = makeBalancePill('BALANCE', fmtCash(player.balance), balW, 28);
        scene.balancePill.x = L.sw - L.hpad - balW / 2;
        scene.balancePill.y = tbCY;
        scene.stage.addChild(scene.balancePill);

        // Bottom panel — vertical stack. Compute row Y positions so
        // all 5 rows (special-bets, chips, ctrl, total, play) plus
        // the gaps between them add up to bottomPanelH.
        const ROW_GAP = 10;
        const rowsH   = sbH + chipH + ctrlH + totalBoxH + playH;
        const totalGaps = ROW_GAP * 4;
        const stackTop  = panelTop + (L.bottomPanelH - rowsH - totalGaps) / 2;
        const sbRowCY    = stackTop + sbH / 2;
        const chipsRowCY = sbRowCY    + sbH / 2 + ROW_GAP + chipH / 2;
        const ctrlRowCY  = chipsRowCY + chipH / 2 + ROW_GAP + ctrlH / 2;
        const totalCY    = ctrlRowCY  + ctrlH / 2 + ROW_GAP + totalBoxH / 2;
        const playCY     = totalCY    + totalBoxH / 2 + ROW_GAP + playH / 2;
        const centerX    = L.sw / 2;
        // SPECIAL BETS button + radio — pill centred, radio to its right.
        const sbRadioGap = 12;
        const sbBtnCX = centerX - sbRadioR - sbRadioGap / 2;
        const sbRadioCX = sbBtnCX + sbW / 2 + sbRadioGap + sbRadioR;
        scene.specialBetsBtn.x   = sbBtnCX;
        scene.specialBetsBtn.y   = sbRowCY;
        scene.specialBetsRadio.x = sbRadioCX;
        scene.specialBetsRadio.y = sbRowCY;
        scene.stage.addChild(scene.specialBetsBtn);
        scene.stage.addChild(scene.specialBetsRadio);

        // Chips row (centred).
        scene.chipBtns = [];
        let cX = centerX - chipsW / 2 + chipW / 2;
        for (const v of CHIP_VALUES) {
          const c = makeChipButton(v);
          c.x = cX; c.y = chipsRowCY;
          scene.stage.addChild(c);
          scene.chipBtns.push(c);
          cX += chipW + chipGap;
        }
        // Ctrl row — Clear | Repeat side-by-side.
        const ctrlGap = 12;
        const ctrlPairW = ctrlW * 2 + ctrlGap;
        const clearCX = centerX - ctrlPairW / 2 + ctrlW / 2;
        const repeatCX = centerX + ctrlPairW / 2 - ctrlW / 2;
        const clearBtn = makeControlButton('Clear Bets', 0xE63946, () => clearAllArrowBets());
        clearBtn.x = clearCX; clearBtn.y = ctrlRowCY;
        scene.stage.addChild(clearBtn);
        scene.ctrlButtons.clear = clearBtn;
        const repeatBtn = makeControlButton('Repeat Bet', 0xFFD23F, () => repeatLastBets());
        repeatBtn.x = repeatCX; repeatBtn.y = ctrlRowCY;
        scene.stage.addChild(repeatBtn);
        scene.ctrlButtons.repeat = repeatBtn;
        // TOTAL BET — full-width slim row.
        makeTotalBetBox(centerX, totalCY, totalBoxW, totalBoxH);
        // PLAY — full-width CTA at the bottom.
        scene.spinBtn = makePlayButton(centerX, playCY, playW, playH);
      } else {
        // ─── Desktop: single-row cluster (original layout) ────────
        // SPECIAL BETS button + radio are placed AS A SQUARE BLOCK
        // to the LEFT of the grid (further down, after this if/else)
        // so they're not part of the bottom-panel row.
        const clusterCY = panelCY;

        // SPECIAL BETS square block centred vertically against the
        // grid's left edge. Radio sits below the block. Both are
        // placed BELOW after the if/else (they don't depend on the
        // cluster geometry).

        // BALANCE pill sits ABOVE the chips, same width as chips.
        const balancePillH = 28;
        const colInnerGap  = 4;
        const colH         = balancePillH + colInnerGap + chipH;
        const colTop       = clusterCY - colH / 2;
        const balancePillCY = colTop + balancePillH / 2;
        const chipsRowCY    = colTop + balancePillH + colInnerGap + chipH / 2;

        const rowW    = chipsW + sectionGap + ctrlW + sectionGap + totalBoxW + sectionGap + playW;
        const rowLeft = (L.sw - rowW) / 2;
        scene.infoBtn.x = rowLeft - 18 - infoSize / 2;
        scene.infoBtn.y = clusterCY;

        scene.balancePill = makeBalancePill('BALANCE', fmtCash(player.balance), chipsW, balancePillH);
        scene.balancePill.x = rowLeft + chipsW / 2;
        scene.balancePill.y = balancePillCY;
        scene.stage.addChild(scene.balancePill);

        scene.chipBtns = [];
        let chipX = rowLeft + chipW / 2;
        for (const v of CHIP_VALUES) {
          const c = makeChipButton(v);
          c.x = chipX; c.y = chipsRowCY;
          scene.stage.addChild(c);
          scene.chipBtns.push(c);
          chipX += chipW + chipGap;
        }
        const afterChipsX = rowLeft + chipsW + sectionGap;

        const stackTopRowCY    = clusterCY - (stackH / 2) + ctrlH / 2;
        const stackBottomRowCY = clusterCY + (stackH / 2) - ctrlH / 2;
        const stackCX          = afterChipsX + ctrlW / 2;
        const clearBtn = makeControlButton('Clear Bets', 0xE63946, () => clearAllArrowBets());
        clearBtn.x = stackCX; clearBtn.y = stackTopRowCY;
        scene.stage.addChild(clearBtn);
        scene.ctrlButtons.clear = clearBtn;
        const repeatBtn = makeControlButton('Repeat Bet', 0xFFD23F, () => repeatLastBets());
        repeatBtn.x = stackCX; repeatBtn.y = stackBottomRowCY;
        scene.stage.addChild(repeatBtn);
        scene.ctrlButtons.repeat = repeatBtn;

        const afterStackX = afterChipsX + ctrlW + sectionGap;
        const totalCX = afterStackX + totalBoxW / 2;
        makeTotalBetBox(totalCX, clusterCY, totalBoxW, totalBoxH);
        const afterTotalX = afterStackX + totalBoxW + sectionGap;

        scene.spinBtn = makePlayButton(afterTotalX + playW / 2, clusterCY, playW, playH);

        // ── Desktop: SPECIAL BETS square block at the LEFT of grid.
        // Sits in the canvas margin between the left edge and the
        // grid's left edge with comfortable breathing room. The
        // toggle switch lives INSIDE the block at the bottom.
        const sbFrameGap = 40;          // gap between block and grid frame
        const sbBlockX = Math.max(L.hpad + sbW / 2, L.frameX - sbFrameGap - sbW / 2);
        const sbBlockY = L.frameY + sbH / 2 + 8;
        scene.specialBetsBtn.x = sbBlockX;
        scene.specialBetsBtn.y = sbBlockY;
        scene.stage.addChild(scene.specialBetsBtn);
        // Toggle: child of the block container so it lives inside
        // the rectangle. Local coords — y near the bottom edge with
        // padding above and below.
        scene.specialBetsRadio.x = 0;
        scene.specialBetsRadio.y = sbH * 0.30;
        scene.specialBetsBtn.addChild(scene.specialBetsRadio);
      }
      // Render the SPECIAL BETS pill in the right state for the
      // currently-selected ante mode (base = neutral, otherwise active).
      refreshSpecialBetsBtn();

      // ── REPEAT BET overlay — appears at the centre of the inner grid
      // after a round resolves (won or lost), prompting the player to
      // re-stake the same pattern. Auto-dismisses on:
      //   • the player tapping it (which re-applies player.lastBets)
      //   • the player tapping any arrow / placing a fresh bet
      //   • the next spin starting
      const _slotColOffset = (MODE === 'allAround' || MODE === 'rush' || MODE === 'base' || MODE === 'officer') ? 1 : 0;
      const _gridLeft = L.frameX + (L.cellSize + L.cellGap) * _slotColOffset;
      const _gridTop  = L.frameY + (L.cellSize + L.cellGap) * 1;
      const _gridW    = GAME.COLS * L.cellSize + (GAME.COLS - 1) * L.cellGap;
      const _gridH    = GAME.ROWS * L.cellSize + (GAME.ROWS - 1) * L.cellGap;
      // Mobile uses absolute pixel sizes (≥44pt thumb-friendly), but
      // capped at the slot grid width so the button doesn't cover the
      // left/right arrow rings.
      // Desktop scales with gameScale so the button fits inside the
      // grid centre without looking oversized on big monitors.
      const rbW = L.isMobile ? Math.min(_gridW, 240) : 200 * gs;
      const rbH = L.isMobile ? 52 : 60 * gs;
      const rbStrokeW = L.isMobile ? 2 : 2 * gs;
      const rbCornerR = L.isMobile ? 10 : 10 * gs;
      const rbBtn = new PIXI.Container();
      rbBtn.x = _gridLeft + _gridW / 2;
      rbBtn.y = _gridTop  + _gridH / 2;
      const rbBg = new PIXI.Graphics();
      const drawRb = (hover = false) => {
        rbBg.clear();
        rbBg.lineStyle(rbStrokeW, 0x065F46, 1);
        rbBg.beginFill(hover ? 0x34D399 : 0x10B981, 1);
        rbBg.drawRoundedRect(-rbW / 2, -rbH / 2, rbW, rbH, rbCornerR);
        rbBg.endFill();
      };
      drawRb();
      rbBtn.addChild(rbBg);
      const rbLbl = new PIXI.Text('REPEAT BET', {
        fontFamily: FONT, fontSize: L.isMobile ? 18 : 18 * gs, fontWeight: '800',
        fill: 0xFFFFFF, letterSpacing: 2,
      });
      rbLbl.anchor.set(0.5);
      rbBtn.addChild(rbLbl);
      rbBtn.eventMode = 'static';
      rbBtn.cursor = 'pointer';
      rbBtn.hitArea = new PIXI.Rectangle(-rbW / 2, -rbH / 2, rbW, rbH);
      rbBtn.on('pointerover', () => { drawRb(true);  gsap.to(rbBtn.scale, { x: 1.05, y: 1.05, duration: 0.12 }); });
      rbBtn.on('pointerout',  () => { drawRb(false); gsap.to(rbBtn.scale, { x: 1, y: 1, duration: 0.12 }); });
      rbBtn.on('pointertap',  () => {
        // Restage the previous round's bets, then auto-spin. One-tap
        // re-roll: the player doesn't have to tap PLAY again after.
        repeatLastBets();
        hideRepeatBetButton();
        // Only fire the spin if repeatLastBets actually staged
        // something (e.g. it bails out silently on insufficient
        // balance). Check player.arrowBets for >0 before spinning.
        if (sumArrowBets(player.arrowBets) > 0) {
          onSpinClick();
        }
      });
      rbBtn.alpha = 0;
      rbBtn.visible = false;
      rbBtn.scale.set(0.85);
      scene.stage.addChild(rbBtn);
      scene.repeatBetBtn = rbBtn;

      // ── End-of-round WIN popup — sits ABOVE the REPEAT BET button.
      // Background is a radial gradient (yellow → transparent) drawn
      // on a canvas so it has soft edges with no hard rectangle, and
      // looks like a glow rather than a panel. The amount text sits
      // on top, large and centred on the same x as REPEAT BET.
      // Visibility is gated by setRoundStatus + win > 0.
      // Halo diameter must cover the WIN label, amount, AND REPEAT BET
      // button stack. Desktop scales with gs (UI proportions track
      // cellSize); mobile uses an absolute floor so the halo reaches
      // past the absolute-sized button + text without going wider than
      // the slot grid.
      const winPopupGlowSize = L.isMobile
        ? Math.round(Math.min(_gridW * 1.6, 360))
        : Math.round(420 * gs);
      // Soft dark radial halo — black-ish at centre fading to fully
      // transparent at the edges. Sits BEHIND both the WIN texts and
      // the REPEAT BET button so it reads like a vignette/aura, not a
      // panel. Sim sandbox lacks canvas.getContext, so a multi-circle
      // PIXI fallback is used there.
      const winPopup = new PIXI.Container();
      const winPopupGlow = makeRadialHalo(winPopupGlowSize);
      winPopupGlow.x = 0; winPopupGlow.y = 0;
      winPopup.addChild(winPopupGlow);
      // Mobile uses absolute font + offset values so the text doesn't
      // collide with the absolute-sized REPEAT BET button beneath it.
      // (On desktop, both the button and this text scale with gs, so
      // their proportions stay locked.)
      const winPopupLblFS = L.isMobile ? 14 : 18 * gs;
      const winPopupAmtFS = L.isMobile ? 36 : 56 * gs;
      const winPopupLbl = new PIXI.Text('WIN', {
        fontFamily: FONT, fontSize: winPopupLblFS, fontWeight: '700',
        fill: 0xFFFFFF, letterSpacing: 4,
      });
      winPopupLbl.anchor.set(0.5, 0);
      winPopupLbl.x = 0;
      // Stack: WIN label on top, amount below, then button. On mobile
      // we anchor offsets to the absolute rbH so the gap above the
      // button reads clean regardless of how small gs is.
      winPopupLbl.y = L.isMobile
        ? -(rbH / 2 + 14 + winPopupAmtFS + winPopupLblFS + 6)
        : -135 * gs;
      winPopup.addChild(winPopupLbl);
      const winPopupAmt = new PIXI.Text(fmtCash(0), {
        fontFamily: FONT, fontSize: winPopupAmtFS, fontWeight: '800',
        fill: 0xFFD23F,
      });
      winPopupAmt.anchor.set(0.5, 0);
      winPopupAmt.x = 0;
      winPopupAmt.y = L.isMobile
        ? -(rbH / 2 + 14 + winPopupAmtFS)
        : -113 * gs;
      winPopup.addChild(winPopupAmt);
      // Position the popup centred on the GRID CENTRE — same anchor
      // point as the REPEAT BET button. The glow halo sits behind the
      // button; the WIN text floats above the button inside the glow.
      winPopup.x = rbBtn.x;
      winPopup.y = rbBtn.y;
      winPopup.alpha = 0;
      winPopup.visible = false;
      winPopup.scale.set(0.7);
      // Insert the popup BEHIND the REPEAT BET button so the dark
      // gradient halo reads as a backdrop, not a foreground panel.
      // The WIN texts inside winPopup live above the button area
      // (y = -113 / -135 of grid centre) so they don't visually
      // collide with rbBtn even though they're z-ordered behind it.
      const _rbIdx = (scene.stage.children || []).indexOf(rbBtn);
      if (_rbIdx >= 0 && typeof scene.stage.addChildAt === 'function') {
        scene.stage.addChildAt(winPopup, _rbIdx);
      } else {
        scene.stage.addChild(winPopup);
      }
      scene.winPopup = { container: winPopup, amtText: winPopupAmt, lblText: winPopupLbl };

      // ── Click-trap for the popup ──
      // Fullscreen invisible rectangle that sits BETWEEN the popup
      // backdrop (winPopup) and the REPEAT BET button. Any tap that
      // lands on the trap (i.e. anywhere outside rbBtn while the popup
      // is visible) dismisses both pieces. rbBtn sits above the trap
      // so its own tap continues to fire repeatLastBets+autoSpin.
      const popupTrap = new PIXI.Graphics();
      popupTrap.beginFill(0x000000, 0.001);   // alpha just high enough to be hit-testable
      popupTrap.drawRect(0, 0, L.sw, L.sh);
      popupTrap.endFill();
      popupTrap.eventMode = 'static';
      popupTrap.cursor    = 'default';
      popupTrap.visible   = false;
      popupTrap.on('pointertap', () => {
        hideRepeatBetButton();
        hideWinPopup();
      });
      // Insert the trap just below rbBtn, so it covers everything
      // beneath the popup chrome but rbBtn still receives its taps.
      const _rbIdx2 = (scene.stage.children || []).indexOf(rbBtn);
      if (_rbIdx2 >= 0 && typeof scene.stage.addChildAt === 'function') {
        scene.stage.addChildAt(popupTrap, _rbIdx2);
      } else {
        scene.stage.addChild(popupTrap);
      }
      scene.popupTrap = popupTrap;

      // ── Debug RTP overlay (BB pattern). Low-contrast text near the
      // bottom edge — shows live measured RTP, spin count, hit rate.
      scene.rtpText = new PIXI.Text('RTP 0.00%  |  Spins 0', {
        fontFamily: FONT, fontSize: 13 * gs, fill: 0x4A5C7A, fontWeight: '600',
      });
      scene.rtpText.anchor.set(0.5);
      scene.rtpText.alpha = 0.7;
      scene.rtpText.x = L.sw / 2;
      scene.rtpText.y = L.sh - 18 * gs;
      // Hide on mobile — would overlap the PLAY button on small canvases.
      if (L.isMobile) scene.rtpText.visible = false;
      scene.stage.addChild(scene.rtpText);

      // Per-mode scene widget hook (BB-style). Currently a no-op for
      // rush, kept so future widgets can plug in here.
      window.RushHour.getModeDef().buildSceneFeatureWidget?.(scene, app, { L, frame, gs });

      // Sync HUD state (gating, free-spin banner) on first paint AND every
      // rebuild so resize-during-feature still shows the correct controls.
      refreshHUD();
    }

    // Tracks the last balance value DISPLAYED on the pill (not necessarily
    // the live player.balance). Used as the count-up source so subsequent
    // updates animate from the visible value, not the engine value.
    let _displayedBalance = null;
    function refreshHUD(opts) {
      // Balance is animated when changing; instant-set on initial paint /
      // bet cycles to avoid distracting tweens. opts.animateBalance = true
      // lets call sites opt in to the animation (spin payouts).
      if (scene.balancePill && scene.balancePill.valText) {
        if (_displayedBalance == null) _displayedBalance = player.balance;
        if (opts && opts.animateBalance) {
          tweenCount(scene.balancePill.valText, _displayedBalance, player.balance);
        } else {
          scene.balancePill.valText.text = fmtCash(player.balance);
          if (scene.balancePill.valText._countTween) {
            scene.balancePill.valText._countTween.kill();
            scene.balancePill.valText._countTween = null;
          }
        }
        _displayedBalance = player.balance;
      }
      if (scene.totalBetPill && scene.totalBetPill.valText) {
        // TOTAL BET = actual cost deducted on PLAY (stakes × ante.costMult).
        // Per-arrow stakes are the "1× bet" used for win calculation;
        // total cost is what the player pays after the ante multiplier.
        const stakes = sumArrowBets(player.arrowBets);
        const costMult = getAnteDef().costMult || 1;
        scene.totalBetPill.valText.text = fmtCash(stakes * costMult);
      }
      refreshChipSelector();
      refreshControlButtonsEnabled();
      refreshRoundStatusText();
      updateSpinButtonState();
      refreshFreeSpinBanner();
      if (scene.buyBtn && scene.buyBtn._refresh) scene.buyBtn._refresh();
      updateRtpText();
    }
    function refreshControlButtonsEnabled() {
      if (!scene.ctrlButtons) return;
      const busy = !!(scene.spinBtn && scene.spinBtn.busy);
      const hasBets   = sumArrowBets(player.arrowBets) > 0;
      const hasLast   = sumArrowBets(player.lastBets || {}) > 0;
      const apply = (btn, enabled) => {
        if (!btn) return;
        btn.alpha = enabled ? 1 : 0.4;
        btn.eventMode = enabled ? 'static' : 'none';
        btn.cursor = enabled ? 'pointer' : 'default';
      };
      apply(scene.ctrlButtons.clear,  !busy && hasBets);
      apply(scene.ctrlButtons.repeat, !busy && !hasBets && hasLast);
      // Chip selector is also locked while spinning.
      if (scene.chipBtns) {
        for (const c of scene.chipBtns) {
          c.alpha = busy ? 0.4 : 1;
          c.eventMode = busy ? 'none' : 'static';
          c.cursor = busy ? 'default' : 'pointer';
        }
      }
    }
    // Live debug overlay — RTP / spin count / avg win pinned to the bottom
    // of the canvas. Low-contrast so it doesn't compete with the HUD pills.
    function updateRtpText() {
      if (!scene.rtpText) return;
      const s = window.RushHour.stats;
      const pct = (s.rtp * 100).toFixed(2);
      scene.rtpText.text = `RTP ${pct}%   |   Spins ${s.spins}   |   Hit ${(s.hitRate * 100).toFixed(1)}%   |   Avg win ${s.avgWin.toFixed(2)}`;
    }
    function setWinDisplay(amount) {
      if (!scene.winPill || !scene.winPill.valText) return;
      // Smooth count-up from the currently-displayed value to the
      // target, formatted with the "WIN " prefix.
      const t = scene.winPill.valText;
      const fromVal = _readWinDisplay();
      tweenCount(t, fromVal, amount, 0.6, fmtWin);
    }
    function _readWinDisplay() {
      if (!scene.winPill || !scene.winPill.valText) return 0;
      const txt = scene.winPill.valText.text || 'WIN  $0.00';
      // Strip everything that isn't a digit / decimal point.
      const n = parseFloat(txt.replace(/[^\d.]/g, ''));
      return isNaN(n) ? 0 : n;
    }

    // ── Spin / bet gating (BB pattern) ───────────────────────────────────────
    function isSpinning() {
      return !!(scene.spinBtn && scene.spinBtn.busy);
    }
    function inFreeSpinFeature() {
      return !!(game && game.state && (game.state.inFreeSpin || game.state.freeSpinsBank > 0));
    }
    function canAffordSpin() {
      if (inFreeSpinFeature()) return true;
      // Multi-bet roulette: total cost = stakes × ante.costMult.
      // costMult is the TOTAL multiplier (base = 1, ante 2× = 2, etc.).
      const stakes = sumArrowBets(player.arrowBets);
      const costMult = getAnteDef().costMult || 1;
      return stakes > 0 && player.balance >= stakes * costMult;
    }
    function refreshArrowBetVisuals() {
      if (!scene.arrowBetTexts) return;
      const busy = !!(scene.spinBtn && scene.spinBtn.busy);
      // Show the ACTUAL cost per arrow (stake × ante.costMult) — what
      // the player pays on PLAY, not the 1× win-calc base.
      const costMult = getAnteDef().costMult || 1;
      for (const pos in scene.arrowBetTexts) {
        const stake = player.arrowBets[+pos] || 0;
        const txt = scene.arrowBetTexts[pos];
        if (txt) txt.text = stake > 0 ? fmtCashCompact(stake * costMult) : '';
        // Spin-time dim. Three states for un-staked cells:
        //   • not boosted → entire cell fades to ~30% (existing behaviour)
        //   • boosted     → ONLY the multiplier text + indicator chevron
        //                   stay bright; arrow + border still fade so
        //                   the cell doesn't read as "I bet on this"
        //   • staked      → full brightness regardless
        const isBoosted = scene.boostedArrows && scene.boostedArrows[+pos];
        const cell      = scene.ringCells && scene.ringCells[pos];
        const cellBg    = scene.ringCellBgs && scene.ringCellBgs[pos];
        const chev      = scene.arrowChevrons && scene.arrowChevrons[pos];
        const oddsTxt   = scene.arrowOddsTexts && scene.arrowOddsTexts[pos];
        const glow      = scene._stakeGlows && scene._stakeGlows[pos];
        const dim       = busy && stake === 0;
        // Staked cells get a soft pulsing yellow halo behind them.
        if (glow) {
          if (stake > 0) {
            if (!glow.visible) {
              glow.visible = true;
              gsap.killTweensOf(glow);
              glow.alpha = 0.55;
              gsap.to(glow, {
                alpha: 1.0, duration: 0.85,
                ease: 'sine.inOut', yoyo: true, repeat: -1,
              });
            }
          } else {
            if (glow.visible) {
              gsap.killTweensOf(glow);
              glow.alpha = 1;
              glow.visible = false;
            }
          }
        }
        if (cell) {
          if (dim && isBoosted) {
            // Container at full alpha so the multiplier + indicator can
            // pop; bg + chevron individually dimmed.
            cell.alpha = 1.0;
            if (cellBg)  cellBg.alpha  = 0.32;
            if (chev)    chev.alpha    = 0.32;
            if (oddsTxt) oddsTxt.alpha = 1.0;
          } else if (dim) {
            cell.alpha = 0.32;
            // Make sure children are at their default in case they were
            // selectively dimmed previously and the boost cleared.
            if (cellBg)  cellBg.alpha  = 1.0;
            if (chev)    chev.alpha    = 1.0;
            if (oddsTxt) oddsTxt.alpha = 1.0;
          } else {
            cell.alpha = 1.0;
            if (cellBg)  cellBg.alpha  = 1.0;
            if (chev)    chev.alpha    = 1.0;
            if (oddsTxt) oddsTxt.alpha = 1.0;
          }
        }
        // Stake chip BG + trash icon only show when there's a stake.
        const chipBg = scene._stakeChipBgs && scene._stakeChipBgs[pos];
        if (chipBg) chipBg.visible = stake > 0;
        const trash = scene.arrowMinusBtns && scene.arrowMinusBtns[pos];
        if (trash) trash.visible = !busy && stake > 0;
      }
    }
    function onArrowAddOne(pos) {
      if (scene.spinBtn && scene.spinBtn.busy) return;
      const stake = player.arrowBets[pos] || 0;
      const projectedTotal = sumArrowBets(player.arrowBets) + player.bet;
      if (projectedTotal > player.balance) {
        flashInsufficientBalance();
        return;
      }
      player.arrowBets[pos] = stake + player.bet;
      // First chip placed after a resolved round — clear the status.
      if (roundStatus === 'won' || roundStatus === 'lost') setRoundStatus('idle');
      refreshArrowBetVisuals();
      refreshHUD();
    }
    function onArrowSubtractOne(pos) {
      if (scene.spinBtn && scene.spinBtn.busy) return;
      const cur = player.arrowBets[pos] || 0;
      if (cur <= 0) return;
      const next = Math.max(0, cur - player.bet);
      if (next === 0) delete player.arrowBets[pos];
      else            player.arrowBets[pos] = next;
      if (roundStatus === 'won' || roundStatus === 'lost') setRoundStatus('idle');
      refreshArrowBetVisuals();
      refreshHUD();
    }
    function onArrowClear(pos) {
      if (scene.spinBtn && scene.spinBtn.busy) return;
      if (!(pos in player.arrowBets)) return;
      delete player.arrowBets[pos];
      if (roundStatus === 'won' || roundStatus === 'lost') setRoundStatus('idle');
      refreshArrowBetVisuals();
      refreshHUD();
    }
    function clearAllArrowBets() {
      if (scene.spinBtn && scene.spinBtn.busy) return;
      player.arrowBets = {};
      // Coming back to a fresh canvas — exit any "won/lost" status.
      if (roundStatus !== 'spinning') setRoundStatus('idle');
      refreshArrowBetVisuals();
      refreshHUD();
    }
    // Quick-stake chip selector — sets the chip value placed by each
    // arrow tap. Highlights the active chip.
    function setChipValue(v) {
      if (scene.spinBtn && scene.spinBtn.busy) return;
      player.bet = v;
      refreshHUD();
      refreshChipSelector();
    }
    function refreshChipSelector() {
      if (!scene.chipBtns) return;
      for (const btn of scene.chipBtns) {
        if (btn._draw) btn._draw(btn._chipValue === player.bet);
      }
    }
    // REPEAT — re-applies the previous round's stake pattern.
    function repeatLastBets() {
      if (scene.spinBtn && scene.spinBtn.busy) return;
      const total = sumArrowBets(player.lastBets || {});
      if (total <= 0) return;
      if (total > player.balance) { flashInsufficientBalance(); return; }
      player.arrowBets = { ...player.lastBets };
      if (roundStatus !== 'spinning') setRoundStatus('idle');
      refreshArrowBetVisuals();
      refreshHUD();
    }
    // ×2 / ÷2 — scale every staked amount by `factor`.
    function scaleAllBets(factor) {
      if (scene.spinBtn && scene.spinBtn.busy) return;
      const cur = sumArrowBets(player.arrowBets);
      if (cur <= 0) return;
      const next = {};
      for (const pos in player.arrowBets) {
        const v = Math.max(0, Math.round(player.arrowBets[pos] * factor));
        if (v > 0) next[pos] = v;
      }
      const total = sumArrowBets(next);
      if (total > player.balance) { flashInsufficientBalance(); return; }
      player.arrowBets = next;
      if (roundStatus !== 'spinning') setRoundStatus('idle');
      refreshArrowBetVisuals();
      refreshHUD();
    }
    // Show/hide helpers for the centre-of-grid REPEAT BET overlay.
    function showRepeatBetButton() {
      const btn = scene.repeatBetBtn;
      if (!btn) return;
      // Only meaningful if there's a last bet pattern AND the player can afford it.
      const total = sumArrowBets(player.lastBets || {});
      if (total <= 0) return;
      if (total > player.balance) return;
      btn.visible = true;
      if (scene.popupTrap) scene.popupTrap.visible = true;
      gsap.killTweensOf(btn);
      gsap.killTweensOf(btn.scale);
      gsap.fromTo(btn,       { alpha: 0 }, { alpha: 1, duration: 0.25 });
      gsap.fromTo(btn.scale, { x: 0.85, y: 0.85 }, { x: 1, y: 1, duration: 0.40, ease: 'back.out(2.4)' });
    }
    function hideRepeatBetButton() {
      const btn = scene.repeatBetBtn;
      if (!btn || !btn.visible) return;
      if (scene.popupTrap) scene.popupTrap.visible = false;
      gsap.killTweensOf(btn);
      gsap.to(btn, {
        alpha: 0, duration: 0.18, ease: 'power2.in',
        onComplete: () => { btn.visible = false; },
      });
    }
    // End-of-round popup glow + win readout — appears whenever the
    // REPEAT BET button is shown (every resolved round, win or lose).
    // The glow halo always fires; the amount just shows whatever the
    // round's win was, including $0.00 on a losing round.
    function showWinPopup(amount) {
      const wp = scene.winPopup;
      if (!wp || !wp.container) return;
      const won = amount > 0;
      // Win round → show "WIN" header + the dollar amount in gold.
      // Lose round → hide both texts; the dim overlay + REPEAT BET
      // button is the only thing the player sees.
      if (won) {
        if (wp.lblText) {
          wp.lblText.visible = true;
          wp.lblText.text = 'WIN';
        }
        wp.amtText.visible = true;
        wp.amtText.text = fmtCash(amount);
        wp.amtText.style.fill = 0xFFD23F;
        wp.amtText.style.fontSize = 56 * (L.gameScale || 1);
      } else {
        if (wp.lblText) wp.lblText.visible = false;
        wp.amtText.visible = false;
      }
      wp.container.visible = true;
      gsap.killTweensOf(wp.container);
      gsap.killTweensOf(wp.container.scale);
      gsap.fromTo(wp.container,       { alpha: 0 }, { alpha: 1, duration: 0.30, ease: 'power2.out' });
      gsap.fromTo(wp.container.scale, { x: 0.7, y: 0.7 }, { x: 1, y: 1, duration: 0.55, ease: 'back.out(2.0)' });
    }
    function hideWinPopup() {
      const wp = scene.winPopup;
      if (!wp || !wp.container || !wp.container.visible) return;
      gsap.killTweensOf(wp.container);
      gsap.to(wp.container, {
        alpha: 0, duration: 0.18, ease: 'power2.in',
        onComplete: () => { wp.container.visible = false; },
      });
    }
    // Round status — drives the text near the spin button. Also gates
    // the centre-of-grid REPEAT BET overlay + the popup glow.
    function setRoundStatus(state, info = {}) {
      roundStatus = state;
      scene._lastStatusInfo = info;
      refreshRoundStatusText();
      if (state === 'won' || state === 'lost') {
        showRepeatBetButton();
        showWinPopup((info && info.amount) || 0);
      } else {
        hideRepeatBetButton();
        hideWinPopup();
      }
    }
    function refreshRoundStatusText() {
      if (!scene.statusText) return;
      let text = '';
      let fill = 0xFFFFFF;
      switch (roundStatus) {
        case 'spinning':
          text = 'UNJAMMING…';
          fill = 0xFFD23F;
          break;
        default:
          // 'idle' / 'won' / 'lost' all show the bet-phase prompt — the
          // round outcome is already on the WIN pill (count-up + pulse),
          // so this row is just the narrative for what to do NEXT.
          if (sumArrowBets(player.arrowBets) > 0) {
            text = 'READY TO PLAY'; fill = 0xFFD23F;
          } else {
            text = 'PLACE YOUR BETS'; fill = 0xFFFFFF;
          }
      }
      scene.statusText.text = text;
      scene.statusText.style.fill = fill;
      // Subtitle is only meaningful during the bet-placement prompt.
      if (scene.statusSubtext) {
        scene.statusSubtext.visible = (text === 'PLACE YOUR BETS');
      }
    }
    function updateSpinButtonState() {
      const btn = scene.spinBtn;
      if (!btn) return;
      // Spin button only goes "dim/disabled" when the player can't afford.
      // While spinning, _setBusy already handles alpha + rotation, so we
      // don't fight it here.
      if (btn.busy) return;
      const ok = canAffordSpin();
      btn.alpha = ok ? 1 : 0.5;
      btn.cursor = ok ? 'pointer' : 'default';
    }
    // ── Buy-feature (BB pattern) ─────────────────────────────────────────────
    // Cost = bet × 100; awards SCATTER_TRIGGER_SPINS free spins.
    const FEATURE_COST_MULT = 100;
    function featureCost() { return player.bet * FEATURE_COST_MULT; }
    function featureSpinCount() {
      return window.RushHour.SCATTER_TRIGGER_SPINS || 10;
    }
    function canBuyFeature() {
      return !inFreeSpinFeature() && player.balance >= featureCost();
    }
    function startFeature() {
      const cost = featureCost();
      const spins = featureSpinCount();
      if (player.balance < cost) return;
      player.balance -= cost;
      game.state.freeSpinsBank += spins;
      refreshHUD({ animateBalance: true });
      // Kick off the first feature spin after the dialog closes.
      setTimeout(() => onSpinClick(), 350);
    }
    function openBuyFeatureModal() {
      if (!canBuyFeature()) return;
      const cost = featureCost();
      const spins = featureSpinCount();
      _openSimpleModal({
        title: 'Buy Feature',
        bodyLines: [
          'Are you sure you want to buy',
          `${spins} free spins for ${fmtCash(cost)}?`,
          ' ',
          'Free spins use your CURRENT bet.',
          'Tokens still spawn and travel along the conveyor.',
        ],
        buttons: [
          { label: 'CANCEL', fill: 0xB22A2A, hoverFill: 0xD43C3C, stroke: 0xFF6B6B,
            onTap: (close) => close() },
          { label: 'YES',    fill: 0x2E7D32, hoverFill: 0x3FA143, stroke: 0x7FE080,
            onTap: (close) => { close(); startFeature(); } },
        ],
      });
    }

    function flashInsufficientBalance() {
      const p = scene.balancePill;
      if (!p) return;
      gsap.killTweensOf(p.scale);
      gsap.fromTo(p.scale,
        { x: 1.08, y: 1.08 },
        { x: 1, y: 1, duration: 0.40, ease: 'back.out(2)' });
      const v = p.valText;
      if (!v) return;
      const orig = v.style.fill;
      v.style.fill = 0xE05A5A;
      setTimeout(() => { v.style.fill = orig; }, 380);
    }
    function refreshFreeSpinBanner() {
      // BB-style square banner anchored to the LEFT of the slot grid,
      // top-aligned with the grid top edge. Two stacked lines:
      // "FREE SPINS" title + "N LEFT" count. Created lazily and torn
      // down when the bank empties.
      const left = (game && game.state) ? game.state.freeSpinsBank : 0;
      if (left > 0) {
        const gs = L.gameScale;
        if (!scene.freeSpinBanner) {
          const bSize = 130 * gs;
          // Anchor to the LEFT of the frame (not the slot grid) so in
          // All Around mode the banner sits outside the conveyor's
          // left column, not on top of it. Clamp to canvas left edge
          // if the frame is hugging the canvas.
          const slotTop = L.frameY + (L.cellSize + L.cellGap) * 1;
          const leftGap = 24 * gs;
          let bx = L.frameX - leftGap - bSize / 2;
          if (bx - bSize / 2 < 8 * gs) bx = bSize / 2 + 8 * gs;
          const by = slotTop + bSize / 2;
          const cont = new PIXI.Container();
          cont.x = bx; cont.y = by;
          const bg = new PIXI.Graphics();
          bg.lineStyle(2.5 * gs, 0xC9A24A, 1);
          bg.beginFill(0x1A2238, 0.95);
          bg.drawRoundedRect(-bSize / 2, -bSize / 2, bSize, bSize, bSize * 0.18);
          bg.endFill();
          cont.addChild(bg);
          const title = new PIXI.Text('FREE SPINS', {
            fontFamily: FONT, fontSize: 15 * gs,
            fill: 0xFFECB3, letterSpacing: 0.6,
          });
          title.anchor.set(0.5);
          title.y = -bSize * 0.22;
          cont.addChild(title);
          const count = new PIXI.Text(`${left} LEFT`, {
            fontFamily: FONT, fontSize: 22 * gs,
            fill: 0xFFD54F, fontWeight: 'bold',
          });
          count.anchor.set(0.5);
          count.y = bSize * 0.17;
          cont.addChild(count);
          cont._countText = count;
          scene.stage.addChild(cont);
          scene.freeSpinBanner = cont;
        } else {
          scene.freeSpinBanner._countText.text = `${left} LEFT`;
        }
      } else if (scene.freeSpinBanner) {
        scene.freeSpinBanner.parent && scene.freeSpinBanner.parent.removeChild(scene.freeSpinBanner);
        scene.freeSpinBanner.destroy({ children: true });
        scene.freeSpinBanner = null;
      }
    }

    // ── Animator ─────────────────────────────────────────────────────────────
    class SpinAnimator {
      constructor() {
        this.runningWin = 0;
        this.playing = false;
        // Activator-mode spin-charged multiplier: a "×N" badge sits at
        // the centre of the slot grid while it accumulates from each
        // multiplier activator that fires this spin. At end of spin the
        // engine emits a `multiplierApply` event; the badge slams onto
        // the win pill and the total bumps. If no clusters paid this
        // spin, the badge fades out (fizzle).
        this._chargedMultValue = 0;
        this._chargedMultBadge = null;
        // Where the badge currently sits on screen. Set to the ring slot
        // of the FIRST multiplier activator that fires this spin; later
        // activators send mini-badges flying TO this position.
        this._chargedMultBadgePos = null;
      }

      _multCenterPos() {
        return {
          x: L.frameX + L.frameSize / 2,
          y: L.frameY + L.frameH / 2,
        };
      }

      // Make sure the charge badge exists at the given screen position
      // (conveyor ring slot of the first activator). Returns the badge.
      _ensureChargeBadge(atPos) {
        if (this._chargedMultBadge) return this._chargedMultBadge;
        const gs = L.gameScale;
        const ctr = atPos || this._multCenterPos();
        this._chargedMultBadgePos = { x: ctr.x, y: ctr.y };
        const cont = new PIXI.Container();
        cont.x = ctr.x; cont.y = ctr.y;
        // Outer crackle ring — slowly rotates while charging.
        const crackle = new PIXI.Graphics();
        crackle.lineStyle(2 * gs, 0xFFE082, 0.85);
        const cR = L.cellSize * 1.15;
        // Dashed ring built from short arcs so rotation reads.
        const dashes = 12;
        for (let i = 0; i < dashes; i++) {
          const a0 = (i / dashes) * Math.PI * 2;
          const a1 = a0 + (Math.PI * 2 / dashes) * 0.55;
          crackle.arc(0, 0, cR, a0, a1);
          crackle.moveTo(0, 0);
        }
        cont.addChild(crackle);
        // Halo — pulses alpha + scale in a charging loop.
        const halo = new PIXI.Graphics();
        halo.beginFill(0xFFD54F, 0.20);
        halo.drawCircle(0, 0, L.cellSize * 1.05);
        halo.endFill();
        cont.addChild(halo);
        const ring = new PIXI.Graphics();
        ring.lineStyle(5 * gs, 0xFFD54F, 1);
        ring.drawCircle(0, 0, L.cellSize * 0.85);
        cont.addChild(ring);
        const txt = new PIXI.Text(`×0`, {
          fontFamily: FONT, fontSize: L.cellSize * 0.85,
          fill: 0xFFD54F,
          fontWeight: 'bold',
        });
        txt.anchor.set(0.5);
        cont.addChild(txt);
        cont._txt = txt;
        cont._halo = halo;
        cont._ring = ring;
        cont._crackle = crackle;
        cont.alpha = 0;
        cont.scale.set(0.4);
        scene.fxLayer.addChild(cont);
        this._chargedMultBadge = cont;
        // Charging loops — kept on the badge so we can kill them when
        // the badge is consumed (apply / fizzle).
        cont._chargeTweens = [];
        // Crackle ring slowly rotates.
        cont._chargeTweens.push(gsap.to(crackle, {
          rotation: Math.PI * 2, duration: 4.5,
          ease: 'none', repeat: -1,
        }));
        // Halo breathes — alpha + scale.
        cont._chargeTweens.push(gsap.to(halo, {
          alpha: 0.45, duration: 0.85,
          ease: 'sine.inOut', repeat: -1, yoyo: true,
        }));
        cont._chargeTweens.push(gsap.to(halo.scale, {
          x: 1.18, y: 1.18, duration: 0.85,
          ease: 'sine.inOut', repeat: -1, yoyo: true,
        }));
        // Inner ring shimmers thickness via alpha.
        cont._chargeTweens.push(gsap.to(ring, {
          alpha: 0.55, duration: 0.55,
          ease: 'sine.inOut', repeat: -1, yoyo: true,
        }));
        // Number text gets a tiny breathing pulse.
        cont._chargeTweens.push(gsap.to(txt.scale, {
          x: 1.06, y: 1.06, duration: 0.70,
          ease: 'sine.inOut', repeat: -1, yoyo: true,
        }));
        return cont;
      }

      // Stop the charging loops on a badge so it can fly / fade cleanly.
      _stopChargeLoops(badge) {
        if (!badge || !badge._chargeTweens) return;
        for (const tw of badge._chargeTweens) {
          try { tw.kill(); } catch (e) { /* noop */ }
        }
        badge._chargeTweens = null;
      }

      // Multiplier activator fired. The charge badge LIVES on the
      // conveyor (at the ring slot of the first activator that fires
      // this spin) and sits there charging while cascades happen
      // underneath. Subsequent activators on the same spin send a
      // mini-badge FROM their own ring slot TO the badge's position,
      // adding to its value with a pulse.
      async _addToMultiplierCharge(value, fromCtr) {
        const gs = L.gameScale;
        const wasFresh = (this._chargedMultValue === 0);
        // First charge of the spin: spawn the badge at the activator's
        // ring slot. No flier needed.
        if (wasFresh) {
          const badge = this._ensureChargeBadge(fromCtr);
          this._chargedMultValue += value;
          badge._txt.text = `×${this._chargedMultValue}`;
          await new Promise(res => {
            gsap.timeline({ onComplete: res })
              .to(badge,       { alpha: 1, duration: 0.18, ease: 'power2.out' }, 0)
              .to(badge.scale, { x: 1.0, y: 1.0, duration: 0.34, ease: 'back.out(2.4)' }, 0);
          });
          return;
        }
        // Subsequent charge: fly mini-badge from its activator slot to
        // the existing badge's position; bump value on arrival.
        const badge = this._chargedMultBadge;
        const target = this._chargedMultBadgePos;
        const flier = new PIXI.Text(`×${value}`, {
          fontFamily: FONT, fontSize: L.cellSize * 0.55,
          fill: 0xFFD54F,
          fontWeight: 'bold',
        });
        flier.anchor.set(0.5);
        flier.x = fromCtr.x; flier.y = fromCtr.y;
        flier.alpha = 0; flier.scale.set(0.5);
        scene.fxLayer.addChild(flier);
        await new Promise(res => {
          gsap.timeline({ onComplete: res })
            .to(flier,       { alpha: 1, duration: 0.14, ease: 'power2.out' }, 0)
            .to(flier.scale, { x: 1.10, y: 1.10, duration: 0.20, ease: 'back.out(2.6)' }, 0)
            .to(flier,       { x: target.x, y: target.y, duration: 0.50, ease: 'power2.inOut' }, 0.18);
        });
        // Bump charged total + pulse the badge.
        this._chargedMultValue += value;
        badge._txt.text = `×${this._chargedMultValue}`;
        gsap.timeline()
          .to(badge.scale, { x: 1.20, y: 1.20, duration: 0.18, ease: 'back.out(2.4)' }, 0)
          .to(badge.scale, { x: 1.00, y: 1.00, duration: 0.30, ease: 'elastic.out(1.4, 0.4)' }, 0.18);
        // Fade flier where the badge sits.
        await new Promise(res => {
          gsap.timeline({ onComplete: () => { flier.destroy(); res(); } })
            .to(flier, { alpha: 0, duration: 0.18, ease: 'power2.in' }, 0)
            .to(flier.scale, { x: 1.50, y: 1.50, duration: 0.18, ease: 'power2.in' }, 0);
        });
      }

      // End-of-spin reveal: badge flies from the conveyor to centre,
      // win amount flies from the win pill to centre, the two collide
      // (multiply animation) and the bonus is added to the running win.
      async _applyMultiplierCharge(ev) {
        if (!this._chargedMultBadge) return;
        const badge = this._chargedMultBadge;
        const gs = L.gameScale;
        const center = this._multCenterPos();
        // Stop the charging loops so we have clean control over the
        // badge for the reveal animation.
        this._stopChargeLoops(badge);
        if (badge._halo) { badge._halo.scale.set(1, 1); badge._halo.alpha = 0.20; }
        if (badge._ring) { badge._ring.alpha = 1; }
        if (badge._txt)  { badge._txt.scale.set(1, 1); }
        // Stage 1 — pulse the badge in place.
        await new Promise(res => {
          gsap.timeline({ onComplete: res })
            .to(badge.scale, { x: 1.30, y: 1.30, duration: 0.22, ease: 'back.out(2.4)' }, 0)
            .to(badge.scale, { x: 1.00, y: 1.00, duration: 0.18, ease: 'power2.out' }, 0.22);
        });
        // Stage 2 — badge flies from conveyor to centre. In parallel,
        // a flying "win amount" text leaves the win pill toward centre.
        const baseAmount = (ev.baseAmount || 0) * player.bet;
        const winFlier = new PIXI.Text(`+${fmtCash(baseAmount)}`, {
          fontFamily: FONT, fontSize: L.cellSize * 0.50,
          fill: 0xFFE082,
          fontWeight: 'bold',
        });
        winFlier.anchor.set(0.5);
        const winSrc = scene.winPill
          ? { x: scene.winPill.x, y: scene.winPill.y }
          : { x: center.x, y: center.y + L.cellSize * 1.6 };
        winFlier.x = winSrc.x; winFlier.y = winSrc.y;
        winFlier.alpha = 0; winFlier.scale.set(0.6);
        scene.fxLayer.addChild(winFlier);
        // Badge approaches centre from above (stops just above midline).
        const badgeStop = { x: center.x - L.cellSize * 0.55, y: center.y };
        const winStop   = { x: center.x + L.cellSize * 0.55, y: center.y };
        await Promise.all([
          new Promise(res => {
            gsap.timeline({ onComplete: res })
              .to(badge, { x: badgeStop.x, y: badgeStop.y, duration: 0.55, ease: 'power2.inOut' }, 0);
          }),
          new Promise(res => {
            gsap.timeline({ onComplete: res })
              .to(winFlier,       { alpha: 1, duration: 0.18, ease: 'power2.out' }, 0)
              .to(winFlier.scale, { x: 1.00, y: 1.00, duration: 0.30, ease: 'back.out(2.2)' }, 0)
              .to(winFlier,       { x: winStop.x, y: winStop.y, duration: 0.55, ease: 'power2.inOut' }, 0.10);
          }),
        ]);
        // Stage 3 — collide: badge + amount slam together, equals sign
        // appears, then the multiplied result pops at centre. Old
        // tokens fade.
        const total = baseAmount + (ev.bonusAmount || 0) * player.bet;
        const result = new PIXI.Text(fmtCash(total), {
          fontFamily: FONT, fontSize: L.cellSize * 0.95,
          fill: 0xFFE082,
          fontWeight: 'bold',
        });
        result.anchor.set(0.5);
        result.x = center.x; result.y = center.y;
        result.alpha = 0; result.scale.set(0.4);
        scene.fxLayer.addChild(result);
        await new Promise(res => {
          gsap.timeline({ onComplete: res })
            .to(badge,    { x: center.x, y: center.y, duration: 0.20, ease: 'power2.in' }, 0)
            .to(winFlier, { x: center.x, y: center.y, duration: 0.20, ease: 'power2.in' }, 0)
            .to(badge,    { alpha: 0, duration: 0.18, ease: 'power2.in' }, 0.18)
            .to(winFlier, { alpha: 0, duration: 0.18, ease: 'power2.in' }, 0.18)
            .to(result,       { alpha: 1, duration: 0.20, ease: 'power2.out' }, 0.18)
            .to(result.scale, { x: 1.10, y: 1.10, duration: 0.36, ease: 'back.out(2.6)' }, 0.18);
        });
        // Stage 4 — push bonus into the running win pill, then fade
        // the result text (it leaves a sparkle stream toward the win
        // pill so the player tracks the cash to the HUD).
        const bonus = (ev.bonusAmount || 0) * player.bet;
        if (scene.winPill) {
          spawnSparkleStream(
            scene.fxLayer, center.x, center.y,
            scene.winPill.x, scene.winPill.y, 22
          );
        }
        this._addToRunningWin(bonus);
        await new Promise(res => {
          gsap.timeline({ onComplete: () => {
              result.destroy(); badge.destroy({ children: true }); winFlier.destroy(); res();
            } })
            .to(result, { alpha: 0, duration: 0.34, ease: 'power2.in' }, 0.40)
            .to(result.scale, { x: 1.30, y: 1.30, duration: 0.34, ease: 'power2.out' }, 0.40);
        });
        this._chargedMultBadge = null;
        this._chargedMultValue = 0;
        this._chargedMultBadgePos = null;
      }

      // Fizzle: charge accumulated but no clusters paid this spin.
      // Engine emits no multiplierApply event in that case; we fade
      // the badge away and stamp a "FIZZLE" label over it so it's
      // clearly identifiable as the fizzle beat.
      _fizzleMultiplierCharge() {
        if (!this._chargedMultBadge) return;
        const badge = this._chargedMultBadge;
        const gs = L.gameScale;
        this._stopChargeLoops(badge);
        const fizzle = new PIXI.Text('FIZZLE', {
          fontFamily: FONT, fontSize: L.cellSize * 0.42,
          fill: 0xE8786C,
          fontWeight: 'bold', letterSpacing: 1.5,
        });
        fizzle.anchor.set(0.5);
        fizzle.x = badge.x; fizzle.y = badge.y;
        fizzle.alpha = 0; fizzle.scale.set(0.5);
        scene.fxLayer.addChild(fizzle);
        gsap.timeline({ onComplete: () => { fizzle.destroy(); } })
          .to(fizzle,       { alpha: 1, duration: 0.16, ease: 'power2.out' }, 0)
          .to(fizzle.scale, { x: 1, y: 1, duration: 0.24, ease: 'back.out(2.4)' }, 0)
          .to(fizzle,       { alpha: 0, duration: 0.30, ease: 'power2.in' }, 0.45);
        gsap.timeline({ onComplete: () => { badge.destroy({ children: true }); } })
          .to(badge,       { alpha: 0, duration: 0.40, ease: 'power2.in' }, 0)
          .to(badge.scale, { x: 0.6, y: 0.6, duration: 0.40, ease: 'power2.in' }, 0);
        this._chargedMultBadge = null;
        this._chargedMultValue = 0;
        this._chargedMultBadgePos = null;
      }

      _addToRunningWin(amount) {
        this.runningWin += amount;
        setWinDisplay(this.runningWin);
        // Tap the WIN text — winPill is a plain wrapper now, so scale
        // the inner text rather than the wrapper.
        const t = scene.winPill && scene.winPill.valText;
        if (t) {
          gsap.killTweensOf(t.scale);
          gsap.fromTo(t.scale,
            { x: 1.10, y: 1.10 },
            { x: 1, y: 1, duration: 0.30, ease: 'back.out(2)' });
        }
        if (amount >= player.bet) pulseWinPill();
      }
      async _wait(ms) { return new Promise(res => setTimeout(res, ms)); }

      // Kill any in-flight tweens on a sprite (and its scale/position)
      // before destroying it — a lingering tween writing to a destroyed
      // PIXI transform throws every frame.
      _killSpriteTweens(s) {
        if (!s) return;
        gsap.killTweensOf(s);
        if (s.scale) gsap.killTweensOf(s.scale);
        if (s.position) gsap.killTweensOf(s.position);
      }
      _setSlotSymbol(r, c, cell) {
        const old = scene.symbols[r][c];
        if (old) {
          this._killSpriteTweens(old);
          scene.cells[r][c].removeChild(old);
          old.destroy({ children: true });
        }
        if (!cell) { scene.symbols[r][c] = null; return null; }
        const sym = makeSlotSymbol(cell, L.cellSize);
        scene.cells[r][c].addChild(sym);
        scene.symbols[r][c] = sym;
        return sym;
      }
      // Set or update a cell's multiplier stamp. Big "N×" text behind the
      // symbol + small upper-right pill badge on top. value <= 1 clears.
      // Stamps are POSITIONAL — they live on cell coordinates, never travel
      // with falling symbols (per spec: stamps stay for the spin).
      _setStamp(r, c, value) {
        const ctr = slotCellCenter(r, c);
        // ── Big text
        const oldText = scene.cellMultTexts[r][c];
        if (oldText) {
          gsap.killTweensOf(oldText);
          gsap.killTweensOf(oldText.scale);
          if (oldText.parent) oldText.parent.removeChild(oldText);
          oldText.destroy();
          scene.cellMultTexts[r][c] = null;
        }
        // ── Upper-right badge
        const oldBadge = scene.tileBadges && scene.tileBadges[r][c];
        if (oldBadge) {
          gsap.killTweensOf(oldBadge);
          gsap.killTweensOf(oldBadge.scale);
          if (oldBadge.parent) oldBadge.parent.removeChild(oldBadge);
          oldBadge.destroy({ children: true });
          scene.tileBadges[r][c] = null;
        }
        scene.stamps[r][c] = null;

        if (!value || value <= 1) return null;

        // Big "N×" text painted on the GRID, BEHIND the symbol — the
        // multiplier sitting on the grid surface. (The gold halo circle
        // that used to live behind this text was dropped per spec.)
        const text = makeCellMultText(value, L.cellSize, ctr.x, ctr.y);
        scene.cellMultTextLayer.addChild(text);
        scene.cellMultTexts[r][c] = text;
        gsap.to(text,       { alpha: 0.85, duration: 0.22, ease: 'power2.out' });
        gsap.to(text.scale, { x: 1, y: 1, duration: 0.36, ease: 'back.out(2)' });

        // Small upper-right pill badge ON TOP of the symbol — the player's
        // legible read-out. The cell-top corner uses slot-grid screen coords.
        const cellLeft = ctr.x - L.cellSize / 2;
        const cellTop  = ctr.y - L.cellSize / 2;
        const badge = makeTileBadge(value, L.cellSize, cellLeft, cellTop);
        scene.tileBadgeLayer.addChild(badge);
        scene.tileBadges[r][c] = badge;
        badge.alpha = 0;
        badge.scale.set(0.6);
        gsap.to(badge,       { alpha: 1, duration: 0.20, ease: 'power2.out' });
        gsap.to(badge.scale, { x: 1, y: 1, duration: 0.34, ease: 'back.out(2)' });

        scene.stamps[r][c] = text;   // back-compat for _animateMultiplierTraversal
        text._stampValue = value;    // queried by traversal logic to decide skip-vs-bump
        return text;
      }

      _clearAllStamps() {
        for (let r = 0; r < GAME.ROWS; r++) {
          for (let c = 0; c < GAME.COLS; c++) {
            const text = scene.cellMultTexts && scene.cellMultTexts[r][c];
            if (text) {
              gsap.killTweensOf(text);
              gsap.killTweensOf(text.scale);
              if (text.parent) text.parent.removeChild(text);
              text.destroy();
              scene.cellMultTexts[r][c] = null;
            }
            const badge = scene.tileBadges && scene.tileBadges[r][c];
            if (badge) {
              gsap.killTweensOf(badge);
              gsap.killTweensOf(badge.scale);
              if (badge.parent) badge.parent.removeChild(badge);
              badge.destroy({ children: true });
              scene.tileBadges[r][c] = null;
            }
            if (scene.stamps && scene.stamps[r]) scene.stamps[r][c] = null;
          }
        }
      }
      // Hard-snap restore — used only on full scene rebuild (resize).
      // For spin-to-spin animation we never destroy + recreate tokens;
      // we add/move/remove them based on engine events.
      _restoreConveyor(tokens) {
        for (let pos = 1; pos <= RING_SIZE; pos++) {
          const old = scene.ringTokens[pos];
          if (old) {
            this._killSpriteTweens(old);
            if (old.parent) old.parent.removeChild(old);
            old.destroy({ children: true });
          }
          scene.ringTokens[pos] = null;
        }
        for (const t of tokens) {
          if (t.pos >= 1 && t.pos <= RING_SIZE) {
            const sprite = makeTokenSprite(t, L.cellSize);
            const ctr = ringCellCenter(t.pos);
            sprite.x = ctr.x; sprite.y = ctr.y;
            scene.conveyorLayer.addChild(sprite);
            scene.ringTokens[t.pos] = sprite;
          }
        }
      }

      // A freshly-spawned token slides IN from off-grid pos 0 (one cell
      // left of pos 1) into pos 1. Engine flags it spawnedThisSpin so the
      // shift step keeps it at pos 1 for one full spin (intercept window).
      async _animateTokenSpawn(token, slideDuration = 0.36) {
        const sprite = makeTokenSprite(token, L.cellSize);
        const start  = ringCellCenter(0);
        const target = ringCellCenter(token.pos);
        sprite.x = start.x; sprite.y = start.y;
        sprite.alpha = 0; sprite.scale.set(0.85);
        scene.conveyorLayer.addChild(sprite);
        scene.ringTokens[token.pos] = sprite;
        return new Promise(res => {
          gsap.timeline({ onComplete: res })
            .to(sprite,       { alpha: 1, duration: 0.18, ease: 'power2.out' }, 0)
            .to(sprite.scale, { x: 1, y: 1, duration: 0.30, ease: 'back.out(2)' }, 0)
            .to(sprite,       { x: target.x, y: target.y, duration: slideDuration, ease: 'power2.inOut' }, 0);
        });
      }

      // Surviving tokens slide forward by 1 cell. Tokens reaching FINISH_POS
      // slide there and fade out. Pass `skipPositions` (a Set of pre-shift
      // ring positions) for tokens that won't shift this spin.
      async _animateConveyorShift(skipPositions = new Set(), duration = 0.32, snapshotTokens = []) {
        const tweens = [];
        // Build a lookup of engine tokens by their NEW position. We read
        // from the SNAPSHOT (post-shift, pre-cascade) — not from live
        // game.state.conveyor — because by the time this animation runs,
        // intercepted tokens have already been spliced out of the live
        // state. The snapshot still has them with their upgradedThisShift
        // flags intact.
        const tokenByNewPos = new Map();
        for (const t of snapshotTokens) tokenByNewPos.set(t.pos, t);
        if (MODE === 'allAround') {
          console.log('[AA ANIMATOR] snapshot tokens:',
            snapshotTokens.map(t => `${t.type}@${t.pos}${t.upgradedThisShift ? ' UP' : ''}`).join(', ') || '(empty)');
          console.log('[AA ANIMATOR] sprite occupancy:',
            Object.keys(scene.ringTokens || {}).filter(k => scene.ringTokens[k]).join(', '));
          console.log('[AA ANIMATOR] skipPositions:', [...skipPositions].join(', ') || '(none)');
        }
        // Iterate from FAR end to NEAR end so we don't overwrite scene.ringTokens
        // entries while we're still reading them.
        for (let pos = RING_SIZE; pos >= 1; pos--) {
          if (skipPositions.has(pos)) continue;
          const sprite = scene.ringTokens[pos];
          if (!sprite) continue;
          const newPos = pos + 1;
          if (newPos >= FINISH_POS) {
            const target = ringCellCenter(FINISH_POS);
            const fadeDur = Math.min(0.20, duration * 0.4);
            tweens.push(new Promise(res => {
              gsap.timeline({
                onComplete: () => {
                  if (scene.destroyingTileCtr) {
                    spawnDestroyEffect(
                      scene.fxLayer,
                      scene.destroyingTileCtr.x, scene.destroyingTileCtr.y,
                    );
                    if (MODE === 'allAround') this._flashDestroyAt(scene.destroyingTileCtr);
                  }
                  sprite.destroy({ children: true });
                  res();
                },
              })
                .to(sprite, { x: target.x, y: target.y, duration, ease: 'power2.inOut' })
                .to(sprite, { alpha: 0, duration: fadeDur, ease: 'power2.in' }, duration - fadeDur + 0.05);
            }));
            scene.ringTokens[pos] = null;
            continue;
          }

          const t = tokenByNewPos.get(newPos);
          const upgraded = !!(t && t.upgradedThisShift) && MODE === 'allAround';
          if (MODE === 'allAround') {
            const isCornerKey = (pos === 6 && newPos === 7) || (pos === 12 && newPos === 13) || (pos === 18 && newPos === 19);
            console.log(`[AA ANIMATOR] ${pos}→${newPos}${isCornerKey ? ' [CORNER]' : ''} snapshot-token=${t ? `${t.type} flag=${!!t.upgradedThisShift}` : 'MISSING'} → branch=${upgraded ? 'DETOUR (upgrade)' : 'STRAIGHT SLIDE'}${isCornerKey && !upgraded ? ' ⚠️ DIAGONAL!' : ''}`);
          }
          if (upgraded) {
            // Detour through the corner cell, do a BIG upgrade flash, then
            // continue to the new position. Engine flag is cleared once
            // the upgrade plays.
            const cornerCtr = cornerCellCenter(`${pos}->${newPos}`);
            const finalCtr  = ringCellCenter(newPos);
            scene.ringTokens[pos] = null;
            tweens.push((async () => {
              const newSprite = await this._animateUpgradeAt(
                sprite, t, cornerCtr, finalCtr, duration
              );
              scene.ringTokens[newPos] = newSprite;
              t.upgradedThisShift = false;
            })());
          } else {
