      const sw = L.sw, sh = L.sh;
      // Mobile: scale so the simple modal isn't postage-stamp sized.
      // Desktop: original cap (1.0 at 900×900+).
      const scale = L.isMobile
        ? Math.min(sw * 0.92 / 540, sh * 0.85 / 540)
        : Math.min(1, Math.min(sw / 900, sh / 900));

      const modal = new PIXI.Container();
      modal.alpha = 0;
      modal._isSimpleModal = true;
      _openSimpleModalCount++;
      app.stage.addChild(modal);

      const backdrop = new PIXI.Graphics();
      backdrop.beginFill(0x000000, 0.72);
      backdrop.drawRect(0, 0, sw, sh);
      backdrop.endFill();
      backdrop.eventMode = 'static';
      modal.addChild(backdrop);

      const panelW = Math.min(sw * 0.85, 540 * scale);
      const btnH   = Math.max(44, 56 * scale);
      const btnFS  = Math.max(16, 20 * scale);
      const padY   = 28 * scale;
      const wrapW  = panelW - padY * 2;

      let titleFS = Math.max(14, 32 * scale);
      if (title) {
        const probe = new PIXI.Text(title, { fontFamily: FONT, fontSize: titleFS });
        if (probe.width > wrapW) {
          titleFS = Math.max(14, titleFS * (wrapW / probe.width));
        }
        probe.destroy();
      }

      const titleH  = titleFS + 12 * scale;
      const btnRowH = btnH + padY;
      const maxPanelH = sh * 0.88;
      const maxBodyH  = maxPanelH - (padY + titleH + padY * 0.5 + padY + btnRowH);

      const FONT_CANDIDATES = [28, 24, 22, 20, 18, 16, 14, 13, 12];
      let chosenFS = FONT_CANDIDATES[FONT_CANDIDATES.length - 1] * scale;
      let chosenLineGap = 8 * scale;
      let chosenBodyH = 0;
      let chosenLineHeights = [];
      for (const candidate of FONT_CANDIDATES) {
        const fs = candidate * scale;
        const gap = Math.max(4, fs * 0.36);
        const heights = [];
        let totalH = 0;
        for (const line of bodyLines) {
          const isEmphasis = line.emphasis === true;
          const lineFS = isEmphasis ? fs * 1.4 : fs;
          const probe = new PIXI.Text(line.text ?? line, {
            fontFamily: FONT, fontSize: lineFS,
            wordWrap: true, wordWrapWidth: wrapW,
          });
          const h = probe.height;
          heights.push(h);
          totalH += h + gap;
          probe.destroy();
        }
        if (heights.length) totalH -= gap;
        if (totalH <= maxBodyH) {
          chosenFS = fs; chosenLineGap = gap; chosenBodyH = totalH; chosenLineHeights = heights; break;
        }
        chosenFS = fs; chosenLineGap = gap; chosenBodyH = totalH; chosenLineHeights = heights;
      }
      const bodyFS = chosenFS;
      const lineGap = chosenLineGap;
      const bodyH = chosenBodyH;
      const lineHeights = chosenLineHeights;

      const panelH = padY + titleH + padY * 0.5 + bodyH + padY + btnRowH;
      const panelX = (sw - panelW) / 2;
      const panelY = (sh - panelH) / 2;

      const panel = new PIXI.Graphics();
      panel.lineStyle(3 * scale, 0xC9A24A, 0.95);
      panel.beginFill(0x1A2238, 0.98);   // lifted slate (same level as HUD pills)
      panel.drawRoundedRect(panelX, panelY, panelW, panelH, 24 * scale);
      panel.endFill();
      modal.addChild(panel);

      if (title) {
        const t = new PIXI.Text(title, {
          fontFamily: FONT, fontSize: titleFS,
          fill: 0xFFD54F, letterSpacing: 0.8, align: 'center',
        });
        t.anchor.set(0.5, 0);
        t.x = panelX + panelW / 2;
        t.y = panelY + padY;
        modal.addChild(t);
      }

      let lineY = panelY + padY + titleH + padY * 0.5;
      for (let i = 0; i < bodyLines.length; i++) {
        const line = bodyLines[i];
        const isEmphasis = line.emphasis === true;
        const t = new PIXI.Text(line.text ?? line, {
          fontFamily: FONT,
          fontSize: isEmphasis ? bodyFS * 1.4 : bodyFS,
          fill: isEmphasis ? 0xFFD54F : 0xFFECB3,
          align: 'center',
          wordWrap: true, wordWrapWidth: wrapW,
        });
        t.anchor.set(0.5, 0);
        t.x = panelX + panelW / 2;
        t.y = lineY;
        modal.addChild(t);
        const h = (lineHeights && lineHeights[i] != null) ? lineHeights[i] : t.height;
        lineY += h + lineGap;
      }

      let _closed = false;
      const close = () => {
        if (_closed) return;
        _closed = true;
        _openSimpleModalCount = Math.max(0, _openSimpleModalCount - 1);
        gsap.to(modal, {
          alpha: 0, duration: 0.15, ease: 'power2.in',
          onComplete: () => modal.destroy({ children: true }),
        });
      };

      const btnCount = buttons.length;
      const btnGap = 16 * scale;
      const btnW = (panelW - padY * 2 - btnGap * (btnCount - 1)) / btnCount;
      const btnY = panelY + panelH - padY - btnH / 2;
      buttons.forEach((b, i) => {
        const bx = panelX + padY + btnW * i + btnGap * i + btnW / 2;
        const bcont = new PIXI.Container();
        bcont.x = bx; bcont.y = btnY;
        const bbg = new PIXI.Graphics();
        const drawBtnBg = (hover) => {
          bbg.clear();
          bbg.lineStyle(2 * scale, b.stroke || 0xFFFFFF, 0.9);
          bbg.beginFill(hover ? (b.hoverFill || b.fill) : b.fill, 1);
          bbg.drawRoundedRect(-btnW / 2, -btnH / 2, btnW, btnH, btnH * 0.3);
          bbg.endFill();
        };
        drawBtnBg(false);
        const btxt = new PIXI.Text(b.label, {
          fontFamily: FONT, fontSize: btnFS, fill: 0xFFFFFF, letterSpacing: 0.5,
        });
        btxt.anchor.set(0.5);
        bcont.addChild(bbg);
        bcont.addChild(btxt);
        bcont.eventMode = 'static';
        bcont.cursor = 'pointer';
        bcont.hitArea = new PIXI.RoundedRectangle(-btnW / 2, -btnH / 2, btnW, btnH, btnH * 0.3);
        bcont.on('pointerover', () => {
          drawBtnBg(true);
          gsap.to(bcont.scale, { x: 1.04, y: 1.04, duration: 0.12 });
        });
        bcont.on('pointerout', () => {
          drawBtnBg(false);
          gsap.to(bcont.scale, { x: 1, y: 1, duration: 0.12 });
        });
        bcont.on('pointertap', () => {
          if (b.onTap) b.onTap(close);
          else close();
        });
        modal.addChild(bcont);
      });

      gsap.to(modal, { alpha: 1, duration: 0.18, ease: 'power2.out' });
      return { modal, close };
    }

    // Free-spin announce/retrigger modal. `isRetrigger` flips the title.
    function openFreeSpinAnnounceModal(spins, isRetrigger) {
      _openSimpleModal({
        title: isRetrigger ? 'Retrigger!' : 'Free Spins!',
        bodyLines: [
          { text: isRetrigger ? 'You earned' : 'You triggered' },
          { text: `+${spins} FREE SPINS`, emphasis: true },
        ],
        buttons: [{
          label: 'PLAY',
          fill: 0x2E7D32, hoverFill: 0x3FA143, stroke: 0x7FE080,
          onTap: (close) => {
            close();
            // Auto-kick the next free spin once the modal has closed.
            // Small delay so the close animation finishes and the spin
            // button isn't busy from any in-flight tween.
            setTimeout(() => {
              if (game.state.freeSpinsBank > 0
                  && scene.spinBtn && !scene.spinBtn.busy
                  && _openSimpleModalCount === 0) {
                onSpinClick();
              }
            }, 200);
          },
        }],
      });
    }

    function openPaytableModal() {
      if (scene.paytableModal) return;
      const modal = new PIXI.Container();
      const sw = L.sw, sh = L.sh;
      // Mobile: scale so the panel fills most of the canvas (panel
      // dimensions are clamped at sw*0.94 / sh*0.92 below, so we pick
      // whichever constraint binds first).
      // Desktop: capped at 1.0 (fits a 900×900 design at full scale).
      const scale = L.isMobile
        ? Math.min(sw * 0.94 / 720, sh * 0.92 / 620)
        : Math.min(1, Math.min(sw / 900, sh / 900));

      // Dimmed backdrop, click-to-close.
      const backdrop = new PIXI.Graphics();
      backdrop.beginFill(0x000000, 0.72);
      backdrop.drawRect(0, 0, sw, sh);
      backdrop.endFill();
      backdrop.eventMode = 'static';
      backdrop.on('pointertap', (e) => { if (e.target === backdrop) closePaytableModal(); });
      modal.addChild(backdrop);

      // Panel.
      const panelW = Math.min(720 * scale, sw * 0.92);
      const panelH = Math.min(620 * scale, sh * 0.92);
      const panelX = (sw - panelW) / 2;
      const panelY = (sh - panelH) / 2;
      const panel = new PIXI.Graphics();
      panel.lineStyle(3 * scale, 0xC9A24A, 1);
      panel.beginFill(0x1A2238, 0.98);   // lifted slate (HUD pill level)
      panel.drawRoundedRect(panelX, panelY, panelW, panelH, 26 * scale);
      panel.endFill();
      panel.eventMode = 'static';
      panel.hitArea = new PIXI.Rectangle(panelX, panelY, panelW, panelH);
      modal.addChild(panel);

      // Title.
      const title = new PIXI.Text('Trail Catcher', {
        fontFamily: FONT, fontSize: 30 * scale, fill: 0xC9A24A,
      });
      title.anchor.set(0.5);
      title.x = panelX + panelW / 2; title.y = panelY + 28 * scale;
      modal.addChild(title);

      // Close button (×).
      const closeBtn = new PIXI.Container();
      const closeR = 22 * scale;
      const closeBg = new PIXI.Graphics();
      const drawClose = (hover) => {
        closeBg.clear();
        closeBg.lineStyle(2 * scale, 0xC9A24A, 1);
        closeBg.beginFill(hover ? 0x2C3552 : 0x1A2238, 0.95);
        closeBg.drawCircle(0, 0, closeR);
        closeBg.endFill();
      };
      drawClose(false);
      closeBtn.addChild(closeBg);
      const closeX = new PIXI.Text('×', {
        fontFamily: 'Arial, sans-serif', fontWeight: 'bold',
        fontSize: closeR * 1.7, fill: 0xFFFFFF,
      });
      closeX.anchor.set(0.5);
      closeBtn.addChild(closeX);
      closeBtn.x = panelX + panelW - 28 * scale;
      closeBtn.y = panelY + 30 * scale;
      closeBtn.eventMode = 'static';
      closeBtn.cursor = 'pointer';
      closeBtn.hitArea = new PIXI.Circle(0, 0, closeR);
      closeBtn.on('pointerover', () => drawClose(true));
      closeBtn.on('pointerout',  () => drawClose(false));
      closeBtn.on('pointertap',  () => closePaytableModal());
      modal.addChild(closeBtn);

      // Tabs.
      const tabs = [
        { key: 'paytable', label: 'Paytable' },
        { key: 'rules',    label: 'Rules' },
      ];
      const tabBarY = panelY + 70 * scale;
      const tabW = 140 * scale, tabH = 34 * scale, tabGap = 10 * scale;
      const tabsTotalW = tabs.length * tabW + (tabs.length - 1) * tabGap;
      const tabsStartX = panelX + (panelW - tabsTotalW) / 2;
      const tabSprites = [];
      tabs.forEach((tab, idx) => {
        const t = new PIXI.Container();
        const tx = tabsStartX + idx * (tabW + tabGap) + tabW / 2;
        t.x = tx; t.y = tabBarY;
        const bg = new PIXI.Graphics();
        const draw = (active, hover) => {
          bg.clear();
          bg.lineStyle(2 * scale, 0xC9A24A, 1);
          bg.beginFill(active ? 0x3F4A6E : (hover ? 0x2C3552 : 0x232B45), 1);
          bg.drawRoundedRect(-tabW / 2, -tabH / 2, tabW, tabH, tabH * 0.4);
          bg.endFill();
        };
        draw(idx === 0, false);
        t.addChild(bg);
        const lbl = new PIXI.Text(tab.label, {
          fontFamily: FONT, fontSize: 16 * scale,
          fill: idx === 0 ? 0xC9A24A : 0x8896BB,
        });
        lbl.anchor.set(0.5);
        t.addChild(lbl);
        t.eventMode = 'static'; t.cursor = 'pointer';
        t.hitArea = new PIXI.RoundedRectangle(-tabW / 2, -tabH / 2, tabW, tabH, tabH * 0.4);
        t.on('pointertap', () => setActiveTab(idx));
        t._draw = draw; t._lbl = lbl; t._key = tab.key;
        tabSprites.push(t);
        modal.addChild(t);
      });

      // ── Content panels ──
      const contentTop = tabBarY + tabH / 2 + 18 * scale;
      const contentBot = panelY + panelH - 24 * scale;

      // Paytable content — Rush Hour pay model.
      //
      // Win = stake × arrow odds × officer multiplier (when boosted),
      // per CAR THAT EXITS through that arrow. The car's colour and
      // shape is purely cosmetic — every car pays the same way. We
      // show three sections: arrow odds, officer multipliers, and a
      // row of car graphics so the player sees the variety + the
      // "all the same" message together.
      const paytableContent = new PIXI.Container();
      modal.addChild(paytableContent);
      const padX = 32 * scale;
      const colW = panelW - padX * 2;
      const leftX = panelX + padX;

      const sectionTitle = (text, y) => {
        const t = new PIXI.Text(text, {
          fontFamily: FONT, fontSize: 13 * scale, fill: 0xFFD23F,
          letterSpacing: 2, fontWeight: '800',
        });
        t.x = leftX; t.y = y;
        paytableContent.addChild(t);
      };
      const bodyText = (text, y, opts = {}) => {
        const t = new PIXI.Text(text, {
          fontFamily: FONT, fontSize: (opts.size || 13) * scale,
          fill: opts.fill ?? 0xE8DDC4, fontWeight: opts.weight || '500',
        });
        t.x = leftX + (opts.indent || 0); t.y = y;
        paytableContent.addChild(t);
      };

      let cy = contentTop;

      // ── Arrow odds ──
      sectionTitle('ARROW ODDS', cy);
      cy += 22 * scale;
      bodyText('Each ring arrow has a multiplier shown on it.', cy);
      cy += 18 * scale;
      bodyText('You win bet × that arrow\'s pay × car\'s pay, per car.', cy);
      cy += 26 * scale;
      const oddsRow = (label, value, atY) => {
        const lt = new PIXI.Text(label, {
          fontFamily: FONT, fontSize: 14 * scale, fill: 0xFFFFFF, fontWeight: '600',
        });
        lt.x = leftX + 8 * scale; lt.y = atY;
        paytableContent.addChild(lt);
        const vt = new PIXI.Text(value, {
          fontFamily: FONT, fontSize: 18 * scale, fill: 0xFFD23F, fontWeight: '800',
        });
        vt.anchor.set(1, 0);
        vt.x = leftX + colW;
        vt.y = atY - 2 * scale;
        paytableContent.addChild(vt);
      };
      // Pull the actual displayed odds from the active mode's table
      // so the paytable matches what's painted on the cells.
      const _cornerArrowVal = arrowOddsFor(1);   // pos 1 is a corner
      const _middleArrowVal = arrowOddsFor(2);   // pos 2 is a middle
      oddsRow('Corner-adjacent arrows', `${_cornerArrowVal}×`, cy);
      cy += 22 * scale;
      oddsRow('Middle-of-edge arrows', `${_middleArrowVal}×`, cy);
      cy += 32 * scale;

      // ── Officer multipliers — only shown in modes that use officers.
      if (MODE === 'officer') {
        sectionTitle('TRAFFIC OFFICER MULTIPLIERS', cy);
        cy += 22 * scale;
        bodyText('Some rounds, an officer will throw a multiplier onto', cy);
        cy += 18 * scale;
        bodyText('a random arrow. A car exiting there pays × the bonus.', cy);
        cy += 24 * scale;
        const officers = [
          { mult: '2x',    rarity: 'common' },
          { mult: '4x',    rarity: 'common' },
          { mult: '10x',   rarity: 'less common' },
          { mult: '25x',   rarity: 'uncommon' },
          { mult: '50x',   rarity: 'rare' },
          { mult: '100x',  rarity: 'very rare' },
          { mult: '500x',  rarity: 'extremely rare' },
          { mult: '1000x', rarity: 'jackpot' },
        ];
        const offRowH = 18 * scale;
        const offColCount = 2;
        const offColInterW = colW / offColCount;
        for (let i = 0; i < officers.length; i++) {
          const off = officers[i];
          const cIdx = i % offColCount;
          const rIdx = Math.floor(i / offColCount);
          const ox = leftX + cIdx * offColInterW + 8 * scale;
          const oy = cy + rIdx * offRowH;
          const m = new PIXI.Text(off.mult, {
            fontFamily: FONT, fontSize: 14 * scale, fill: 0xFFD23F, fontWeight: '800',
          });
          m.x = ox; m.y = oy;
          paytableContent.addChild(m);
          const r = new PIXI.Text(off.rarity, {
            fontFamily: FONT, fontSize: 11 * scale, fill: 0xA8AEB6, fontWeight: '500',
          });
          r.x = ox + 56 * scale;
          r.y = oy + 3 * scale;
          paytableContent.addChild(r);
        }
        cy += Math.ceil(officers.length / offColCount) * offRowH + 24 * scale;
      }

      // ── Cars ──
      sectionTitle('CARS', cy);
      cy += 22 * scale;
      bodyText('Each car pays a different amount when it exits.', cy);
      cy += 18 * scale;
      bodyText('Trucks are rare and pay the most.', cy);
      cy += 22 * scale;
      // Row of mini car graphics with the cash a player wins per
      // exit at the current bet amount. Two values per car — the win
      // through a corner arrow (4×) and a middle arrow (5×).
      const carPickColors = ['Compact', 'Sedan', 'SUV', 'Truck'];
      const carCount = carPickColors.length;
      const carCellSize = Math.min(58 * scale, (colW - 24 * scale) / carCount);
      const currentBet = (player && player.bet) || 1;
      for (let i = 0; i < carCount; i++) {
        const colName = carPickColors[i];
        const colDef = COLOR_BY_NAME[colName];
        if (!colDef) continue;
        const cellCX = leftX + carCellSize / 2 + i * (carCellSize + 12 * scale);
        const v = makeVehicleGlyph(colName, colorToUint(colDef.hex), 'up', carCellSize);
        v.x = cellCX;
        v.y = cy + carCellSize / 2;
        paytableContent.addChild(v);
        // Cash amount won per exit at the current chip value.
        // Show both corner-arrow win and middle-arrow win.
        const mult = colDef.payMult || 1;
        const cornerWin = currentBet * _cornerArrowVal * mult;
        const middleWin = currentBet * _middleArrowVal * mult;
        const cashLine1 = new PIXI.Text(fmtCash(middleWin), {
          fontFamily: FONT, fontSize: 14 * scale,
          fill: 0xFFD23F, fontWeight: '800',
        });
        cashLine1.anchor.set(0.5, 0);
        cashLine1.x = cellCX;
        cashLine1.y = cy + carCellSize + 4 * scale;
        paytableContent.addChild(cashLine1);
        const cashLine2 = new PIXI.Text(`or ${fmtCash(cornerWin)}`, {
          fontFamily: FONT, fontSize: 10 * scale,
          fill: 0xA8AEB6, fontWeight: '500',
        });
        cashLine2.anchor.set(0.5, 0);
        cashLine2.x = cellCX;
        cashLine2.y = cy + carCellSize + 22 * scale;
        paytableContent.addChild(cashLine2);
      }
      cy += carCellSize + 40 * scale;
      bodyText(`Per car at $${currentBet} bet — bigger value on middle arrows, smaller on corner arrows.`, cy, { size: 11, fill: 0xA8AEB6 });

      // Rules content (text).
      const rulesContent = new PIXI.Container();
      rulesContent.visible = false;
      modal.addChild(rulesContent);
      // Per-mode rules text — pulled from the active mode's hook so each
      // mode shows its own description.
      const rulesText = window.RushHour.getModeDef().getRulesText?.()
        ?? 'No rules available for this mode.';
      const rulesBody = new PIXI.Text(rulesText, {
        fontFamily: 'Arial, sans-serif',
        fontSize: 14 * scale,
        fill: 0xF5E6CC,
        lineHeight: 19 * scale,
        wordWrap: true,
        wordWrapWidth: panelW - 80 * scale,
      });
      rulesBody.x = panelX + 40 * scale;
      rulesBody.y = contentTop;
      rulesContent.addChild(rulesBody);

      // ── Rules scroll setup ────────────────────────────────────────────
      // Mask the rules content to the modal's content area; mouse wheel
      // translates rulesContent.y. A thin gold scrollbar runs along the
      // right edge to indicate scroll position. Paytable doesn't scroll.
      const scrollAreaLeft  = panelX + 24 * scale;
      const scrollAreaRight = panelX + panelW - 24 * scale;
      const scrollAreaTop   = contentTop;
      const scrollAreaBot   = contentBot;
      const scrollAreaH     = scrollAreaBot - scrollAreaTop;
      const rulesMask = new PIXI.Graphics();
      rulesMask.beginFill(0xFFFFFF);
      rulesMask.drawRect(scrollAreaLeft, scrollAreaTop,
                         scrollAreaRight - scrollAreaLeft, scrollAreaH);
      rulesMask.endFill();
      modal.addChild(rulesMask);
      rulesContent.mask = rulesMask;

      // Scrollbar (visible only when content overflows + rules tab is on).
      const sbW = 5 * scale;
      const sbX = scrollAreaRight - sbW - 2 * scale;
      const sbTrack = new PIXI.Graphics();
      sbTrack.beginFill(0x0E1424, 0.55);
      sbTrack.drawRoundedRect(sbX, scrollAreaTop, sbW, scrollAreaH, sbW / 2);
      sbTrack.endFill();
      modal.addChild(sbTrack);
      const sbThumb = new PIXI.Graphics();
      sbThumb.beginFill(0xC9A24A, 1);
      modal.addChild(sbThumb);

      const rulesTotalH = rulesBody.height;
      const rulesScrollMax = Math.max(0, rulesTotalH - scrollAreaH);
      const updateScrollbar = () => {
        sbThumb.clear();
        if (rulesScrollMax <= 0 || !rulesContent.visible) {
          sbTrack.visible = false;
          return;
        }
        sbTrack.visible = true;
        const thumbH = Math.max(20 * scale, scrollAreaH * (scrollAreaH / rulesTotalH));
        const ratio = -rulesContent.y / rulesScrollMax;
        const thumbY = scrollAreaTop + ratio * (scrollAreaH - thumbH);
        sbThumb.beginFill(0xC9A24A, 1);
        sbThumb.drawRoundedRect(sbX, thumbY, sbW, thumbH, sbW / 2);
        sbThumb.endFill();
      };
      updateScrollbar();

      const onWheel = (e) => {
        if (!scene.paytableModal) return;
        if (!rulesContent.visible) return;
        if (rulesScrollMax <= 0) return;
        e.preventDefault();
        rulesContent.y = Math.max(-rulesScrollMax,
                                   Math.min(0, rulesContent.y - e.deltaY));
        updateScrollbar();
      };
      window.addEventListener('wheel', onWheel, { passive: false });
      modal._onWheel = onWheel;

      function setActiveTab(activeIdx) {
        tabSprites.forEach((t, i) => {
          t._draw(i === activeIdx, false);
          t._lbl.style.fill = i === activeIdx ? 0xC9A24A : 0x8896BB;
        });
        paytableContent.visible = (tabSprites[activeIdx]._key === 'paytable');
        rulesContent.visible    = (tabSprites[activeIdx]._key === 'rules');
        // Reset rules scroll when switching back to rules.
        if (rulesContent.visible) rulesContent.y = 0;
        updateScrollbar();
      }

      modal.alpha = 0;
      app.stage.addChild(modal);
      scene.paytableModal = modal;
      gsap.to(modal, { alpha: 1, duration: 0.20, ease: 'power2.out' });
    }

    function closePaytableModal() {
      const m = scene.paytableModal;
      if (!m) return;
      if (m._onWheel) window.removeEventListener('wheel', m._onWheel);
      scene.paytableModal = null;
      gsap.to(m, {
        alpha: 0, duration: 0.18, ease: 'power2.in',
        onComplete: () => m.destroy({ children: true }),
      });
    }

    // Close paytable on Escape.
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Escape' && scene.paytableModal) closePaytableModal();
    });

    // ── Mode button (for the bottom row) ─────────────────────────────────
    // Pill-style: gold border + dark slate fill + cream label. Active mode
    // gets a slightly brighter slate fill + bold gold label.

    function makeAdjustButton(symbol, onTap) {
      const gs = L.gameScale;
      const r = 22 * gs;
      const c = new PIXI.Container();
      const g = new PIXI.Graphics();
      const draw = (hover = false) => {
        g.clear();
        g.lineStyle(2 * gs, 0xC9A24A, 0.95);
        g.beginFill(hover ? 0x2C3552 : 0x1A2238, 0.85);
        g.drawCircle(0, 0, r);
        g.endFill();
      };
      draw();
      c.addChild(g);
      const t = new PIXI.Text(symbol, {
        fontFamily: FONT, fontSize: 26 * gs, fill: 0xFFECB3, fontWeight: 'bold',
      });
      t.anchor.set(0.5);
      c.addChild(t);
      c.eventMode = 'static'; c.cursor = 'pointer';
      c.hitArea = new PIXI.Circle(0, 0, r);
      c.on('pointerover', () => { draw(true); gsap.to(c.scale, { x: 1.08, y: 1.08, duration: 0.12 }); });
      c.on('pointerout',  () => { draw(false); gsap.to(c.scale, { x: 1, y: 1, duration: 0.12 }); });
      c.on('pointertap', onTap);
      return c;
    }

    // ── Scene ────────────────────────────────────────────────────────────────
    // Layer order (back → front):
    //   frameContainer  — background panel + cell BGs + conveyor BGs
    //   slotLayer       — per-cell Containers w/ symbols + stamps (MASKED)
    //   conveyorLayer   — token sprites (unmasked, can sit anywhere on L)
    //   fxLayer         — floating texts on top
    const scene = {
      stage: app.stage,
      frameContainer: null, slotLayer: null, conveyorLayer: null, fxLayer: null,
      gridMask: null,
      cellBgs: null, cells: null, symbols: null, stamps: null,
      ringCellBgs: null, ringTokens: null,
      balancePill: null, betPill: null, winPill: null,
      betMinusBtn: null, betPlusBtn: null,
      spinBtn: null, infoBtn: null,
    };

    // ── Mode-switcher button + confirm modal ──
    // TrailCatcher-style: clicking a mode button opens a confirm
    // dialog with the mode's description. Confirming persists the
    // choice in localStorage and reloads the page so buildScene
    // re-runs against the new mode (closure-scoped consts get
    // re-evaluated). Active mode renders as highlighted.
    function makeModeButton({ x, y, w, h, label, isActive, onTap }) {
      const cont = new PIXI.Container();
      cont.x = x; cont.y = y;
      const gs = L.gameScale;
      const bg = new PIXI.Graphics();
      const draw = (hover = false) => {
        bg.clear();
        bg.lineStyle(2 * gs, isActive ? 0xFFD23F : 0x6F7682, 1);
        const fill = isActive ? 0x2D4373 : (hover ? 0x2A3548 : 0x1A2332);
        bg.beginFill(fill, 1);
        bg.drawRoundedRect(-w / 2, -h / 2, w, h, h * 0.4);
        bg.endFill();
      };
      draw(false);
      cont.addChild(bg);
      const lbl = new PIXI.Text(label, {
        fontFamily: FONT, fontSize: 13 * gs,
        fill: isActive ? 0xFFD23F : 0xE8DDC4,
        fontWeight: isActive ? '800' : '600',
        letterSpacing: 0.6,
      });
      lbl.anchor.set(0.5);
      cont.addChild(lbl);
      cont.eventMode = 'static'; cont.cursor = 'pointer';
      cont.hitArea = new PIXI.RoundedRectangle(-w / 2, -h / 2, w, h, h * 0.4);
      cont.on('pointerover', () => {
        if (isActive) return;
        draw(true);
        gsap.to(cont.scale, { x: 1.04, y: 1.04, duration: 0.12, ease: 'sine.out' });
      });
      cont.on('pointerout', () => {
        draw(false);
        gsap.to(cont.scale, { x: 1, y: 1, duration: 0.12 });
      });
      cont.on('pointertap', onTap);
      return cont;
    }
    function openModeConfirmModal(modeKey) {
      const def = MODE_DEF[modeKey];
      if (!def) return;
      _openSimpleModal({
        title: def.name,
        bodyLines: (def.description || []).map(text => ({ text })),
        buttons: [
          {
            label: 'CANCEL',
            fill: 0x4A1A1A, hoverFill: 0x6A2424, stroke: 0xC9A24A,
            onTap: (close) => close(),
          },
          {
            label: 'PLAY',
            fill: 0x065F46, hoverFill: 0x10B981, stroke: 0xFFD23F,
            onTap: (close) => {
              close();
              if (MODE === modeKey) return;
              setMode(modeKey);
              // Reload so buildScene re-runs against the new mode and
              // closure-scoped consts pick up the right values.
              window.location.reload();
            },
          },
        ],
      });
    }

    // ── SPECIAL BETS modal ────────────────────────────────────────
    // Player taps the SPECIAL BETS rail button → modal opens with 4
    // cards (one per ANTE_MODE). Selecting a card sets the mode and
    // closes the modal. The active mode's card is rendered in the
    // yellow "active" pill style (matches active chip + WIN amount).
    // Layout: horizontal row of cards on desktop, vertical stack on
    // mobile so each card stays a comfortable tap target.
    function openSpecialBetsModal() {
      if (scene.specialBetsModal) return;
      const modal = new PIXI.Container();
      modal._isSimpleModal = true;
      _openSimpleModalCount++;
      const sw = L.sw, sh = L.sh;
      const isMobile = !!L.isMobile;
      const scale = isMobile
        ? Math.min(sw * 0.94 / 540, sh * 0.92 / 600)
        : Math.min(1, Math.min(sw / 900, sh / 900));
      app.stage.addChild(modal);

      // Backdrop — click outside cards to close (returns to whatever
      // mode was active before the modal opened).
      const backdrop = new PIXI.Graphics();
      backdrop.beginFill(0x000000, 0.72);
      backdrop.drawRect(0, 0, sw, sh);
      backdrop.endFill();
      backdrop.eventMode = 'static';
      backdrop.on('pointertap', (e) => { if (e.target === backdrop) close(); });
      modal.addChild(backdrop);

      // Panel — same dark slate fill / yellow border as the BALANCE +
      // TOTAL BET pills, so the modal feels native to the game.
      // Normal/base isn't a "special bet" — it's the default mode.
      // Player returns to base via the toggle switch on the SPECIAL
      // BETS pill, not from this modal.
      const cards = [
        { key: 'ante1',  subtitle: '2× MORE FIRES', desc: 'Officers fire 2× more often.' },
        { key: 'super1', subtitle: 'ALL FIRE',      desc: 'All 4 officers always fire each spin.' },
        { key: 'super2', subtitle: 'MEGA MULTIPLIERS', desc: 'Mults from 10× up to 500×.' },
      ];
      const padY  = 28 * scale;
      const cardW = isMobile ? 380 * scale : 200 * scale;
      const cardH = isMobile ?  84 * scale : 220 * scale;
      const cardGap = 14 * scale;
      const titleH = 40 * scale;
      const closeR = 22 * scale;

      let panelW, panelH;
      if (isMobile) {
        panelW = cardW + padY * 2;
        panelH = padY + titleH + cards.length * cardH + (cards.length - 1) * cardGap + padY;
      } else {
        panelW = cards.length * cardW + (cards.length - 1) * cardGap + padY * 2;
        panelH = padY + titleH + cardH + padY;
      }
      const panelX = (sw - panelW) / 2;
      const panelY = (sh - panelH) / 2;

      const panel = new PIXI.Graphics();
      panel.lineStyle(3 * scale, 0xFFD23F, 1);
      panel.beginFill(0x1A2332, 0.98);
      panel.drawRoundedRect(panelX, panelY, panelW, panelH, 18 * scale);
      panel.endFill();
      panel.eventMode = 'static';
      panel.hitArea = new PIXI.Rectangle(panelX, panelY, panelW, panelH);
      modal.addChild(panel);

      // Title.
      const title = new PIXI.Text('SELECT A SPECIAL BET', {
        fontFamily: FONT, fontSize: 18 * scale, fill: 0xFFD23F,
        fontWeight: '800', letterSpacing: 2.4,
      });
      title.anchor.set(0.5);
      title.x = panelX + panelW / 2;
      title.y = panelY + padY + titleH / 2 - 4 * scale;
      modal.addChild(title);

      // Close (×).
      const closeBtn = new PIXI.Container();
      const closeBg = new PIXI.Graphics();
      closeBg.lineStyle(2 * scale, 0xFFD23F, 1);
      closeBg.beginFill(0x2A3548, 0.95);
      closeBg.drawCircle(0, 0, closeR);
      closeBg.endFill();
      closeBtn.addChild(closeBg);
      const closeX = new PIXI.Text('×', {
        fontFamily: 'Arial, sans-serif', fontWeight: 'bold',
        fontSize: closeR * 1.6, fill: 0xFFFFFF,
      });
      closeX.anchor.set(0.5);
      closeBtn.addChild(closeX);
      closeBtn.x = panelX + panelW - 22 * scale;
      closeBtn.y = panelY + 24 * scale;
      closeBtn.eventMode = 'static'; closeBtn.cursor = 'pointer';
      closeBtn.hitArea = new PIXI.Circle(0, 0, closeR);
      closeBtn.on('pointertap', () => close());
      modal.addChild(closeBtn);

      // Cards.
      const cardsTop  = panelY + padY + titleH;
      const cardsLeft = panelX + (panelW - (isMobile ? cardW : cards.length * cardW + (cards.length - 1) * cardGap)) / 2;
      const cardConts = [];
      cards.forEach((c, i) => {
        const def = ANTE_MODES[c.key];
        if (!def) return;
        const isActive = (ANTE_MODE === c.key);
        const cx = isMobile
          ? cardsLeft + cardW / 2
          : cardsLeft + cardW / 2 + i * (cardW + cardGap);
        const cy = isMobile
          ? cardsTop + cardH / 2 + i * (cardH + cardGap)
          : cardsTop + cardH / 2;

        const cont = new PIXI.Container();
        cont.x = cx; cont.y = cy;
        const bg = new PIXI.Graphics();
        const draw = (active, hover = false) => {
          bg.clear();
          // Active = saturated yellow fill (matches selected chip).
          // Inactive = dark slate, yellow border, hovers brighter.
          const fill   = active ? 0xFFD23F : (hover ? 0x3D4A66 : 0x2A3548);
          const stroke = active ? 0x1A2332 : 0xFFD23F;
          bg.lineStyle(active ? 3 * scale : 2 * scale, stroke, 1);
          bg.beginFill(fill, 1);
          bg.drawRoundedRect(-cardW / 2, -cardH / 2, cardW, cardH, 12 * scale);
          bg.endFill();
        };
        draw(isActive);
        cont.addChild(bg);
        const ink = isActive ? 0x1A2332 : 0xFFFFFF;
        const accent = isActive ? 0x1A2332 : 0xFFD23F;

        if (isMobile) {
          // Mobile card — horizontal row: name+cost on left, desc on right.
          const nameTxt = new PIXI.Text(def.name, {
            fontFamily: FONT, fontSize: 16 * scale,
            fill: ink, fontWeight: '800', letterSpacing: 2,
          });
          nameTxt.anchor.set(0, 0);
          nameTxt.x = -cardW / 2 + 16 * scale;
          nameTxt.y = -cardH / 2 + 12 * scale;
          cont.addChild(nameTxt);
          const costLabel = def.costMult > 0 ? `+${def.costMult}× BET` : 'NO EXTRA COST';
          const costTxt = new PIXI.Text(costLabel, {
            fontFamily: FONT, fontSize: 11 * scale,
            fill: accent, fontWeight: '700', letterSpacing: 1.4,
          });
          costTxt.anchor.set(0, 0);
          costTxt.x = -cardW / 2 + 16 * scale;
          costTxt.y = -cardH / 2 + 36 * scale;
          cont.addChild(costTxt);
          const descTxt = new PIXI.Text(c.desc, {
            fontFamily: FONT, fontSize: 12 * scale,
            fill: ink, fontWeight: '500',
          });
          descTxt.anchor.set(0, 0);
          descTxt.x = -cardW / 2 + 16 * scale;
          descTxt.y = -cardH / 2 + 56 * scale;
          cont.addChild(descTxt);
        } else {
          // Desktop card — vertical stack: name on top, cost middle, desc bottom.
          const nameTxt = new PIXI.Text(def.name, {
            fontFamily: FONT, fontSize: 22 * scale,
            fill: ink, fontWeight: '800', letterSpacing: 3,
          });
          nameTxt.anchor.set(0.5, 0);
          nameTxt.x = 0;
          nameTxt.y = -cardH / 2 + 24 * scale;
          cont.addChild(nameTxt);
          const costLabel = def.costMult > 0 ? `+${def.costMult}× BET` : 'STANDARD';
          const costTxt = new PIXI.Text(costLabel, {
            fontFamily: FONT, fontSize: 16 * scale,
            fill: accent, fontWeight: '800', letterSpacing: 2,
          });
          costTxt.anchor.set(0.5, 0);
          costTxt.x = 0;
          costTxt.y = -cardH / 2 + 70 * scale;
          cont.addChild(costTxt);
          // Wrap description to ~2 lines using simple word-wrap.
          const descTxt = new PIXI.Text(c.desc, {
            fontFamily: FONT, fontSize: 12 * scale,
            fill: ink, fontWeight: '500',
            wordWrap: true, wordWrapWidth: cardW - 24 * scale,
            align: 'center',
          });
          descTxt.anchor.set(0.5, 0);
          descTxt.x = 0;
          descTxt.y = -cardH / 2 + 110 * scale;
          cont.addChild(descTxt);
        }

        cont.eventMode = 'static';
        cont.cursor = 'pointer';
        cont.hitArea = new PIXI.Rectangle(-cardW / 2, -cardH / 2, cardW, cardH);
        cont.on('pointerover', () => { if (!isActive) draw(false, true); });
        cont.on('pointerout',  () => { if (!isActive) draw(false, false); });
        cont.on('pointertap', () => {
          setAnteMode(c.key);
          if (scene._refreshSpecialBetsBtn) scene._refreshSpecialBetsBtn();
          if (typeof refreshHUD === 'function') refreshHUD();
          close();
        });
        modal.addChild(cont);
        cardConts.push(cont);
      });

      modal.alpha = 0;
      gsap.to(modal, { alpha: 1, duration: 0.18, ease: 'power2.out' });
      scene.specialBetsModal = modal;

      let _closed = false;
      function close() {
        if (_closed) return;
        _closed = true;
        _openSimpleModalCount = Math.max(0, _openSimpleModalCount - 1);
        scene.specialBetsModal = null;
        gsap.to(modal, {
          alpha: 0, duration: 0.15, ease: 'power2.in',
          onComplete: () => modal.destroy({ children: true }),
        });
      }
    }

    // Soft dark radial halo — black-ish at centre fading to fully
    // transparent at the edge. Used as a "vignette behind a button"
    // that makes the button read as a popup over the navy canvas
    // (e.g. end-of-round WIN/REPEAT BET overlay, Clear Bets, etc.).
    // Returns a Sprite when canvas/getContext is available; a multi-
    // circle PIXI fallback otherwise (sim sandbox).
    function makeRadialHalo(diameter) {
      const size = Math.max(2, Math.round(diameter));
      try {
        const c = document.createElement('canvas');
        if (!c || typeof c.getContext !== 'function') throw 0;
        c.width = size; c.height = size;
        const ctx = c.getContext('2d');
        const r = size / 2;
        const grad = ctx.createRadialGradient(r, r, 0, r, r, r);
        grad.addColorStop(0,    'rgba(8, 14, 26, 0.98)');
        grad.addColorStop(0.45, 'rgba(8, 14, 26, 0.88)');
        grad.addColorStop(0.80, 'rgba(8, 14, 26, 0.45)');
        grad.addColorStop(1,    'rgba(8, 14, 26, 0.00)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, size, size);
        const sp = new PIXI.Sprite(PIXI.Texture.from(c));
        sp.anchor.set(0.5);
        return sp;
      } catch (_) {
        const g = new PIXI.Graphics();
        const steps = 12;
        for (let i = 0; i < steps; i++) {
          const t = i / steps;
          const a = 0.95 * Math.max(0, 1 - t * t);
          g.beginFill(0x080E1A, a);
          g.drawCircle(0, 0, (size / 2) * (1 - t));
          g.endFill();
        }
        return g;
      }
    }

    function buildScene() {
      L = layout();
      // Reset stage transform before tearing down children — if a resize
      // fires mid-shake (shakeStage), the new scene would render at a
      // non-zero offset and the UI shifts off-screen.
      gsap.killTweensOf(scene.stage);
      scene.stage.x = 0; scene.stage.y = 0;
      scene.stage.scale.set(1);
      scene.stage.removeChildren();
      const gs = L.gameScale;

      // (Background is the app's flat backgroundColor — no sprite.)
      // No big title — the mode-button row + GAME MODE caption (added at
      // the bottom of buildScene) own the top region instead.

      // 3. Frame container — backdrop + cell + ring backgrounds. Always
      // visible, never masked.
      const frame = new PIXI.Container();
      scene.frameContainer = frame;
      scene.stage.addChild(frame);

      // Backdrop panel under the whole frame.
      const panel = new PIXI.Graphics();
      // 30% — asphalt slab + sidewalk curb. Both cool greys, analogous
      // to the navy canvas → coherent receding base. Value steps:
      // canvas (#1A2332) < asphalt (#3D4452) < sidewalk (#A8AEB6) <
      // text (#FFFFFF). Itten light/dark contrast for readability.
      panel.lineStyle(6 * gs, 0xA8AEB6, 1);
      panel.beginFill(0x3D4452, 1);
      panel.drawRoundedRect(
        L.frameX - 14 * gs, L.frameY - 14 * gs,
        L.frameSize + 28 * gs, L.frameH + 28 * gs,
        18 * gs
      );
      panel.endFill();
      frame.addChild(panel);

      // 4. Slot cell backgrounds.
      // Slot cells are placed inside the frame's inner area. Base mode
      // leaves the LEFT column at frame visC=0 (no left conveyor); All
      // Slot cells = asphalt road squares (no lane stripes through the
      // cells themselves — those are drawn between cells below as a
      // single grid of lane markers).
      scene.cellBgs = []; scene.cells = []; scene.symbols = []; scene.stamps = [];
      const slotColOffset = (MODE === 'allAround' || MODE === 'rush' || MODE === 'base' || MODE === 'officer') ? 1 : 0;
      const drawDashedLine = (g, x1, y1, x2, y2, dashLen, gapLen) => {
        const dx = x2 - x1, dy = y2 - y1;
        const len = Math.hypot(dx, dy);
        if (len === 0) return;
        const ux = dx / len, uy = dy / len;
        let d = 0;
        while (d < len) {
          const e = Math.min(d + dashLen, len);
          g.moveTo(x1 + ux * d, y1 + uy * d);
          g.lineTo(x1 + ux * e, y1 + uy * e);
          d = e + gapLen;
        }
      };
      for (let r = 0; r < GAME.ROWS; r++) {
        scene.cellBgs[r] = [];
        for (let c = 0; c < GAME.COLS; c++) {
          const visR = r + 1, visC = c + slotColOffset;
          const x = L.frameX + (L.cellSize + L.cellGap) * visC;
          const y = L.frameY + (L.cellSize + L.cellGap) * visR;
          const bg = new PIXI.Graphics();
          // Deep asphalt — near-black square. High contrast against
          // the cream canvas, no rounded corners (real road squares).
          bg.lineStyle(0);
          // Cool asphalt — analogous to the navy canvas (Itten analogous
          // hue contrast → harmony) but darker for value separation.
          bg.beginFill(0x3D4452, 1);
          bg.drawRect(x, y, L.cellSize, L.cellSize);
          bg.endFill();
          frame.addChild(bg);
          scene.cellBgs[r][c] = bg;
        }
      }
      // Lane markings — long dashed white lines BETWEEN the cells of
      // the slot grid (not through them). Run continuously across the
      // whole grid so the inter-cell gaps read as road lanes.
      {
        const C = GAME.COLS, R = GAME.ROWS;
        const gridLeft = L.frameX + (L.cellSize + L.cellGap) * slotColOffset;
        const gridTop  = L.frameY + (L.cellSize + L.cellGap) * 1;
        const gridW    = C * L.cellSize + (C - 1) * L.cellGap;
        const gridH    = R * L.cellSize + (R - 1) * L.cellGap;
        const lanes = new PIXI.Graphics();
        // White lane paint — the dominant marking colour in real overhead
        // road art (Parking Jam, Traffic Jam 3D). Yellow is reserved for
        // the conveyor-edge centerline accent.
        lanes.lineStyle(3 * gs, 0xFFFFFF, 1);
        const dashLen = Math.max(L.cellSize * 0.20, 16);
        const gapLen  = Math.max(L.cellSize * 0.18, 14);
        // Vertical dashes — between column i and i+1.
        for (let i = 0; i < C - 1; i++) {
          const x = gridLeft + (i + 1) * L.cellSize + i * L.cellGap + L.cellGap / 2;
          drawDashedLine(lanes, x, gridTop, x, gridTop + gridH, dashLen, gapLen);
        }
        // Horizontal dashes — between row i and i+1.
        for (let i = 0; i < R - 1; i++) {
          const y = gridTop + (i + 1) * L.cellSize + i * L.cellGap + L.cellGap / 2;
          drawDashedLine(lanes, gridLeft, y, gridLeft + gridW, y, dashLen, gapLen);
        }
        frame.addChild(lanes);

        // Mini roundabouts at each interior 4-way intersection — small
        // grey discs ringed in white paint, with a 4-arm traffic light
        // sitting on top. Each arm is a triangular cone of light pointing
        // outward toward the next cell, color-coded by traffic state:
        //   green  = car can move that direction now (its turn this tick)
        //   yellow = car wants to move but it's not its turn yet
        //   red    = no car can move that way
        //   dimmed = idle / bet phase
        // Roundabouts always render (decorative grid markers, not
        // tied to the traffic-light feature flag).
        const roundabouts = new PIXI.Graphics();
        const rRound = Math.max(L.cellSize * 0.11, 7 * gs);
        for (let cy = 0; cy < R - 1; cy++) {
          const y = gridTop + (cy + 1) * L.cellSize + cy * L.cellGap + L.cellGap / 2;
          for (let cx = 0; cx < C - 1; cx++) {
            const x = gridLeft + (cx + 1) * L.cellSize + cx * L.cellGap + L.cellGap / 2;
            roundabouts.lineStyle(1.5 * gs, 0xFFFFFF, 0.95);
            roundabouts.beginFill(0x2A3140, 1);
            roundabouts.drawCircle(x, y, rRound);
            roundabouts.endFill();
            roundabouts.lineStyle(0);
            roundabouts.beginFill(0xFFFFFF, 0.85);
            roundabouts.drawCircle(x, y, rRound * 0.28);
            roundabouts.endFill();
          }
        }
        frame.addChild(roundabouts);

        // Whole block parked behind TRAFFIC_LIGHTS_ENABLED until we
        // settle on the final design (cones, fixture dots, state
        // machine). Roundabouts above are exempt and always render.
        if (TRAFFIC_LIGHTS_ENABLED) {
        const coneLen      = L.cellSize * 0.95;
        const coneHalfBase = L.cellSize * 0.30;   // ~30° half-angle
        const TL_COLORS = {
          green:   0x6FB89E,   // muted emerald — green-grey, less candy
          yellow:  0xD9C88A,   // muted gold — desaturated yellow
          red:     0x9A7878,   // muted brick — gray-tinged red
        };
        // The original loop populated the roundabouts AND a parallel
        // counter for the cone setup; with roundabouts moved out we
        // just need the no-op iteration shell here so the rest of the
        // gated cone-building code keeps the same structure.
        for (let cy = 0; cy < R - 1; cy++) {
          for (let cx = 0; cx < C - 1; cx++) {
            // (no-op — roundabouts handled above)
          }
        }

        // Per-cell traffic lights — 16 cells × 4 SOFT lights (N/E/S/W).
        // Each light is a Sprite using a shared radial-gradient texture
        // (white → transparent) tinted with the state colour. No hard
        // triangle outlines — soft glow that shines INTO the destination
        // cell from the lane line, like a US traffic light hung overhead
        // and washing the road below.
        const ARMS = [
          { ax: 0, ay: -1 },  // 0 = N
          { ax: 1, ay:  0 },  // 1 = E
          { ax: 0, ay:  1 },  // 2 = S
          { ax: -1, ay: 0 },  // 3 = W
        ];
        // Sprite rotation per direction. Anchor is (0.5, 1) so the
        // texture's bottom-centre sits on the lane line; the body of
        // the sprite extends in the rotated direction.
        const ARM_ROTATIONS = [0, Math.PI / 2, Math.PI, -Math.PI / 2];
        const STATE_COLOR = {
          green:  TL_COLORS.green,
          yellow: TL_COLORS.yellow,
          red:    TL_COLORS.red,
          dim:    TL_COLORS.green,
        };
        // Green (current move) and yellow (queued moves) lead; red
        // ("no traffic this direction this pass") stays visible so
        // every arm reads as "lit but stopped" rather than absent.
        // Dim (idle / bet phase) is hidden so the grid is calm
        // between rounds.
        const STATE_ALPHA = { green: 0.60, yellow: 0.55, red: 0.25, dim: 0.00 };
        const TRAIL_DURATION = 0.45;
        // Build the shared soft-light texture once. The texture is a
        // CONE — narrow apex at bottom-centre (the lane-line anchor)
        // fanning out toward the top, with a vertical linear gradient
        // for "bright source → fading beam". A canvas blur filter
        // softens the triangle's edges so it reads as a glow rather
        // than a hard polygon.
        let softLightTex = null;
        try {
          const _slCanvas = document.createElement('canvas');
          if (!_slCanvas || typeof _slCanvas.getContext !== 'function') throw 0;
          const _slSize = 256;
          _slCanvas.width = _slSize; _slCanvas.height = _slSize;
          const _slCtx = _slCanvas.getContext('2d');
          // Soften the cone's edges so it doesn't read as a hard
          // triangle. The blur extends ~18px outside the path, so we
          // inset the cone away from the canvas edges to avoid clipping.
          _slCtx.filter = 'blur(18px)';
          // Triangle path: narrow apex at TOP-centre, wide base at the
          // bottom. With the sprite anchor at (0.5, 0) and the cone
          // rotated per-direction, the apex sits at the lane-line
          // origin and the body extends INWARD into the cell whose
          // arm this is — so each cell's 4 cones converge in its own
          // centre and never reach into neighbour cells.
          const _slApexX = _slSize / 2;
          const _slApexY = _slSize * 0.05;
          const _slBaseY = _slSize * 0.90;
          const _slBaseLeft  = _slSize * 0.06;
          const _slBaseRight = _slSize * 0.94;
          _slCtx.beginPath();
          _slCtx.moveTo(_slApexX, _slApexY);
          _slCtx.lineTo(_slBaseLeft, _slBaseY);
          _slCtx.lineTo(_slBaseRight, _slBaseY);
          _slCtx.closePath();
          // Linear gradient along the cone's axis: bright at the apex
          // (= at the lane line), fading to transparent at the base
          // (= toward the cell centre).
          const _slG = _slCtx.createLinearGradient(0, _slApexY, 0, _slBaseY);
          _slG.addColorStop(0.00, 'rgba(255, 255, 255, 1.00)');
          _slG.addColorStop(0.35, 'rgba(255, 255, 255, 0.55)');
          _slG.addColorStop(0.75, 'rgba(255, 255, 255, 0.15)');
          _slG.addColorStop(1.00, 'rgba(255, 255, 255, 0.00)');
          _slCtx.fillStyle = _slG;
          _slCtx.fill();
          softLightTex = PIXI.Texture.from(_slCanvas);
        } catch (e) {
          softLightTex = null;
        }
        // Dedicated lights layer — must sit ABOVE fxLayer so the cone
        // glows render on top of cars (including cars in motion that
        // are temporarily reparented to fxLayer). lightsLayer itself
        // is added to the stage further down (after fxLayer is built).
        const lightsLayer = new PIXI.Container();
        scene.lightsLayer = lightsLayer;
        const fixtures = new PIXI.Graphics();
        scene._trafficCells = [];
        // Pull the cone apex slightly INSIDE the cell (just enough to
        // clear the lane-line dashes). Origin moves from "on the line"
        // to "just barely inside the cell".
        const apexInset  = L.cellSize * 0.02;
        const edgeOffset = L.cellSize / 2 - apexInset;
        // Cones are shorter (~0.6 cell) so beams from opposite cells
        // don't crash into each other in the middle of the grid. They
        // still cover the near half of the destination lane, which is
        // what reads as "the green light is here".
        const armSpriteW = (L.cellSize + L.cellGap) * 0.85;
        const armSpriteH = (L.cellSize + L.cellGap) * 0.60;
        // For each cell+direction, skip the arm if its edge faces the
        // outer conveyor ring — those edges are the EXITS, not interior
        // lane lines, so no traffic light belongs there.
        const armFacesExit = (r, c, d) => (
          (d === 0 && r === 0)         ||  // N edge of top row
          (d === 1 && c === C - 1)     ||  // E edge of rightmost col
          (d === 2 && r === R - 1)     ||  // S edge of bottom row
          (d === 3 && c === 0)              // W edge of leftmost col
        );
        for (let r = 0; r < R; r++) {
          for (let c = 0; c < C; c++) {
            const cx = gridLeft + c * (L.cellSize + L.cellGap) + L.cellSize / 2;
            const cy = gridTop  + r * (L.cellSize + L.cellGap) + L.cellSize / 2;
            const arms = [];
            for (let d = 0; d < 4; d++) {
              if (armFacesExit(r, c, d)) {
                arms.push(null);
                continue;
              }
              const a = ARMS[d];
              const ox = cx + a.ax * edgeOffset;
              const oy = cy + a.ay * edgeOffset;
              const cone = softLightTex
                ? new PIXI.Sprite(softLightTex)
                : new PIXI.Sprite(PIXI.Texture.EMPTY || null);
              if (cone.anchor && cone.anchor.set) cone.anchor.set(0.5, 0);
              cone.rotation = ARM_ROTATIONS[d];
              cone.width  = armSpriteW;
              cone.height = armSpriteH;
              cone.x = ox; cone.y = oy;
              cone.tint  = STATE_COLOR.dim;
              cone.alpha = STATE_ALPHA.dim;
              lightsLayer.addChild(cone);
              fixtures.lineStyle(0.8 * gs, 0x000000, 0.85);
              fixtures.beginFill(0x14181F, 1);
              fixtures.drawCircle(ox, oy, Math.max(2, L.cellSize * 0.035));
              fixtures.endFill();
              arms.push({
                cone,
                state: 'dim',
                trailTween: null,
              });
            }
            scene._trafficCells.push({ r, c, x: cx, y: cy, arms });
          }
        }
        lightsLayer.addChild(fixtures);
        // (Roundabouts already added to frame outside this gated block.)

        // Apply a state to a single arm. If the arm WAS green and is
        // transitioning away, kick off a fading green trail tween
        // before settling on the new state. Otherwise instant set.
        const applyArmState = (arm, newState) => {
          const cone = arm.cone;
          if (arm.trailTween) { arm.trailTween.kill(); arm.trailTween = null; }
          if (arm.state === 'green' && newState !== 'green') {
            // Trail: hold green tint, fade alpha to ~zero, then snap
            // to the new state's colour/alpha.
            cone.tint  = STATE_COLOR.green;
            cone.alpha = STATE_ALPHA.green;
            arm.trailTween = gsap.to(cone, {
              alpha: 0,
              duration: TRAIL_DURATION,
              ease: 'power2.out',
              onComplete: () => {
                cone.tint  = STATE_COLOR[newState];
                cone.alpha = STATE_ALPHA[newState];
                arm.trailTween = null;
              },
            });
          } else {
            cone.tint  = STATE_COLOR[newState];
            cone.alpha = STATE_ALPHA[newState];
          }
          arm.state = newState;
        };
        scene._applyArmState = applyArmState;

        // Public helpers — used by the animator and round-end cleanup.
        scene.setTrafficAllDim = () => {
          for (const tc of scene._trafficCells) {
            for (const arm of tc.arms) {
              if (arm) applyArmState(arm, 'dim');
            }
          }
        };
        // Look up a cell's arm by (row, col, dir). Used by the spin
        // animator to drive lights from move events. May return null
        // if the requested arm faces the outer conveyor (edge cell).
        scene.getCellArm = (r, c, d) => {
          const tc = scene._trafficCells[r * C + c];
          return tc && tc.arms[d];
        };
        } // end if (TRAFFIC_LIGHTS_ENABLED)
      }

      // 5. Ring cells (conveyor) — each one is a "bet target". Tap the
      // cell to add one chip; a − button appears next to the stake when
      // there's something to remove.
      // Layout per cell:
      //     stake amount $X  −     (top, − only when stake > 0)
      //     outward chevron        (middle)
      //     odds ×N.NN             (bottom)
      scene.ringCells       = {};
      scene.ringCellBgs     = {};
      scene.ringTokens      = {};
      scene.arrowBetTexts   = {};
      scene.arrowOddsTexts  = {};
      scene.arrowMinusBtns  = {};
      scene.arrowChevrons   = {};
      const C = GAME.COLS, R = GAME.ROWS;
      const directionForRingSlot = (pos) =>
        (pos >= 1 && pos <= C)                       ? 'up' :
        (pos >= C + 1 && pos <= C + R)               ? 'right' :
        (pos >= C + R + 1 && pos <= 2 * C + R)       ? 'down' :
        (pos >= 2 * C + R + 1 && pos <= 2 * (C + R)) ? 'left' :
        null;
      // Clear badge — small X in a circle, anchored to the corner of a
      // staked cell. One tap clears the entire stake on that arrow.
      const makeTrashBadge = (onTap) => {
        const cont = new PIXI.Container();
        const r = 9 * gs;
        const bg = new PIXI.Graphics();
        const draw = (hover = false) => {
          bg.clear();
          bg.lineStyle(1.5 * gs, 0xE63946, 1);
          bg.beginFill(hover ? 0xC4262F : 0x8A1A22, 1);
          bg.drawCircle(0, 0, r);
          bg.endFill();
        };
        draw();
        cont.addChild(bg);
        // X glyph
        const x = new PIXI.Graphics();
        x.lineStyle(2 * gs, 0xFFFFFF, 1);
        const off = r * 0.45;
        x.moveTo(-off, -off); x.lineTo( off,  off);
        x.moveTo( off, -off); x.lineTo(-off,  off);
        cont.addChild(x);
        cont.eventMode = 'static';
        cont.cursor    = 'pointer';
        cont.hitArea   = new PIXI.Circle(0, 0, r * 1.5);
        cont.on('pointerover', () => { draw(true);  cont.scale.set(1.15); });
        cont.on('pointerout',  () => { draw(false); cont.scale.set(1.00); });
        cont.on('pointertap', (e) => {
          if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
          if (e && typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
          onTap();
        });
        return cont;
      };
      const makeArrowChipBtn = (label, accent, onTap) => {
        const cont = new PIXI.Container();
        const radius = 9 * gs;
        const bg = new PIXI.Graphics();
        const draw = (hover = false) => {
          bg.clear();
          bg.lineStyle(1.5 * gs, accent, 0.95);
          bg.beginFill(hover ? 0x3D4A6E : 0x1A2238, 0.95);
          bg.drawCircle(0, 0, radius);
          bg.endFill();
        };
        draw();
        cont.addChild(bg);
        const t = new PIXI.Text(label, {
          fontFamily: FONT, fontSize: 16 * gs, fill: accent, fontWeight: 'bold',
        });
        t.anchor.set(0.5);
        t.y = -1;
        cont.addChild(t);
        cont.eventMode = 'static';
        cont.cursor    = 'pointer';
        cont.hitArea   = new PIXI.Circle(0, 0, radius * 1.4);
        cont.on('pointerover', () => { draw(true); cont.scale.set(1.10); });
        cont.on('pointerout',  () => { draw(false); cont.scale.set(1.00); });
        // Stop propagation so the minus tap doesn't bubble up to the
        // cell's "tap to add" handler and cancel itself out.
        cont.on('pointertap', (e) => {
          if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
          if (e && typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
          onTap();
        });
        return cont;
      };
      for (let pos = 1; pos <= RING_SIZE; pos++) {
        const ctr = ringCellCenter(pos);
        if (!ctr) continue;
        const cellCont = new PIXI.Container();
        cellCont.x = ctr.x;
        cellCont.y = ctr.y;

        // Staked-cell glow — sits BEHIND the cell bg. Two concentric
        // soft yellow rounded-rects acting as a halo. Hidden by
        // default; toggled by refreshArrowBetVisuals when the cell
        // gets a stake.
        const glow = new PIXI.Graphics();
        const glowOuterPad = 9 * gs;
        const glowInnerPad = 4 * gs;
        glow.beginFill(0xFFD23F, 0.10);
        glow.drawRoundedRect(
          -L.cellSize / 2 - glowOuterPad,
          -L.cellSize / 2 - glowOuterPad,
          L.cellSize + glowOuterPad * 2,
          L.cellSize + glowOuterPad * 2,
          (6 + glowOuterPad) * gs
        );
        glow.endFill();
        glow.beginFill(0xFFD23F, 0.20);
        glow.drawRoundedRect(
          -L.cellSize / 2 - glowInnerPad,
          -L.cellSize / 2 - glowInnerPad,
          L.cellSize + glowInnerPad * 2,
          L.cellSize + glowInnerPad * 2,
          (6 + glowInnerPad) * gs
        );
        glow.endFill();
        glow.visible = false;
        cellCont.addChild(glow);
        scene._stakeGlows = scene._stakeGlows || {};
        scene._stakeGlows[pos] = glow;

        // Bet target — dark navy tile, high contrast against the
        // cream canvas. Acts like a button.
        const bg = new PIXI.Graphics();
        // Conveyor = same cool asphalt as the inner grid, with a yellow
        // centerline outline tying it to the WIN-gold accent family.
        bg.lineStyle(2 * gs, 0xFFD23F, 0.85);
        bg.beginFill(0x3D4452, 1);
        bg.drawRoundedRect(
          -L.cellSize / 2, -L.cellSize / 2,
          L.cellSize, L.cellSize, 6 * gs
        );
        bg.endFill();
        cellCont.addChild(bg);
        // Cell layout — three vertical zones:
        //   chevron  (top)
        //   stake    (middle, only when staked)
        //   multi    (bottom)
        //   X badge  (top-right corner, only when staked)
        const outDir = directionForRingSlot(pos);
        let chev = null;
        if (outDir) {
          chev = new PIXI.Graphics();
          chev.lineStyle(4 * gs, 0xF2C744, 1);   // cadmium-yellow — matches lane paint
          const sz = L.cellSize * 0.14;
          const angle =
            outDir === 'right' ?  0 :
            outDir === 'down'  ?  Math.PI / 2 :
            outDir === 'left'  ?  Math.PI :
            /* up */              -Math.PI / 2;
          const cos = Math.cos(angle), sin = Math.sin(angle);
          const seg = (x1, y1, x2, y2) => {
            chev.moveTo(x1 * cos - y1 * sin, x1 * sin + y1 * cos);
            chev.lineTo(x2 * cos - y2 * sin, x2 * sin + y2 * cos);
          };
          seg(-sz, 0,  sz, 0);
          seg(  0,-sz, sz, 0);
          seg(  0, sz, sz, 0);
          chev.x = 0;
          chev.y = 0;     // arrow lives in the middle
          cellCont.addChild(chev);
        }
        // Multiplier — bright white text on the asphalt cell, like a
        // freshly-painted road number. Show whole-number values
        // without trailing ".0" (so "4x" / "5x", not "4.0x" / "5.0x").
        const _oddsRaw = arrowOddsFor(pos);
        const _oddsStr = (_oddsRaw % 1 === 0)
          ? `${_oddsRaw}x`
          : `${_oddsRaw.toFixed(1)}x`;
        const oddsTxt = new PIXI.Text(
          _oddsStr,
          {
            fontFamily: FONT, fontSize: 17 * gs,
            fill: 0xFFFFFF, fontWeight: '800',
          }
        );
        oddsTxt.anchor.set(0.5);
        oddsTxt.x = 0;
        oddsTxt.y = L.cellSize * 0.32;
        cellCont.addChild(oddsTxt);
        // Stake CHIP — top zone of the cell, horizontally centred. The
        // arrow stays clear in the middle.
        //   ┌─────────┐
        //   │ ⟦$5⟧  ⊗│   stake chip + X badge (top)
        //   │    ↑    │   chevron (centre)
        //   │   ×2.9  │   multiplier (bottom)
        //   └─────────┘
        const stakeChipW = L.cellSize * 0.46;
        const stakeChipH = L.cellSize * 0.22;
        const stakeChipBg = new PIXI.Graphics();
        // Stake reads as a yellow "construction-zone" chip pinned to the
        // road — no dark-amber. Saturated yellow body, dark text.
        stakeChipBg.lineStyle(1 * gs, 0x2A2A28, 0.9);
        stakeChipBg.beginFill(0xFFD23F, 1);
        stakeChipBg.drawRoundedRect(
          -stakeChipW / 2, -stakeChipH / 2,
          stakeChipW, stakeChipH, stakeChipH * 0.5
        );
        stakeChipBg.endFill();
        stakeChipBg.x = 0;
        stakeChipBg.y = -L.cellSize * 0.32;
        cellCont.addChild(stakeChipBg);
        const stakeTxt = new PIXI.Text('', {
          fontFamily: FONT, fontSize: 11 * gs,
          fill: 0x1F1F1D, fontWeight: '800',
        });
        stakeTxt.anchor.set(0.5);
        stakeTxt.x = 0;
        stakeTxt.y = -L.cellSize * 0.32;
        cellCont.addChild(stakeTxt);
        // Clear badge sits ON the top-right CORNER of the cell — the
        // X straddles the border so it reads as an "outside" delete
        // affordance, not part of the cell's content.
        const minusBtn = makeTrashBadge(() => onArrowClear(pos), gs);
        minusBtn.x =  L.cellSize * 0.50;   // right edge of cell
        minusBtn.y = -L.cellSize * 0.50;   // top edge of cell
        cellCont.addChild(minusBtn);
        // Track the chip BG so it can hide when there's no stake.
        scene._stakeChipBgs = scene._stakeChipBgs || {};
        scene._stakeChipBgs[pos] = stakeChipBg;
        // The cell itself is the "+" target — tap anywhere on it to
        // add one chip to this arrow's stake.
        cellCont.eventMode = 'static';
        cellCont.cursor    = 'pointer';
        cellCont.hitArea   = new PIXI.Rectangle(
          -L.cellSize / 2, -L.cellSize / 2,
          L.cellSize, L.cellSize
        );
        cellCont.on('pointertap',  () => onArrowAddOne(pos));
        cellCont.on('pointerover', () => { bg.alpha = 0.78; });
        cellCont.on('pointerout',  () => { bg.alpha = 1.00; });
        frame.addChild(cellCont);
        scene.ringCells[pos]      = cellCont;
        scene.ringCellBgs[pos]    = bg;
        scene.ringTokens[pos]     = null;
        scene.arrowBetTexts[pos]  = stakeTxt;
        scene.arrowOddsTexts[pos] = oddsTxt;
        scene.arrowMinusBtns[pos] = minusBtn;
        if (chev) scene.arrowChevrons[pos] = chev;
      }
      refreshArrowBetVisuals();

      // (Creator portal + destroyer + connector dots removed — Rush
      // Hour has no tokens walking the conveyor, so those decorations
      // are dead chrome.)
      scene.creatingTileCtr  = null;
      scene.destroyingTileCtr = null;

      // ── Traffic officers ──
      // Officer sprites are built only when the active mode opts in
      // (officer / ante / super-ante variants). Base mode leaves
      // scene.officers unset; the spin-flow's _playOfficerBoosts
      // early-returns on empty `fired` arrays so no sprite lookup
      // ever runs.
      // The actual sprite construction lives in buildOfficerWidgets
      // at module scope; the per-mode hook below calls into it.
      const _officerInlineSkip = () => {
      const officerCornerVis = [
        { visR: 0,             visC: 0,             corner: 0 }, // TL
        { visR: 0,             visC: GAME.COLS + 1, corner: 1 }, // TR
        { visR: GAME.ROWS + 1, visC: GAME.COLS + 1, corner: 2 }, // BR
        { visR: GAME.ROWS + 1, visC: 0,             corner: 3 }, // BL
      ];
      const visToXY = (visR, visC) => ({
        x: L.frameX + (L.cellSize + L.cellGap) * visC + L.cellSize / 2,
        y: L.frameY + (L.cellSize + L.cellGap) * visR + L.cellSize / 2,
      });
      const makeOfficerSprite = () => {
        // Cartoon front-view police officer — peaked cap with badge,
        // sunglasses, mustache, navy uniform with gold tie. Reads as
        // a person, not a logo.
        const cont = new PIXI.Container();
        const s = L.cellSize / 90;

        // Body — navy uniform (drawn first so face/cap layer above)
        const body = new PIXI.Graphics();
        body.lineStyle(1.5 * s, 0x000000, 0.9);
        body.beginFill(0x14213D, 1);
        body.drawRoundedRect(-18 * s, 8 * s, 36 * s, 24 * s, 4 * s);
        body.endFill();
        cont.addChild(body);
        // Body button line down the front
        const btnLine = new PIXI.Graphics();
        btnLine.beginFill(0xFFD23F, 1);
        btnLine.drawRect(-1.5 * s, 10 * s, 3 * s, 14 * s);
        btnLine.endFill();
        // Two gold buttons
        btnLine.drawCircle(0, 13 * s, 1.6 * s);
        btnLine.drawCircle(0, 21 * s, 1.6 * s);
        cont.addChild(btnLine);
        // Shoulder epaulets
        const eps = new PIXI.Graphics();
        eps.beginFill(0xFFD23F, 0.95);
        eps.drawRoundedRect(-19 * s, 8 * s, 5 * s, 4 * s, 1 * s);
        eps.drawRoundedRect( 14 * s, 8 * s, 5 * s, 4 * s, 1 * s);
        eps.endFill();
        cont.addChild(eps);

        // Face — skin-toned rounded rectangle
        const face = new PIXI.Graphics();
        face.lineStyle(1 * s, 0x6E4A2A, 0.7);
        face.beginFill(0xF2C29A, 1);
        face.drawRoundedRect(-13 * s, -14 * s, 26 * s, 22 * s, 7 * s);
        face.endFill();
        cont.addChild(face);

        // Sunglasses — thick black horizontal bar with two lens highlights
        const shades = new PIXI.Graphics();
        shades.beginFill(0x000000, 1);
        shades.drawRoundedRect(-13 * s, -7 * s, 26 * s, 6 * s, 2 * s);
        shades.endFill();
        // Bridge between lenses
        shades.beginFill(0x1A1A1A, 1);
        shades.drawRect(-1 * s, -6 * s, 2 * s, 4 * s);
        shades.endFill();
        // Lens reflections
        shades.beginFill(0xFFFFFF, 0.35);
        shades.drawCircle(-7 * s, -4.5 * s, 1.5 * s);
        shades.drawCircle( 7 * s, -4.5 * s, 1.5 * s);
        shades.endFill();
        cont.addChild(shades);

        // Mustache — two thick arches under the nose
        const stash = new PIXI.Graphics();
        stash.lineStyle(1 * s, 0x1A0F08, 1);
        stash.beginFill(0x3A2818, 1);
        // Left half
        stash.moveTo(-9 * s, 1 * s);
        stash.lineTo(-1 * s, 0 * s);
        stash.lineTo(-1 * s, 3 * s);
        stash.lineTo(-9 * s, 4 * s);
        stash.lineTo(-9 * s, 1 * s);
        // Right half
        stash.moveTo( 9 * s, 1 * s);
        stash.lineTo( 1 * s, 0 * s);
        stash.lineTo( 1 * s, 3 * s);
        stash.lineTo( 9 * s, 4 * s);
        stash.lineTo( 9 * s, 1 * s);
        stash.endFill();
        cont.addChild(stash);

        // Cap visor (peak) — thin black bar across the brow
        const visor = new PIXI.Graphics();
        visor.lineStyle(1 * s, 0x000000, 1);
        visor.beginFill(0x0A0A14, 1);
        visor.drawRoundedRect(-17 * s, -17 * s, 34 * s, 5 * s, 2 * s);
        visor.endFill();
        cont.addChild(visor);

        // Cap crown — navy block above the visor
        const cap = new PIXI.Graphics();
        cap.lineStyle(1.5 * s, 0x000000, 0.9);
        cap.beginFill(0x14213D, 1);
        // Slight trapezoid: narrower at top, wider at bottom
        cap.moveTo(-13 * s, -30 * s);
        cap.lineTo( 13 * s, -30 * s);
        cap.lineTo( 15 * s, -17 * s);
        cap.lineTo(-15 * s, -17 * s);
        cap.lineTo(-13 * s, -30 * s);
        cap.endFill();
        cont.addChild(cap);

        // Cap badge — gold star centred on the crown
        const badge = new PIXI.Graphics();
        badge.lineStyle(0.7 * s, 0x4A3208, 1);
        badge.beginFill(0xFFD23F, 1);
        const spikes = 5;
        const rOut = 4 * s, rIn = 1.6 * s;
        const cy = -23 * s;
        for (let i = 0; i < spikes * 2; i++) {
          const r = i % 2 === 0 ? rOut : rIn;
          const a = (i / (spikes * 2)) * Math.PI * 2 - Math.PI / 2;
          const px = Math.cos(a) * r;
          const py = Math.sin(a) * r + cy;
          if (i === 0) badge.moveTo(px, py); else badge.lineTo(px, py);
        }
        badge.lineTo(Math.cos(-Math.PI / 2) * rOut, Math.sin(-Math.PI / 2) * rOut + cy);
        badge.endFill();
        cont.addChild(badge);

        return cont;
      };
      scene.officers = [];
      for (const oc of officerCornerVis) {
        const ctr = visToXY(oc.visR, oc.visC);
        const sprite = makeOfficerSprite();
        sprite.x = ctr.x;
        sprite.y = ctr.y;
        sprite._cornerIdx = oc.corner;
        sprite._cornerCenter = { x: ctr.x, y: ctr.y };
        frame.addChild(sprite);
        scene.officers.push(sprite);
      }
      };
      // _officerInlineSkip is intentionally never called — it just
      // parks the legacy inline officer code so the diff stays small.
      // The officer hook below builds officers via buildOfficerWidgets.
      void _officerInlineSkip;

      // ── All Around: 3 corner ×2 markers ──────────────────────────────
      // Visual gates between sides where tokens upgrade tier. Drawn in
      // the frame's outer corner cells (TR, BR, BL). The TL corner is
      // reserved for the creator + destroyer.
      if (MODE === 'allAround') {
        const cornerCells = [
          { visR: 0,             visC: GAME.COLS + 1, label: 'TR' },
          { visR: GAME.ROWS + 1, visC: GAME.COLS + 1, label: 'BR' },
          { visR: GAME.ROWS + 1, visC: 0,             label: 'BL' },
        ];
        for (const cc of cornerCells) {
          const x = L.frameX + (L.cellSize + L.cellGap) * cc.visC;
          const y = L.frameY + (L.cellSize + L.cellGap) * cc.visR;
          const bg = new PIXI.Graphics();
          bg.lineStyle(2 * gs, 0xFFD54F, 1);              // bright gold
          bg.beginFill(0x3A2810, 0.95);                   // dark warm
          bg.drawRoundedRect(x, y, L.cellSize, L.cellSize, 10 * gs);
          bg.endFill();
          frame.addChild(bg);
          const txt = new PIXI.Text('×2', {
            fontFamily: FONT, fontSize: L.cellSize * 0.45,
            fill: 0xFFD54F, fontWeight: 'bold',
          });
          txt.anchor.set(0.5);
          txt.x = x + L.cellSize / 2;
          txt.y = y + L.cellSize / 2;
          frame.addChild(txt);
        }
      }

      // 6b. Cell mult-text layer — big "N×" text BEHIND symbols. Per the
      // user's spec: "the grid has the multiplier, not the symbol — symbols
      // drop ON TO the multipliers." So the big text is painted on the
      // grid surface and partially obscured by whatever symbol is on top
      // of it. The small upper-right badge (layer 6e below) carries the
      // legible read-out for the player.
      const cellMultTextLayer = new PIXI.Container();
      scene.cellMultTextLayer = cellMultTextLayer;
      scene.stage.addChild(cellMultTextLayer);
      scene.cellMultTexts = [];
      for (let r = 0; r < GAME.ROWS; r++) {
        scene.cellMultTexts[r] = [];
        for (let c = 0; c < GAME.COLS; c++) scene.cellMultTexts[r][c] = null;
      }

      // 6c. Slot layer — symbol containers (above the tint + big text).
      const slotLayer = new PIXI.Container();
      scene.slotLayer = slotLayer;
      scene.stage.addChild(slotLayer);
      for (let r = 0; r < GAME.ROWS; r++) {
        scene.cells[r] = []; scene.symbols[r] = []; scene.stamps[r] = [];
        for (let c = 0; c < GAME.COLS; c++) {
          const cont = new PIXI.Container();
          const ctr = slotCellCenter(r, c);
          cont.x = ctr.x; cont.y = ctr.y;
          slotLayer.addChild(cont);
          scene.cells[r][c] = cont;
          scene.symbols[r][c] = null;
          scene.stamps[r][c] = null;
        }
      }
      if (currentGrid) {
        for (let r = 0; r < GAME.ROWS; r++) {
          for (let c = 0; c < GAME.COLS; c++) {
            const cell = currentGrid[r][c];
            if (!cell) continue;
            const sym = makeSlotSymbol(cell, L.cellSize);
            scene.cells[r][c].addChild(sym);
            scene.symbols[r][c] = sym;
          }
        }
      }

      // 6d. Tile badge layer — small upper-right pill ON TOP of the symbol
      // showing the multiplier value as a legible read-out (BB pattern).
      const tileBadgeLayer = new PIXI.Container();
      scene.tileBadgeLayer = tileBadgeLayer;
      scene.stage.addChild(tileBadgeLayer);
      scene.tileBadges = [];
      for (let r = 0; r < GAME.ROWS; r++) {
        scene.tileBadges[r] = [];
        for (let c = 0; c < GAME.COLS; c++) scene.tileBadges[r][c] = null;
      }

      // Mask the slot ROWS×COLS region for all four layers (tint, big
      // text, symbols, badge).
      const slotColStart = (MODE === 'allAround' || MODE === 'rush' || MODE === 'base' || MODE === 'officer') ? 1 : 0;
      const slotLeft = L.frameX + (L.cellSize + L.cellGap) * slotColStart;
      const slotRight = slotLeft + (L.cellSize + L.cellGap) * GAME.COLS - L.cellGap;
      const slotTop = L.frameY + (L.cellSize + L.cellGap) * 1;
      const slotBottom = L.frameY + (L.cellSize + L.cellGap) * (GAME.ROWS + 1) - L.cellGap;
      const gridMask = new PIXI.Graphics();
      gridMask.beginFill(0xFFFFFF);
      gridMask.drawRect(slotLeft, slotTop, slotRight - slotLeft, slotBottom - slotTop);
      gridMask.endFill();
      scene.stage.addChild(gridMask);
      slotLayer.mask = gridMask;
      cellMultTextLayer.mask = gridMask;
      tileBadgeLayer.mask = gridMask;
      scene.gridMask = gridMask;

      // 7. Conveyor token layer — sits ABOVE the slot layer (so a token
      // animation overlapping the slot grid renders in front of symbols).
      // Not masked — tokens travel along the L outside the slot bounds.
      const conveyorLayer = new PIXI.Container();
      scene.conveyorLayer = conveyorLayer;
      scene.stage.addChild(conveyorLayer);

      // 8. FX layer on top of everything.
      const fx = new PIXI.Container();
      scene.fxLayer = fx;
      scene.stage.addChild(fx);
      // 8b. Traffic-light cones layer — even higher z than fxLayer so
      // the green/yellow glows render ABOVE cars, including cars
      // currently being animated through fxLayer.
      if (scene.lightsLayer) scene.stage.addChild(scene.lightsLayer);

      // ─────────────────────────────────────────────────────────────
      //   HUD layout (Stake-style instant-win)
      // ─────────────────────────────────────────────────────────────
      //   ┌────────── top bar ──────────┐
      //   │  [info]  BAL  •  WIN  •  …  │
      //   ├──────── grid ────────┬─ pnl ┤
      //   │                      │ tabs │
      //   │      [arrow grid]    │ chip │
      //   │                      │ totl │
      //   │                      │ ctrl │
      //   │                      │ PLAY │
      //   └──────────────────────┴──────┘
      const TOP_BAR_H = L.topBarH || 60;

      // ── Top bar ────────────────────────────────────────────────
      // Thin strip across the top with info + balance + win.
      // No top bar fill — the BALANCE pill floats directly on the navy
      // canvas. Removes the unnecessary horizontal slab and keeps the
      // top of the screen visually quiet.

      // Info icon — placed at the bottom panel (set later after the
      // panel CY is computed). Built here, positioned below.
      const infoSize = 36;
      scene.infoBtn = new PIXI.Sprite(infoButtonTexture);
      scene.infoBtn.anchor.set(0.5);
      scene.infoBtn.scale.set(infoSize / infoButtonTexture.height);
      scene.infoBtn.eventMode = 'static'; scene.infoBtn.cursor = 'pointer';
      const infoBaseScale = scene.infoBtn.scale.x;
      scene.infoBtn.on('pointerover', () => gsap.to(scene.infoBtn.scale, { x: infoBaseScale * 1.10, y: infoBaseScale * 1.10, duration: 0.12 }));
      scene.infoBtn.on('pointerout',  () => gsap.to(scene.infoBtn.scale, { x: infoBaseScale, y: infoBaseScale, duration: 0.12 }));
      scene.infoBtn.on('pointertap',  () => openPaytableModal());
      scene.stage.addChild(scene.infoBtn);

      // Balance — vertical-stack pill so any value width fits cleanly:
      //   tiny LABEL on top, value below in larger weight.
      const makeTopBarPill = (label, value, accent) => {
        const w = 180, h = 42;
        const cont = new PIXI.Container();
        // No background — label + value float on the navy canvas to
        // remove the unnecessary dark slab that was bracketing the
        // BALANCE readout.
        const lbl = new PIXI.Text(label, {
          fontFamily: FONT, fontSize: 9, fill: 0xFFD23F,
          letterSpacing: 1.6, fontWeight: '700',
        });
        lbl.anchor.set(0.5, 0);
        lbl.x = 0;
        lbl.y = -h / 2 + 4;
        cont.addChild(lbl);
        const val = new PIXI.Text(value, {
          fontFamily: FONT, fontSize: 16, fill: 0xFFFFFF, fontWeight: '800',
        });
        val.anchor.set(0.5, 0);
        val.x = 0;
        val.y = -h / 2 + 18;
        cont.addChild(val);
        cont.valText = val;
        cont.labelText = lbl;
        return cont;
      };
      // BALANCE pill is now created inside the bottom panel (top row),
      // so the top bar stays empty. Mode buttons are also disabled —
      // Officer mode is the only allowed mode and is set as default.
      // The makeTopBarPill helper + makeModeButton + openModeConfirmModal
      // helpers are kept intentionally for future re-introduction.

      // ── BIG WIN headline + status subtitle (above the grid) ────
      // The WIN amount is the dominant visual on the screen — Aviator-
      // style centred number that pops on each round resolution.
