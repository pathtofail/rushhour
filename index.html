            // Straight slide.
            const target = ringCellCenter(newPos);
            tweens.push(new Promise(res => {
              gsap.to(sprite, {
                x: target.x, y: target.y,
                duration, ease: 'power2.inOut',
                onComplete: res,
              });
            }));
            scene.ringTokens[pos] = null;
            scene.ringTokens[newPos] = sprite;
          }
        }
        await Promise.all(tweens);
      }

      // BIG corner upgrade beat — slide to corner, scale-up + flash +
      // label swap at the corner cell, slide to the final position with
      // the upgraded sprite. Returns the new sprite (since the original
      // is destroyed during the swap).
      async _animateUpgradeAt(oldSprite, token, cornerCtr, finalCtr, totalDuration = 1.0) {
        const slideIn  = totalDuration * 0.35;
        const flashIn  = 0.18;
        const flashSettle = 0.16;
        const slideOut = totalDuration * 0.35;

        // Phase 1: slide INTO the corner.
        await new Promise(res => {
          gsap.to(oldSprite, {
            x: cornerCtr.x, y: cornerCtr.y,
            duration: slideIn, ease: 'power2.in',
            onComplete: res,
          });
        });

        // Corner cell flash (gold pulse on the ×2 marker behind the chip).
        this._flashCornerAt(cornerCtr);

        // Phase 2: scale UP — the upgrade beat.
        await new Promise(res => {
          gsap.to(oldSprite.scale, {
            x: 1.55, y: 1.55,
            duration: flashIn, ease: 'back.out(2.6)',
            onComplete: res,
          });
        });

        // Phase 3: cross-fade into the upgraded sprite (new tier label).
        const newSprite = makeTokenSprite(token, L.cellSize);
        newSprite.x = cornerCtr.x; newSprite.y = cornerCtr.y;
        newSprite.scale.set(1.55);
        newSprite.alpha = 0;
        scene.conveyorLayer.addChild(newSprite);
        await new Promise(res => {
          gsap.timeline({
            onComplete: () => {
              if (oldSprite.parent) oldSprite.parent.removeChild(oldSprite);
              oldSprite.destroy({ children: true });
              res();
            },
          })
            .to(oldSprite, { alpha: 0, duration: 0.16, ease: 'power2.in' }, 0)
            .to(newSprite, { alpha: 1, duration: 0.16, ease: 'power2.out' }, 0);
        });

        // Phase 4: settle scale.
        await new Promise(res => {
          gsap.to(newSprite.scale, {
            x: 1.0, y: 1.0,
            duration: flashSettle, ease: 'power2.inOut',
            onComplete: res,
          });
        });

        // Phase 5: slide OUT to the final position.
        await new Promise(res => {
          gsap.to(newSprite, {
            x: finalCtr.x, y: finalCtr.y,
            duration: slideOut, ease: 'power2.out',
            onComplete: res,
          });
        });

        return newSprite;
      }

      // Brief gold pulse over a corner ×2 cell when a token crosses it.
      _flashCornerAt({ x, y }) {
        const gs = L.gameScale;
        const sz = L.cellSize;
        const ring = new PIXI.Graphics();
        ring.lineStyle(4 * gs, 0xFFD54F, 1);
        ring.drawRoundedRect(-sz / 2, -sz / 2, sz, sz, 10 * gs);
        ring.x = x; ring.y = y; ring.alpha = 0;
        scene.fxLayer.addChild(ring);
        gsap.timeline({ onComplete: () => ring.destroy() })
          .to(ring,        { alpha: 1, duration: 0.10, ease: 'power2.out' }, 0)
          .to(ring.scale,  { x: 1.40, y: 1.40, duration: 0.55, ease: 'power2.out' }, 0)
          .to(ring,        { alpha: 0, duration: 0.45, ease: 'power2.in' }, 0.20);
      }

      // BIG burst played when an Activator fires — concentric expanding
      // ring + 8 sparks flying outward + bright flash dot. Used in
      // Activator mode when a token is intercepted via an activator.
      _activatorActivateBurst({ x, y }) {
        const gs = L.gameScale;
        // Bright center flash.
        const flash = new PIXI.Graphics();
        flash.beginFill(0xFFFFFF, 1);
        flash.drawCircle(0, 0, L.cellSize * 0.40);
        flash.endFill();
        flash.x = x; flash.y = y;
        flash.alpha = 0; flash.scale.set(0.3);
        scene.fxLayer.addChild(flash);
        gsap.timeline({ onComplete: () => flash.destroy() })
          .to(flash,       { alpha: 0.85, duration: 0.08, ease: 'power2.out' }, 0)
          .to(flash.scale, { x: 1.5, y: 1.5, duration: 0.30, ease: 'power2.out' }, 0)
          .to(flash,       { alpha: 0, duration: 0.30, ease: 'power2.in' }, 0.08);
        // Expanding gold ring.
        const ring = new PIXI.Graphics();
        ring.lineStyle(5 * gs, 0xFFD54F, 1);
        ring.drawCircle(0, 0, L.cellSize * 0.45);
        ring.x = x; ring.y = y;
        ring.alpha = 0;
        scene.fxLayer.addChild(ring);
        gsap.timeline({ onComplete: () => ring.destroy() })
          .to(ring,        { alpha: 1, duration: 0.10, ease: 'power2.out' }, 0)
          .to(ring.scale,  { x: 2.6, y: 2.6, duration: 0.65, ease: 'power2.out' }, 0)
          .to(ring,        { alpha: 0, duration: 0.50, ease: 'power2.in' }, 0.20);
        // Sparks shooting outward in 8 directions.
        for (let i = 0; i < 8; i++) {
          const angle = (i / 8) * Math.PI * 2;
          const spark = new PIXI.Graphics();
          spark.beginFill(0xFFD54F, 1);
          spark.drawCircle(0, 0, 5 * gs);
          spark.endFill();
          spark.x = x; spark.y = y;
          scene.fxLayer.addChild(spark);
          const dist = L.cellSize * 1.20;
          gsap.timeline({ onComplete: () => spark.destroy() })
            .to(spark, {
              x: x + Math.cos(angle) * dist,
              y: y + Math.sin(angle) * dist,
              duration: 0.50, ease: 'power2.out',
            }, 0)
            .to(spark.scale, { x: 0.35, y: 0.35, duration: 0.50, ease: 'power2.out' }, 0)
            .to(spark, { alpha: 0, duration: 0.30, ease: 'power2.in' }, 0.20);
        }
      }

      // Briefly overlay a red X on the TL corner cell to signal a token
      // being destroyed (All Around — factory + destroyer share that
      // cell). Drawn on the fx layer so it sits above everything; fades
      // back out in ~0.4s.
      _flashDestroyAt({ x, y }) {
        const gs = L.gameScale;
        const sz = L.cellSize;
        const cont = new PIXI.Container();
        cont.x = x; cont.y = y;
        const bg = new PIXI.Graphics();
        bg.beginFill(0x8E1A1A, 0.92);
        bg.drawRoundedRect(-sz / 2, -sz / 2, sz, sz, 10 * gs);
        bg.endFill();
        bg.lineStyle(3 * gs, 0xFF6E6E, 1);
        const off = sz * 0.26;
        bg.moveTo(-off, -off); bg.lineTo(off, off);
        bg.moveTo(off, -off);  bg.lineTo(-off, off);
        cont.addChild(bg);
        cont.alpha = 0;
        scene.fxLayer.addChild(cont);
        gsap.timeline({ onComplete: () => cont.destroy({ children: true }) })
          .to(cont,       { alpha: 1, duration: 0.10, ease: 'power2.out' }, 0)
          .to(cont.scale, { x: 1.10, y: 1.10, duration: 0.14, ease: 'back.out(2.4)' }, 0)
          .to(cont,       { alpha: 0, duration: 0.20, ease: 'power2.in' }, 0.20)
          .to(cont.scale, { x: 0.92, y: 0.92, duration: 0.20, ease: 'power2.in' }, 0.20);
      }

      // Real "spin": drop the existing grid out (downward fall), then
      // drop the new grid in from above with a stagger per column.
      async _spinDropOut() {
        // Cars vanish in place — fade + scale-down + small puff, no
        // falling motion. Quick clean-up before the new round drops in.
        const tweens = [];
        for (let r = 0; r < GAME.ROWS; r++) {
          for (let c = 0; c < GAME.COLS; c++) {
            const cellContainer = scene.cells[r] && scene.cells[r][c];
            if (cellContainer) {
              const children = cellContainer.children.slice();
              for (const sym of children) {
                if (!sym) continue;
                this._killSpriteTweens(sym);
                // Tiny smoke puff at the cell so the disappear has a
                // little weight to it.
                const cellCtr = slotCellCenter(r, c);
                if (typeof spawnExhaustPuff === 'function') {
                  spawnExhaustPuff(scene.fxLayer, cellCtr.x, cellCtr.y, 'down', 0.4);
                }
                tweens.push(new Promise(res => {
                  gsap.timeline({ onComplete: () => {
                      if (sym.parent) sym.parent.removeChild(sym);
                      if (sym.destroy) sym.destroy({ children: true });
                      res();
                    } })
                    .to(sym,       { alpha: 0, duration: 0.22, ease: 'power2.in' }, 0)
                    .to(sym.scale, { x: 0.6, y: 0.6, duration: 0.22, ease: 'power2.in' }, 0);
                }));
              }
            }
            scene.symbols[r][c] = null;
            // Drop stamp big text along with its symbol.
            const txt = scene.cellMultTexts && scene.cellMultTexts[r][c];
            if (txt) {
              gsap.to(txt, {
                y: txt.y + dropDist,
                duration: 0.25, ease: 'power2.in',
                onComplete: () => {
                  if (txt.parent) txt.parent.removeChild(txt);
                  txt.destroy();
                  scene.cellMultTexts[r][c] = null;
                  if (scene.stamps && scene.stamps[r]) scene.stamps[r][c] = null;
                },
              });
            }
            const badge = scene.tileBadges && scene.tileBadges[r][c];
            if (badge) {
              gsap.to(badge, {
                y: badge.y + dropDist,
                duration: 0.25, ease: 'power2.in',
                onComplete: () => {
                  if (badge.parent) badge.parent.removeChild(badge);
                  badge.destroy({ children: true });
                  scene.tileBadges[r][c] = null;
                },
              });
            }
          }
        }
        await Promise.all(tweens);
      }

      async _spinDropIn(grid) {
        // Cars appear in place with a fade + scale-up pop. Cells are
        // visited in RANDOM order so the grid materialises with no row
        // or column rhythm — feels organic.
        const tweens = [];
        const cells = [];
        for (let r = 0; r < GAME.ROWS; r++) {
          for (let c = 0; c < GAME.COLS; c++) {
            if (grid[r][c]) cells.push({ r, c });
          }
        }
        // Fisher–Yates shuffle.
        for (let i = cells.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [cells[i], cells[j]] = [cells[j], cells[i]];
        }
        cells.forEach(({ r, c }, i) => {
          const cell = grid[r][c];
          const sym = makeSlotSymbol(cell, L.cellSize);
          scene.cells[r][c].addChild(sym);
          scene.symbols[r][c] = sym;
          sym.x = 0; sym.y = 0;
          sym.alpha = 0;
          sym.scale.set(0.55);
          const delay = i * 0.022;
          tweens.push(new Promise(res => {
            gsap.timeline({ delay, onComplete: res })
              .to(sym,       { alpha: 1, duration: 0.18, ease: 'power2.out' }, 0)
              .to(sym.scale, { x: 1, y: 1, duration: 0.30, ease: 'back.out(2.4)' }, 0);
          }));
        });
        if (tweens.length) await Promise.all(tweens);
      }

      // Build a single multiplier badge — gold-bordered pill with
      // colour-tiered fill that pops against the cell. Used both as
      // the flying badge and the sticky boost marker.
      _makeBoostBadge(multiplier) {
        const cont = new PIXI.Container();
        const v = multiplier;
        // Tiered fill: small (<=10) gold, medium (<=100) orange, big purple.
        const tier = v >= 500 ? 'big' : (v >= 25 ? 'mid' : 'low');
        const fillCol = tier === 'big' ? 0x7C3AED : (tier === 'mid' ? 0xFF6B2C : 0xFFD23F);
        const borderCol = tier === 'big' ? 0xC9A8FF : (tier === 'mid' ? 0xFFC9A8 : 0xFFE082);
        const txtCol = tier === 'big' ? 0xFFFFFF : 0x2A1808;
        const w = 56, h = 28;
        const bg = new PIXI.Graphics();
        bg.lineStyle(2, borderCol, 1);
        bg.beginFill(fillCol, 1);
        bg.drawRoundedRect(-w / 2, -h / 2, w, h, h * 0.5);
        bg.endFill();
        cont.addChild(bg);
        const t = new PIXI.Text(`${v}x`, {
          fontFamily: FONT, fontSize: 14, fontWeight: '800',
          fill: txtCol,
        });
        t.anchor.set(0.5);
        cont.addChild(t);
        cont._tier = tier;
        return cont;
      }
      // Officer multiplier flies from corner → target arrow, lands ON
      // the multiplier text, then BAKES into the displayed value
      //   (e.g. 2.2x with a ×2 boost → 4.4x).
      // The flying badge fades after impact; only the boosted multi
      // text remains until the round ends.
      async _playOfficerBoosts(fired) {
        if (!fired || fired.length === 0) return;
        scene.boostFliers = scene.boostFliers || [];
        scene.boostedArrows = scene.boostedArrows || {}; // ringPos → original text style snapshot
        const flights = [];
        for (const f of fired) {
          const officer = scene.officers && scene.officers[f.corner];
          if (!officer) continue;
          // Read the officer figure's CURRENT world position so the
          // badge flies from wherever the patrol has them at this
          // moment, not the original spawn point.
          let start = officer._cornerCenter;
          if (officer._officerFigure && typeof officer._officerFigure.toGlobal === 'function') {
            try {
              const liveStart = officer._officerFigure.toGlobal({ x: 0, y: 0 });
              if (liveStart && typeof liveStart.x === 'number') start = liveStart;
            } catch (e) {}
          }
          const targetCell = scene.ringCells && scene.ringCells[f.ringPos];
          if (!targetCell) continue;
          const oddsTxt = scene.arrowOddsTexts && scene.arrowOddsTexts[f.ringPos];
          // Land at the multiplier text's screen position.
          const end = oddsTxt
            ? { x: targetCell.x + oddsTxt.x, y: targetCell.y + oddsTxt.y }
            : { x: targetCell.x, y: targetCell.y };
          // Officer "salutes" — bigger windup before the throw.
          gsap.timeline()
            .to(officer.scale, { x: 1.22, y: 1.22, duration: 0.30, ease: 'back.out(2.4)' }, 0)
            .to(officer.scale, { x: 1.00, y: 1.00, duration: 0.55, ease: 'elastic.out(1.4, 0.4)' }, 0.30);
          // Flying badge spawn at officer.
          const badge = this._makeBoostBadge(f.multiplier);
          badge.x = start.x; badge.y = start.y;
          badge.alpha = 0;
          badge.scale.set(0.4);
          scene.fxLayer.addChild(badge);
          scene.boostFliers.push(badge);
          // Arc flight — taller arc + slower flight so the throw reads
          // as a deliberate gesture, not a flash.
          const midX = (start.x + end.x) / 2;
          const midY = Math.min(start.y, end.y) - 110;
          const path = { t: 0 };
          flights.push(new Promise(res => {
            const tl = gsap.timeline({ onComplete: () => res() });
            tl.to(badge,       { alpha: 1, duration: 0.30, ease: 'power2.out' }, 0);
            tl.to(badge.scale, { x: 1, y: 1, duration: 0.45, ease: 'back.out(2.4)' }, 0);
            // Slight badge spin during the flight — 2 full turns so the
            // badge lands flat (readable orientation) at the end of the arc.
            tl.to(badge,       { rotation: Math.PI * 2, duration: 1.10, ease: 'power1.inOut' }, 0.15);
            tl.to(path, {
              t: 1, duration: 1.10, ease: 'power2.inOut',
              onUpdate: () => {
                const u = 1 - path.t;
                badge.x = u * u * start.x + 2 * u * path.t * midX + path.t * path.t * end.x;
                badge.y = u * u * start.y + 2 * u * path.t * midY + path.t * path.t * end.y;
              },
            }, 0.15);
            // On impact — full hit treatment:
            //   1) yellow flash burst at the impact point
            //   2) cell shake (whole cell wobbles)
            //   3) odds text bounces (overshoot scale, elastic settle)
            //   4) value count-ups (old → boosted) so the player sees
            //      the multiplier visibly EAT the existing value
            tl.call(() => {
              if (!oddsTxt) return;
              const cellCont = targetCell;

              // Capture the value currently shown so the count-up
              // starts from whatever's already there (handles stacking
              // when a second officer hits an already-boosted arrow).
              const oldShown = parseFloat(oddsTxt.text) || arrowOddsFor(f.ringPos);
              if (!scene.boostedArrows[f.ringPos]) {
                scene.boostedArrows[f.ringPos] = {
                  text: oddsTxt.text,
                  fill: oddsTxt.style.fill,
                  fontSize: oddsTxt.style.fontSize,
                };
              }
              const boosted = oldShown * f.multiplier;

              // ── Impact-weight scale ──
              // Bigger multipliers don't render bigger — they HIT
              // bigger. Scale up the flash, the shake, the bounce
              // and add stage-shake punctuation for the tiers that
              // matter (≥10× / ≥25× / ≥50×).
              //   tiny (2 / 4):    factor 0.85  — light impact
              //   medium (10):     factor 1.20  — standard
              //   big (25 / 50):   factor 1.70  — heavier shake, stage shake
              //   huge (100 +):    factor 2.40  — full-grid stage shake
              const m = f.multiplier;
              const huge   = m >= 100;
              const big    = m >= 25;
              const medium = m >= 10;
              const factor = huge ? 2.40 : big ? 1.70 : medium ? 1.20 : 0.85;
              const _gs = (L && L.gameScale) || 1;

              // 1) Impact flash — radial burst that scales with the tier.
              const flash = new PIXI.Graphics();
              flash.beginFill(0xFFD23F, Math.min(1, 0.7 + factor * 0.12));
              flash.drawCircle(0, 0, L.cellSize * 0.18);
              flash.endFill();
              flash.x = end.x; flash.y = end.y;
              flash.scale.set(0.4);
              scene.fxLayer.addChild(flash);
              const flashEnd = 2.0 + factor * 0.9;        // 2.7 → 4.16
              const flashDur = 0.40 + Math.min(0.30, factor * 0.10);
              gsap.timeline({ onComplete: () => { try { flash.destroy(); } catch (e) {} } })
                .to(flash.scale, { x: flashEnd, y: flashEnd, duration: flashDur, ease: 'power2.out' }, 0)
                .to(flash,       { alpha: 0,                  duration: flashDur, ease: 'power2.out' }, 0);
              // For big/huge multipliers, fire a SECOND ring outward
              // for an extra punch beat.
              if (big) {
                const ring = new PIXI.Graphics();
                ring.lineStyle(2 * _gs, 0xFFD23F, 0.9);
                ring.drawCircle(0, 0, L.cellSize * 0.20);
                ring.x = end.x; ring.y = end.y;
                ring.scale.set(0.3);
                scene.fxLayer.addChild(ring);
                gsap.timeline({ onComplete: () => { try { ring.destroy(); } catch (e) {} } })
                  .to(ring.scale, { x: 3.0 + factor * 0.3, y: 3.0 + factor * 0.3, duration: 0.55, ease: 'power2.out' }, 0)
                  .to(ring,       { alpha: 0, duration: 0.55, ease: 'power2.out' }, 0);
              }

              // 2) Cell shake — amplitude scales with tier.
              const baseX = cellCont.x;
              const sh = 6 * _gs * factor;
              gsap.killTweensOf(cellCont, 'x');
              gsap.timeline({ onComplete: () => { cellCont.x = baseX; } })
                .to(cellCont, { x: baseX + sh,         duration: 0.05, ease: 'power2.out' })
                .to(cellCont, { x: baseX - sh,         duration: 0.07, ease: 'power2.inOut' })
                .to(cellCont, { x: baseX + sh * 0.65,  duration: 0.06, ease: 'power2.inOut' })
                .to(cellCont, { x: baseX - sh * 0.35,  duration: 0.06, ease: 'power2.inOut' })
                .to(cellCont, { x: baseX,              duration: 0.06, ease: 'power2.out' });

              // 2b) STAGE SHAKE — only for the big tiers. The whole
              // canvas wobbles, not just the cell. This is what makes
              // a 50× / 100× hit feel different from a 4× hit.
              if (big && typeof shakeStage === 'function') {
                shakeStage(huge ? 12 * _gs : 7 * _gs, huge ? 0.55 : 0.40);
              }

              // 3) Text bounces — overshoot scale ramps with the tier.
              oddsTxt.style.fill = 0x6FFFA0;
              oddsTxt.style.stroke = 0;
              oddsTxt.style.strokeThickness = 0;
              oddsTxt.style.fontWeight = '900';
              gsap.killTweensOf(oddsTxt.scale);
              const overshoot = 1.6 + factor * 0.25;     // 1.81 → 2.20
              const restScale = 1.10 + Math.min(0.20, factor * 0.05);
              gsap.fromTo(oddsTxt.scale,
                { x: overshoot, y: overshoot },
                { x: restScale, y: restScale, duration: 0.70, ease: 'elastic.out(1.6, 0.4)' });

              // 3b) Side indicator — small green up-chevron pinned
              // RIGHT NEXT TO the multiplier text so the two read as
              // a single composite glyph. Position is recomputed
              // dynamically against oddsTxt.width during the count-up
              // (text grows as the value counts up; chevron tracks it
              // so the gap stays constant).
              const aSize = L.cellSize * 0.06;
              const indPad = 4 * _gs;
              const positionIndicator = () => {
                const ind = scene.boostedArrows[f.ringPos] && scene.boostedArrows[f.ringPos]._indicator;
                if (!ind) return;
                // oddsTxt.width is the visible (scale-applied) text width.
                ind.x = -(oddsTxt.width / 2) - aSize - indPad;
              };
              if (!scene.boostedArrows[f.ringPos]._indicator) {
                const ind = new PIXI.Graphics();
                ind.lineStyle(1.2 * _gs, 0x065F46, 1);
                ind.beginFill(0x10B981, 1);
                ind.drawPolygon([
                  0,        -aSize,
                  aSize,     aSize * 0.55,
                  aSize * 0.35,  aSize * 0.55,
                  aSize * 0.35,  aSize,
                  -aSize * 0.35, aSize,
                  -aSize * 0.35, aSize * 0.55,
                  -aSize,    aSize * 0.55,
                ]);
                ind.endFill();
                ind.y = L.cellSize * 0.32;
                cellCont.addChild(ind);
                scene.boostedArrows[f.ringPos]._indicator = ind;
                gsap.fromTo(ind.scale,
                  { x: 0, y: 0 },
                  { x: 1, y: 1, duration: 0.45, ease: 'back.out(2.4)', delay: 0.10 });
              }

              // 4) Value count-up — keep .toFixed(1) so the displayed
              // text stays in 1.8x / 3.6x territory. Chevron x is
              // re-anchored against the text on every tick so the
              // [▲ 3.6x] composite stays tight as the value grows.
              const counter = { v: oldShown };
              gsap.killTweensOf(counter);
              positionIndicator();
              gsap.to(counter, {
                v: boosted, duration: 0.55, ease: 'power2.out',
                onUpdate: () => {
                  oddsTxt.text = counter.v.toFixed(1) + 'x';
                  positionIndicator();
                },
                onComplete: () => {
                  oddsTxt.text = boosted.toFixed(1) + 'x';
                  positionIndicator();
                },
              });

              // 5) The cell's spin-time dim is keyed on stake==0, but a
              // boost makes us care about this arrow even unstaked.
              // Re-run the visual refresher so the cell pops back to
              // full brightness even mid-spin.
              if (typeof refreshArrowBetVisuals === 'function') {
                refreshArrowBetVisuals();
              }
            }, null, 1.25);
            tl.to(badge,       { alpha: 0, duration: 0.30, ease: 'power2.in' },  1.30);
            tl.to(badge.scale, { x: 1.5, y: 1.5, duration: 0.30, ease: 'power2.out' }, 1.30);
          }));
        }
        await Promise.all(flights);
      }
      // Restore the original multiplier text on every boosted arrow,
      // and clean up any in-flight badges that didn't finish.
      _clearOfficerBoosts() {
        if (scene.boostedArrows) {
          for (const pos in scene.boostedArrows) {
            const snap = scene.boostedArrows[pos];
            const oddsTxt = scene.arrowOddsTexts && scene.arrowOddsTexts[pos];
            if (oddsTxt && snap) {
              oddsTxt.text = snap.text;
              if (snap.fill !== undefined)     oddsTxt.style.fill     = snap.fill;
              if (snap.fontSize !== undefined) oddsTxt.style.fontSize = snap.fontSize;
              // Strip the boosted decoration (stroke, weight bump, scale).
              oddsTxt.style.stroke = 0;
              oddsTxt.style.strokeThickness = 0;
              oddsTxt.style.fontWeight = '800';
              gsap.killTweensOf(oddsTxt.scale);
              oddsTxt.scale.set(1);
            }
            // Destroy the green chevron indicator if one was added.
            if (snap && snap._indicator) {
              try { snap._indicator.destroy({ children: true }); } catch (e) {}
            }
          }
        }
        scene.boostedArrows = {};
        if (scene.boostFliers) {
          for (const b of scene.boostFliers) {
            try { b.destroy({ children: true }); } catch (e) {}
          }
          scene.boostFliers = [];
        }
      }
      _spawnPayText(x, y, amount, big = false) {
        const t = new PIXI.Text(`+${fmtCash(amount)}`, {
          fontFamily: FONT,
          fontSize: (big ? 38 : 26) * L.gameScale,
          fill: big ? 0xFFD54F : 0x6FA8C2,
          fontWeight: 'bold',
        });
        t.anchor.set(0.5); t.x = x; t.y = y; t.alpha = 0;
        t.scale.set(0.5);
        scene.fxLayer.addChild(t);
        gsap.timeline({ onComplete: () => t.destroy() })
          .to(t,       { alpha: 1, duration: 0.18, ease: 'power2.out' }, 0)
          .to(t.scale, { x: 1, y: 1, duration: 0.32, ease: 'back.out(2.4)' }, 0)
          .to(t,       { y: y - 70 * L.gameScale, duration: 1.10, ease: 'power2.out' }, 0.18)
          .to(t,       { alpha: 0, duration: 0.30, ease: 'power2.in' }, 1.05);
      }
      // Cash scatter — small green dollar-BILL rectangles bursting
      // outward from the exit point in all directions and settling
      // close to where they land. Each particle stays near the spawn
      // position (short travel) so the burst doesn't drift visually
      // along with the upward-flying pay text.
      _spawnCashScatter(x, y, count = 8) {
        const layer = scene.fxLayer;
        if (!layer) return;
        const _gs = L.gameScale || 1;
        for (let i = 0; i < count; i++) {
          // Build the bill: rounded green rectangle with a subtle
          // darker border and a centred "$" so it reads as cash.
          const bill = new PIXI.Container();
          const bw = (15 + Math.random() * 6) * _gs;
          const bh = bw * 0.55;
          const billBg = new PIXI.Graphics();
          billBg.lineStyle(1 * _gs, 0x065F46, 1);
          billBg.beginFill(0x10B981, 1);
          billBg.drawRoundedRect(-bw / 2, -bh / 2, bw, bh, 1.6 * _gs);
          billBg.endFill();
          // Tiny inner highlight stripe — gives the bill some dimension.
          billBg.lineStyle(0.6 * _gs, 0x34D399, 0.8);
          billBg.drawRoundedRect(
            -bw / 2 + 1.5 * _gs, -bh / 2 + 1.5 * _gs,
            bw - 3 * _gs, bh - 3 * _gs, 1 * _gs
          );
          bill.addChild(billBg);
          const sym = new PIXI.Text('$', {
            fontFamily: FONT,
            fontSize: bh * 0.78,
            fill: 0xE8F5EC,
            fontWeight: '900',
          });
          sym.anchor.set(0.5);
          bill.addChild(sym);

          bill.x = x; bill.y = y;
          // Full 360° scatter — no upward bias.
          const angle = Math.random() * Math.PI * 2;
          const dist  = (28 + Math.random() * 55) * _gs;
          const tx = x + Math.cos(angle) * dist;
          const ty = y + Math.sin(angle) * dist;
          // Slight rotation so each bill tumbles to a unique resting
          // angle.
          const rot = (Math.random() - 0.5) * Math.PI * 0.6;
          const dur = 0.45 + Math.random() * 0.25;
          layer.addChild(bill);
          gsap.timeline({ onComplete: () => { try { bill.destroy({ children: true }); } catch (e) {} } })
            .to(bill, {
              x: tx, y: ty, rotation: rot,
              duration: dur, ease: 'power3.out',
            }, 0)
            .to(bill, {
              alpha: 0, duration: 0.35, ease: 'power2.in',
            }, dur * 0.55);
        }
      }
      // Total-clearance celebration — fires when every car on the grid
      // exits in a single round. Full-screen "CLEAR!" headline + the
      // bonus amount + a YAY! button + falling confetti / dollar bills.
      //
      // RETURNS a Promise that resolves when the player taps YAY!. The
      // caller awaits it before showing the regular end-of-round popup
      // so the two dialogs don't overlap.
      _celebrateClearance(bonusAmount) {
        return new Promise(resolve => this._celebrateClearanceInner(bonusAmount, resolve));
      }
      _celebrateClearanceInner(bonusAmount, onDismiss) {
        if (!scene.stage) { onDismiss(); return; }
        const _gs = L.gameScale || 1;
        const sw = L.sw, sh = L.sh;
        // Dedicated layer — appended last so it's the topmost child
        // of the stage. Children added to it stack in insertion order
        // (confetti/bills first, then headline/bonus on top).
        const fx = new PIXI.Container();
        scene.stage.addChild(fx);
        // Track the longest celebration duration so we can clean up
        // the layer after it's done.
        let maxDur = 0;

        // 1) CONFETTI — added first so headline/bonus sit on top of it.
        const confettiCount = 80;
        const confettiPalette = [0xFF6B35, 0xFFD23F, 0x10B981, 0xE63946, 0x3897F0, 0xE84A8A, 0x8E4FE3];
        for (let i = 0; i < confettiCount; i++) {
          const c = new PIXI.Graphics();
          const cw = (8 + Math.random() * 7) * _gs;
          const ch = (4 + Math.random() * 5) * _gs;
          const color = confettiPalette[Math.floor(Math.random() * confettiPalette.length)];
          c.beginFill(color, 1);
          c.drawRect(-cw / 2, -ch / 2, cw, ch);
          c.endFill();
          c.x = Math.random() * sw;
          c.y = -30 - Math.random() * 50;
          c.rotation = Math.random() * Math.PI * 2;
          fx.addChild(c);
          const startDelay = Math.random() * 0.6;
          const fallDur = 2.0 + Math.random() * 1.5;
          const drift   = (Math.random() - 0.5) * 200 * _gs;
          const spin    = (Math.random() - 0.5) * Math.PI * 6;
          maxDur = Math.max(maxDur, startDelay + fallDur);
          gsap.timeline()
            .to(c, {
              y: sh + 60, x: c.x + drift, rotation: c.rotation + spin,
              duration: fallDur, ease: 'power1.in',
            }, startDelay)
            .to(c, { alpha: 0, duration: 0.30 }, startDelay + fallDur - 0.10);
        }

        // 2) DOLLAR BILLS — bigger green rectangles with $ glyph.
        const billCount = 30;
        for (let i = 0; i < billCount; i++) {
          const bill = new PIXI.Container();
          const bw = (24 + Math.random() * 14) * _gs;
          const bh = bw * 0.55;
          const billBg = new PIXI.Graphics();
          billBg.lineStyle(1 * _gs, 0x065F46, 1);
          billBg.beginFill(0x10B981, 1);
          billBg.drawRoundedRect(-bw / 2, -bh / 2, bw, bh, 1.6 * _gs);
          billBg.endFill();
          billBg.lineStyle(0.6 * _gs, 0x34D399, 0.8);
          billBg.drawRoundedRect(-bw / 2 + 1.5 * _gs, -bh / 2 + 1.5 * _gs, bw - 3 * _gs, bh - 3 * _gs, 1 * _gs);
          bill.addChild(billBg);
          const sym = new PIXI.Text('$', {
            fontFamily: FONT, fontSize: bh * 0.78,
            fill: 0xE8F5EC, fontWeight: '900',
          });
          sym.anchor.set(0.5);
          bill.addChild(sym);
          bill.x = Math.random() * sw;
          bill.y = -50 - Math.random() * 80;
          bill.rotation = (Math.random() - 0.5) * 0.7;
          fx.addChild(bill);
          const startDelay = Math.random() * 0.7;
          const fallDur = 2.4 + Math.random() * 1.6;
          const drift   = (Math.random() - 0.5) * 220 * _gs;
          const spin    = (Math.random() - 0.5) * Math.PI * 4;
          maxDur = Math.max(maxDur, startDelay + fallDur);
          gsap.timeline()
            .to(bill, {
              y: sh + 80, x: bill.x + drift, rotation: bill.rotation + spin,
              duration: fallDur, ease: 'power1.in',
            }, startDelay)
            .to(bill, { alpha: 0, duration: 0.40 }, startDelay + fallDur - 0.20);
        }

        // 2.5) HALO — dark radial vignette behind the CLEAR!/bonus/
        // TAKE WIN cluster. Same gradient as the end-of-round WIN
        // popup, sized to cover the text cluster comfortably without
        // bleeding to the canvas edges. Goes ON TOP of falling
        // confetti/bills so the central text area dims them slightly
        // for legibility, but BEHIND the headline/bonus/button so the
        // text reads on top.
        const haloD = Math.max(560 * _gs, Math.min(sw, sh) * 0.85);
        const halo = makeRadialHalo(haloD);
        halo.x = sw / 2;
        halo.y = sh / 2 + 35 * _gs;   // midpoint between headline + TAKE WIN
        halo.alpha = 0;
        fx.addChild(halo);
        gsap.to(halo, { alpha: 1, duration: 0.30, ease: 'power2.out' }, 0);

        // 3) HEADLINE — big yellow "CLEAR!" — added AFTER confetti so
        // it renders on top of the falling pieces. Holds in place
        // (gentle infinite pulse) until YAY is pressed.
        const headline = new PIXI.Text('CLEAR!', {
          fontFamily: FONT, fontSize: 110 * _gs,
          fill: 0xFFD23F, fontWeight: '900',
          letterSpacing: 10,
        });
        headline.anchor.set(0.5);
        headline.x = sw / 2;
        headline.y = sh / 2 - 60 * _gs;
        headline.alpha = 0;
        headline.scale.set(0.4);
        fx.addChild(headline);
        gsap.timeline()
          .to(headline,       { alpha: 1, duration: 0.20, ease: 'power2.out' }, 0)
          .to(headline.scale, { x: 1, y: 1, duration: 0.45, ease: 'back.out(2.4)' }, 0);
        // Gentle indefinite pulse — killed when fx tears down on YAY.
        gsap.to(headline.scale, {
          x: 1.06, y: 1.06, duration: 0.55,
          yoyo: true, repeat: -1, ease: 'sine.inOut', delay: 0.55,
        });

        // 4) Bonus readout — only the cleanup bonus, NOT the round
        // total. Holds visible until dismissal.
        const bonusTxt = new PIXI.Text(`+ ${fmtCash(bonusAmount)}`, {
          fontFamily: FONT, fontSize: 56 * _gs,
          fill: 0xFFFFFF, fontWeight: '900',
          letterSpacing: 4,
        });
        bonusTxt.anchor.set(0.5);
        bonusTxt.x = sw / 2;
        bonusTxt.y = sh / 2 + 30 * _gs;
        bonusTxt.alpha = 0;
        bonusTxt.scale.set(0.6);
        fx.addChild(bonusTxt);
        gsap.timeline()
          .to(bonusTxt,       { alpha: 1, duration: 0.25, ease: 'power2.out' }, 0.30)
          .to(bonusTxt.scale, { x: 1, y: 1, duration: 0.40, ease: 'back.out(2)' }, 0.30);

        // 5) TAKE WIN button — emerald green pill, appears with a
        // small delay so the headline + bonus land first.
        const yayW = 240 * _gs, yayH = 64 * _gs;
        const yayBtn = new PIXI.Container();
        yayBtn.x = sw / 2;
        yayBtn.y = sh / 2 + 140 * _gs;
        yayBtn.alpha = 0;
        yayBtn.scale.set(0.6);
        const yayBg = new PIXI.Graphics();
        const drawYay = (hover = false) => {
          yayBg.clear();
          yayBg.lineStyle(2 * _gs, 0x065F46, 1);
          yayBg.beginFill(hover ? 0x34D399 : 0x10B981, 1);
          yayBg.drawRoundedRect(-yayW / 2, -yayH / 2, yayW, yayH, 16 * _gs);
          yayBg.endFill();
        };
        drawYay(false);
        yayBtn.addChild(yayBg);
        const yayLbl = new PIXI.Text('TAKE WIN', {
          fontFamily: FONT, fontSize: 24 * _gs,
          fill: 0xFFFFFF, fontWeight: '900', letterSpacing: 4,
        });
        yayLbl.anchor.set(0.5);
        yayBtn.addChild(yayLbl);
        yayBtn.eventMode = 'static';
        yayBtn.cursor = 'pointer';
        yayBtn.hitArea = new PIXI.Rectangle(-yayW / 2, -yayH / 2, yayW, yayH);
        yayBtn.on('pointerover', () => { drawYay(true);  gsap.to(yayBtn.scale, { x: 1.05, y: 1.05, duration: 0.12 }); });
        yayBtn.on('pointerout',  () => { drawYay(false); gsap.to(yayBtn.scale, { x: 1, y: 1, duration: 0.12 }); });
        let dismissed = false;
        const dismiss = () => {
          if (dismissed) return;
          dismissed = true;
          // Kill all in-flight tweens on the layer + its children so
          // pulses / falls don't fight the fade-out.
          try { gsap.killTweensOf(fx); } catch (e) {}
          if (fx.children) {
            for (const child of fx.children) {
              try { gsap.killTweensOf(child); } catch (e) {}
              if (child.scale) { try { gsap.killTweensOf(child.scale); } catch (e) {} }
            }
          }
          gsap.to(fx, {
            alpha: 0, duration: 0.30, ease: 'power2.in',
            onComplete: () => {
              try { fx.destroy({ children: true }); } catch (e) {}
              if (typeof onDismiss === 'function') onDismiss();
            },
          });
        };
        yayBtn.on('pointertap', dismiss);
        fx.addChild(yayBtn);
        gsap.fromTo(yayBtn,       { alpha: 0 }, { alpha: 1, duration: 0.35, delay: 1.0, ease: 'power2.out' });
        gsap.fromTo(yayBtn.scale, { x: 0.6, y: 0.6 }, { x: 1, y: 1, duration: 0.50, delay: 1.0, ease: 'back.out(2.4)' });

        // 6) Stage shake to punctuate the moment.
        if (typeof shakeStage === 'function') {
          shakeStage(10 * _gs, 0.55);
        }
        // (No setTimeout teardown — dismissal is gated on YAY.)
        void maxDur;
      }

      // Show + pay + pop a single cluster end-to-end. Returns a Promise
      // that resolves once the cluster's cells are fully cleared.
      async _showOneCluster(cl) {
        const highlights = [];
        for (const xy of cl.cells) {
          const sym = scene.symbols[xy.r][xy.c];
          if (sym) {
            gsap.killTweensOf(sym.scale);
            gsap.fromTo(sym.scale,
              { x: 1.00, y: 1.00 },
              { x: 1.10, y: 1.10, duration: 0.60, ease: 'elastic.out(1.4, 0.35)' });
          }
          const cellCtr = scene.cells[xy.r] && scene.cells[xy.r][xy.c];
          if (cellCtr) {
            const hl = new PIXI.Graphics();
            hl.beginFill(0xC9A24A, 0.92);
            hl.drawRoundedRect(
              -L.cellSize * 0.46, -L.cellSize * 0.46,
              L.cellSize * 0.92,  L.cellSize * 0.92, 8 * L.gameScale
            );
            hl.endFill();
            hl.alpha = 0;
            cellCtr.addChildAt(hl, 0);
            highlights.push(hl);
            gsap.to(hl, { alpha: 1, duration: 0.18, ease: 'power2.out' });
          }
        }
        await this._wait(420);
        let cx = 0, cy = 0;
        for (const xy of cl.cells) {
          const p = slotCellCenter(xy.r, xy.c);
          cx += p.x; cy += p.y;
        }
        cx /= cl.cells.length; cy /= cl.cells.length;
        const amount = cl.pay * player.bet;
        this._spawnPayText(cx, cy, amount, amount >= 5 * player.bet);
        this._addToRunningWin(amount);
        await this._wait(280);
        const popPromises = [];
        for (const xy of cl.cells) {
          const sym = scene.symbols[xy.r][xy.c];
          if (!sym) continue;
          popPromises.push(new Promise(res => {
            gsap.timeline({ onComplete: res })
              .to(sym.scale, { x: 1.4, y: 1.4, duration: 0.16, ease: 'back.out(2)' })
              .to(sym,       { alpha: 0,        duration: 0.22, ease: 'power2.in' }, '<0.04')
              .to(sym.scale, { x: 0.2, y: 0.2, duration: 0.22, ease: 'power2.in' }, '<');
          }));
        }
        await Promise.all(popPromises);
        for (const hl of highlights) {
          gsap.killTweensOf(hl);
          if (hl.parent) hl.parent.removeChild(hl);
          hl.destroy();
        }
        for (const xy of cl.cells) {
          this._setSlotSymbol(xy.r, xy.c, null);
        }
      }

      async _playClusters(ev, opts = {}) {
        // When wilds are involved (engine-tagged cluster cells with
        // wild=true, or caller flagged it), sequence the cluster shows.
        // Order: closest cluster to wild anchor first — that's the
        // cluster the wild was activated by — and continue outward.
        // Without wilds, all clusters bloom in parallel (the old path
        // reads fine for small all-coloured clusters).
        const wildsInvolved = !!opts.wildsInvolved
          || ev.clusters.some(cl => cl.cells.some(xy => xy.wild));

        if (wildsInvolved) {
          // Engine emits clusters in pop order with unique cells (each
          // wild belongs to exactly one cluster — re-detected after each
          // pop). Just play them in the order received, sequenced.
          for (let i = 0; i < ev.clusters.length; i++) {
            await this._showOneCluster(ev.clusters[i]);
            if (i < ev.clusters.length - 1) await this._wait(180);
          }
          return;
        }

        // ── Parallel path (no wilds): all clusters bloom together ────────
        const highlights = [];
        for (const cl of ev.clusters) {
          for (const xy of cl.cells) {
            const sym = scene.symbols[xy.r][xy.c];
            if (sym) {
              gsap.killTweensOf(sym.scale);
              gsap.fromTo(sym.scale,
                { x: 1.00, y: 1.00 },
                { x: 1.10, y: 1.10, duration: 0.60, ease: 'elastic.out(1.4, 0.35)' });
            }
            const cellCtr = scene.cells[xy.r] && scene.cells[xy.r][xy.c];
            if (cellCtr) {
              const hl = new PIXI.Graphics();
              hl.beginFill(0xC9A24A, 0.92);
              hl.drawRoundedRect(
                -L.cellSize * 0.46, -L.cellSize * 0.46,
                L.cellSize * 0.92,  L.cellSize * 0.92, 8 * L.gameScale
              );
              hl.endFill();
              hl.alpha = 0;
              cellCtr.addChildAt(hl, 0);
              highlights.push(hl);
              gsap.to(hl, { alpha: 1, duration: 0.18, ease: 'power2.out' });
            }
          }
        }
        await this._wait(420);
        for (const cl of ev.clusters) {
          let cx = 0, cy = 0;
          for (const xy of cl.cells) {
            const p = slotCellCenter(xy.r, xy.c);
            cx += p.x; cy += p.y;
          }
          cx /= cl.cells.length; cy /= cl.cells.length;
          const amount = cl.pay * player.bet;
          this._spawnPayText(cx, cy, amount, amount >= 5 * player.bet);
          this._addToRunningWin(amount);
        }
        await this._wait(280);
        const popPromises = [];
        for (const cl of ev.clusters) {
          for (const xy of cl.cells) {
            const sym = scene.symbols[xy.r][xy.c];
            if (!sym) continue;
            popPromises.push(new Promise(res => {
              gsap.timeline({ onComplete: res })
                .to(sym.scale, { x: 1.4, y: 1.4, duration: 0.16, ease: 'back.out(2)' })
                .to(sym,       { alpha: 0,        duration: 0.22, ease: 'power2.in' }, '<0.04')
                .to(sym.scale, { x: 0.2, y: 0.2, duration: 0.22, ease: 'power2.in' }, '<');
            }));
          }
        }
        await Promise.all(popPromises);
        for (const hl of highlights) {
          gsap.killTweensOf(hl);
          if (hl.parent) hl.parent.removeChild(hl);
          hl.destroy();
        }
        for (const cl of ev.clusters) {
          for (const xy of cl.cells) {
            this._setSlotSymbol(xy.r, xy.c, null);
          }
        }
      }

      // Per-token activation feedback. Each fired type gets its own beat:
      //   wild       — silent flash, no payout text (the wild line is the
      //                payout, applied to the grid).
      //   multiplier — character travels through the source cluster + any
      //                connected clusters (sharing H/V border), planting a
      //                stamp at every cell visited.
      //   freespins  — green burst + "+3 FREE SPINS" banner.
      //   jackpot    — big tier label + cash payout text.
      async _animateIntercepts(intercepts, clusterEvent) {
        if (!intercepts || intercepts.length === 0) return;
        // Activation order: Jackpot/FreeSpins → Multiplier → Wild.
        // SEQUENTIAL — each intercept fully animates before the next
        // (across phases AND within a phase). Wild fires LAST so the
        // grid wilds are visible before cluster show; multiplier
        // charges before clusters pay base.
        const runOne = async (ic) => {
          const fired = ic.fired || {};
          const sprite = scene.ringTokens[ic.ringPos];
          if (!sprite) return;
          scene.ringTokens[ic.ringPos] = null;
          const ringCtr = ringCellCenter(ic.ringPos);

          // Activator-source intercept: kick off the BIG activator burst
          // + sprite pop in PARALLEL with the token activation, since
          // both are visually part of the same activation moment.
          let activatorPopPromise = null;
          if (ic.viaActivator && ic.clusterCellRC) {
            const ar = ic.clusterCellRC.r, ac = ic.clusterCellRC.c;
            const aSym = scene.symbols[ar] && scene.symbols[ar][ac];
            if (aSym) {
              const ctr = slotCellCenter(ar, ac);
              this._activatorActivateBurst(ctr);
              activatorPopPromise = new Promise(res => {
                gsap.timeline({ onComplete: () => {
                  this._setSlotSymbol(ar, ac, null);
                  res();
                } })
                  .to(aSym.scale, { x: 1.85, y: 1.85, duration: 0.20, ease: 'back.out(2.8)' }, 0)
                  .to(aSym,       { rotation: Math.PI * 1.5, duration: 0.50, ease: 'power2.out' }, 0)
                  .to(aSym,       { alpha: 0, duration: 0.30, ease: 'power2.in' }, 0.30)
                  .to(aSym.scale, { x: 0.20, y: 0.20, duration: 0.30, ease: 'power2.in' }, 0.30);
              });
            }
          }

          await Promise.all([
            this._activateToken(sprite, ringCtr, fired, clusterEvent),
            activatorPopPromise,
          ].filter(Boolean));
        };

        const phaseRun = async (filter) => {
          for (const ic of intercepts) {
            const fired = ic.fired || {};
            if (!filter(fired)) continue;
            await runOne(ic);
          }
        };
        await phaseRun(f => f.type === 'jackpot' || f.type === 'freespins');
        await phaseRun(f => f.type === 'multiplier');
        await phaseRun(f => f.type === 'wild');
      }

      async _activateToken(sprite, ctr, fired, clusterEvent) {
        const gs = L.gameScale;
        // Gold outline ring at the original ring position — pulses out
        // and fades. Always plays, regardless of token type, as a "you
        // intercepted this" signal.
        const ringR = L.cellSize * 0.40;
        const goldRing = new PIXI.Graphics();
        goldRing.lineStyle(4 * gs, 0xFFD54F, 1);
        goldRing.drawCircle(0, 0, ringR);
        goldRing.x = ctr.x; goldRing.y = ctr.y;
        goldRing.alpha = 0;
        scene.fxLayer.addChild(goldRing);
        gsap.timeline()
          .to(goldRing,       { alpha: 1, duration: 0.16, ease: 'power2.out' }, 0)
          .to(goldRing.scale, { x: 1.35, y: 1.35, duration: 0.50, ease: 'power2.out' }, 0)
          .to(goldRing,       { alpha: 0, duration: 0.30, ease: 'power2.in' }, 0.30)
          .call(() => goldRing.destroy());

        // Wild + multiplier: the actual TOKEN sprite walks the grid and
        // does the stamping itself — no second chip is created. The
        // traversal handles its own intro pop, walk, and outro fade on
        // the sprite, then destroys it.
        if (fired.type === 'wild') {
          // Move sprite to the fx layer so it renders above slot cells.
          if (sprite.parent) sprite.parent.removeChild(sprite);
          scene.fxLayer.addChild(sprite);
          await this._animateWildTraversal(sprite, ctr, fired);
          return;
        }
        if (fired.type === 'multiplier') {
          if (sprite.parent) sprite.parent.removeChild(sprite);
          scene.fxLayer.addChild(sprite);
          await this._animateMultiplierTraversal(sprite, ctr, fired, clusterEvent);
          return;
        }

        // Other types (freespins / jackpot): existing flow — sprite
        // pops at the ring, type-specific FX play in the air around it,
        // then sprite fades.
        const popPromise = new Promise(res => {
          gsap.timeline({ onComplete: res })
            .to(sprite.scale, { x: 1.55, y: 1.55, duration: 0.18, ease: 'back.out(2.6)' })
            .to(sprite.scale, { x: 1.10, y: 1.10, duration: 0.10, ease: 'sine.inOut' });
        });
        const fxPromise = this._tokenActivationFx(ctr, fired, clusterEvent);
        await Promise.all([popPromise, fxPromise]);

        await new Promise(res => {
          gsap.timeline({ onComplete: () => { sprite.destroy({ children: true }); res(); } })
            .to(sprite,       { alpha: 0, duration: 0.22, ease: 'power2.in' }, 0)
            .to(sprite.scale, { x: 0.3, y: 0.3, duration: 0.26, ease: 'power2.in' }, 0);
        });
      }

      _tokenActivationFx(ctr, fired, clusterEvent) {
        const gs = L.gameScale;
        const type = fired.type;

        // Outer ring pulse (used by multiplier + freespins + jackpot).
        const ringPulse = (color) => {
          const ring = new PIXI.Graphics();
          ring.lineStyle(4 * gs, color, 1);
          ring.drawCircle(0, 0, L.cellSize * 0.40);
          ring.x = ctr.x; ring.y = ctr.y; ring.alpha = 0.9;
          scene.fxLayer.addChild(ring);
          return new Promise(res => {
            gsap.timeline({ onComplete: () => { ring.destroy(); res(); } })
              .to(ring.scale, { x: 2.4, y: 2.4, duration: 0.55, ease: 'power2.out' }, 0)
              .to(ring,       { alpha: 0,        duration: 0.55, ease: 'power2.out' }, 0);
          });
        };

        // Note: wild + multiplier types are handled directly in
        // _activateToken (the actual TOKEN sprite walks and stamps —
        // no second chip is created here).

        if (type === 'freespins') {
          const amt = fired.amount || 3;
          this._showFeatureBanner(`+${amt} FREE SPINS`, 0xA8E060);
          return ringPulse(0xA8E060);
        }

        if (type === 'jackpot') {
          const tier = fired.tier || 'tiny';
          const tierTxt = tier.toUpperCase();
          const tierColors = { tiny: 0xC8AA88, mini: 0xD4A04A, major: 0xC04848, grand: 0xA88AC0 };
          const color = tierColors[tier] || 0xFFD54F;
          // Tier nameplate floats up, then the cash payout flies up.
          const label = new PIXI.Text(tierTxt, {
            fontFamily: FONT, fontSize: 44 * gs,
            fill: color,
            fontWeight: 'bold',
          });
          label.anchor.set(0.5);
          label.x = ctr.x; label.y = ctr.y;
          label.alpha = 0; label.scale.set(0.4);
          scene.fxLayer.addChild(label);
          const labelFly = new Promise(res => {
            gsap.timeline({ onComplete: () => { label.destroy(); res(); } })
              .to(label,       { alpha: 1, duration: 0.18, ease: 'power2.out' }, 0)
              .to(label.scale, { x: 1, y: 1, duration: 0.36, ease: 'back.out(2.4)' }, 0)
              .to(label,       { y: ctr.y - 70 * gs, duration: 1.10, ease: 'power2.out' }, 0.18)
              .to(label,       { alpha: 0, duration: 0.30, ease: 'power2.in' }, 1.10);
          });
          // Locked-at-spawn payout: jackpot pays JACKPOT_PAYS[tier] ×
          // spawnBet (the bet at the moment the token entered the
          // conveyor), regardless of player.bet at intercept time.
          const amount = (typeof fired.payAmount === 'number')
            ? fired.payAmount
            : (fired.payBet || 0) * player.bet;   // fallback for stale events
          this._spawnPayText(ctr.x, ctr.y + 30 * gs, amount, true);
          this._addToRunningWin(amount);
          // Sparkle stream from token → win pill so the player sees the
          // money fly to the HUD. Bigger tiers get more particles + shake.
          const winPill = scene.winPill;
          if (winPill) {
            const tierCount = { tiny: 14, mini: 18, major: 26, grand: 34 };
            spawnSparkleStream(
              scene.fxLayer, ctr.x, ctr.y, winPill.x, winPill.y,
              tierCount[tier] || 18
            );
          }
          // Tier-scaled screen shake. Grand is loud; tiny is a tiny nudge.
          const tierShake = { tiny: 4, mini: 6, major: 10, grand: 14 };
          shakeStage((tierShake[tier] || 6) * gs, 0.50);
          return Promise.all([ringPulse(color), labelFly]);
        }

        // Fallback — no FX
        return Promise.resolve();
      }

      // Multiplier traversal — the actual token sprite walks the source
      // cluster cell-by-cell, planting a stamp at each unstamped cell.
      // Movement is 8-direction snake-style (orthogonal preferred,
      // diagonal only when forced). Cluster scope is the cluster
      // containing the multiplier's sourceCell — multipliers no longer
      // spread to "connected" clusters via wild bridges (since each
      // wild now belongs to exactly one cluster).
      async _animateMultiplierTraversal(sprite, ringCtr, fired, clusterEvent) {
        const gs = L.gameScale;
        const value = fired.value || 1;
        const sourceCell = fired.sourceCell;
        if (!sourceCell || !clusterEvent || !clusterEvent.clusters) {
          // Nothing to walk — fade the sprite in place.
          await new Promise(res => {
            gsap.timeline({ onComplete: () => { sprite.destroy({ children: true }); res(); } })
              .to(sprite,       { alpha: 0, duration: 0.22, ease: 'power2.in' }, 0)
              .to(sprite.scale, { x: 0.3, y: 0.3, duration: 0.26, ease: 'power2.in' }, 0);
          });
          return;
        }
        const cellKey = (r, c) => `${r},${c}`;

        // ── Source cluster only ───────────────────────────────────────────
        // Each multiplier belongs to exactly one cluster (the one whose
        // cells include the multiplier's sourceCell). No connected-
        // component spread anymore.
        // In Activator mode the source cell is the activator's grid
        // position (not in any cluster) — engine applies the multiplier
        // cascade-wide. Animation: a "×N" badge spawns at the activator
        // position, then duplicates and FLIES to every paying cluster's
        // centroid before fading. Tells the story "this multiplier hits
        // every cluster on the board".
        const srcCluster = clusterEvent.clusters.find(cl =>
          cl.cells.some(xy => xy.r === sourceCell.r && xy.c === sourceCell.c));
        if (!srcCluster) {
          // Activator-mode multiplier: source cell isn't in any cluster.
          // Pop the token at the conveyor, fly a "×N" badge from the
          // activator cell to the screen-center charge slot. The
          // charged total displays/accumulates there until end of spin
          // (multiplierApply event slams it onto the win pill).
          const popPromise = new Promise(res => {
            gsap.timeline({ onComplete: () => { sprite.destroy({ children: true }); res(); } })
              .to(sprite.scale, { x: 1.55, y: 1.55, duration: 0.16, ease: 'back.out(2.4)' }, 0)
              .to(sprite,       { alpha: 0,         duration: 0.26, ease: 'power2.in' }, 0.16)
              .to(sprite.scale, { x: 0.5, y: 0.5, duration: 0.26, ease: 'power2.in' }, 0.16);
          });
          // Badge lives on the conveyor — at the ring slot of the
          // FIRST activator that fires this spin. Subsequent activators
          // fly mini-badges to that same ring slot.
          const chargePromise = this._addToMultiplierCharge(value, ringCtr);
          await Promise.all([popPromise, chargePromise]);
          return;
        }
        const compClusters = [srcCluster];

        // ── Build the to-visit + to-bump sets ────────────────────────────
        // For every cluster cell in the component (deduplicated, wilds
        // excluded), classify it as:
        //   visit — no existing stamp; chip walks here and slams a fresh
        //           stamp.
        //   bump  — has an existing stamp whose value is LOWER than the
        //           new appliedMult; chip never enters this cell, but the
        //           visual stamp must be silently upgraded so it matches
        //           the engine's pay calculation (engine uses
        //           Math.max(oldStamp, newMult)).
        //   skip  — has an existing stamp ≥ new value; nothing to do.
        const stampValueAt = new Map();
        const candidates = [];
        const bumps = [];
        const seen = new Set();
        const stampValAt = (r, c) => {
          const s = scene.stamps && scene.stamps[r] && scene.stamps[r][c];
          return (s && s._stampValue) || 0;
        };
        for (const cl of compClusters) {
          const sv = cl.appliedMult || value;
          for (const xy of cl.cells) {
            const k = cellKey(xy.r, xy.c);
            if (seen.has(k)) continue;
            seen.add(k);
            // Engine-supplied wild flag — reliable even before wild
            // visuals are painted (wild fires AFTER multiplier).
            if (xy.wild) continue;                        // wilds: no stamp
            const existing = stampValAt(xy.r, xy.c);
            if (existing === 0) {
              candidates.push({ r: xy.r, c: xy.c });
              stampValueAt.set(k, sv);
            } else if (sv > existing) {
              bumps.push({ r: xy.r, c: xy.c, value: sv });
            }
            // else: existing >= new, leave alone
          }
        }

        // Apply bumps immediately — _setStamp re-creates the tint/text/
        // badge with its own fade-in/scale animation, so the upgrade is
        // visible without the chip needing to land on the cell.
        for (const b of bumps) this._setStamp(b.r, b.c, b.value);

        // The traveling "chip" IS the original token sprite. Quick pop
        // at the ring position so the activation reads, then walk.
        const chip = sprite;
        await new Promise(res => {
          gsap.timeline({ onComplete: res })
            .to(chip.scale, { x: 1.30, y: 1.30, duration: 0.16, ease: 'back.out(2.6)' })
            .to(chip.scale, { x: 1.00, y: 1.00, duration: 0.10, ease: 'sine.inOut' });
        });

        const HOP_DURATION     = 0.14;
        const SLAM_DURATION    = 0.08;
        const PAUSE_AFTER      = 30;
        const TRANSIT_DURATION = 0.22;   // hop between sub-components

        // Nothing to stamp — fade the token in place.
        if (candidates.length === 0) {
          await new Promise(res => {
            gsap.timeline({ onComplete: () => { chip.destroy({ children: true }); res(); } })
              .to(chip,       { alpha: 0, duration: 0.22, ease: 'power2.in' }, 0)
              .to(chip.scale, { x: 0.5, y: 0.5, duration: 0.22, ease: 'power2.in' }, 0);
          });
          return;
        }

        // ── 8-connected sub-components of the to-visit set ───────────────
        const cellSet = new Set(candidates.map(xy => cellKey(xy.r, xy.c)));
        const neighbours8 = (r, c) => {
          const out = [];
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              if (dr === 0 && dc === 0) continue;
              const nr = r + dr, nc = c + dc;
              if (cellSet.has(cellKey(nr, nc))) out.push({ r: nr, c: nc });
            }
          }
          return out;
        };
        const compOf = new Map();
        const groups = [];
        for (const cell of candidates) {
          const k = cellKey(cell.r, cell.c);
          if (compOf.has(k)) continue;
          const g = [];
          const queue = [cell];
          compOf.set(k, groups.length);
          while (queue.length) {
            const cur = queue.shift();
            g.push(cur);
            for (const n of neighbours8(cur.r, cur.c)) {
              const nk = cellKey(n.r, n.c);
              if (!compOf.has(nk)) {
                compOf.set(nk, groups.length);
                queue.push(n);
              }
            }
          }
          groups.push(g);
        }

        // ── Hamiltonian path within a group ──────────────────────────────
        // Snake-style: at each step the chip prefers ORTHOGONAL moves
        // (up/down/left/right). Diagonal moves are only attempted when no
        // orthogonal move is possible. We do this in two passes:
        //   1. Try a PURE-ORTHOGONAL Hamiltonian path. Cluster cells
        //      start 4-connected, so an ortho-only path usually exists
        //      unless prior stamps have split the unstamped subset such
        //      that bridging requires a diagonal hop.
        //   2. If pure-ortho fails, run an ortho-first 8-direction Ham
        //      path (still tries ortho first at every step; falls back
        //      to diag only when forced).
        // All path computation runs up-front; the chip doesn't move
        // until the full ordered list of cells (and inter-group transit
        // hops) is decided.
        const dist2 = (a, b) => (a.r - b.r) ** 2 + (a.c - b.c) ** 2;
        const ORTHO = [[-1, 0], [1, 0], [0, -1], [0, 1]];
        const DIAG  = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
        const hamSearch = (group, start, allowDiagonal) => {
          const groupSet = new Set(group.map(c => cellKey(c.r, c.c)));
          const path = [start];
          const visited = new Set([cellKey(start.r, start.c)]);
          const goal = group.length;
          const tryStep = (offsets, cur) => {
            for (const [dr, dc] of offsets) {
              const nr = cur.r + dr, nc = cur.c + dc;
              const k = cellKey(nr, nc);
              if (groupSet.has(k) && !visited.has(k)) {
                visited.add(k);
                path.push({ r: nr, c: nc });
                if (bt()) return true;
                path.pop();
                visited.delete(k);
              }
            }
            return false;
          };
          const bt = () => {
            if (path.length === goal) return true;
            const cur = path[path.length - 1];
            // Ortho first — produces snake-like motion.
            if (tryStep(ORTHO, cur)) return true;
            // Diagonals only when nothing orthogonal works.
            if (allowDiagonal && tryStep(DIAG, cur)) return true;
            return false;
          };
          return bt() ? path : null;
        };
        const buildGroupPath = (group, refPos) => {
          // Try start cells in order of distance to refPos. For each
          // start, attempt pure-ortho first, then ortho-first 8-dir.
          const sorted = group.slice().sort((a, b) => dist2(a, refPos) - dist2(b, refPos));
          for (const start of sorted) {
            const p = hamSearch(group, start, false);
            if (p) return p;
          }
          for (const start of sorted) {
            const p = hamSearch(group, start, true);
            if (p) return p;
          }
          // Last-ditch fallback: greedy nearest-unvisited from closest
          // start. Only reachable for pathological group shapes; never
          // observed in normal play.
          const start = sorted[0];
          const visited = new Set([cellKey(start.r, start.c)]);
          const path = [start];
          while (path.length < group.length) {
            const cur = path[path.length - 1];
            let bestIdx = -1, bestDist = Infinity;
            for (let i = 0; i < group.length; i++) {
              const k = cellKey(group[i].r, group[i].c);
              if (visited.has(k)) continue;
              const d = dist2(cur, group[i]);
              if (d < bestDist) { bestDist = d; bestIdx = i; }
            }
            if (bestIdx < 0) break;
            visited.add(cellKey(group[bestIdx].r, group[bestIdx].c));
            path.push(group[bestIdx]);
          }
          return path;
        };

        // ── Order groups + assemble the full pre-computed walk path ──────
        // Each group's start is closest to the chip's current pos; first
        // group uses the source cell as the reference. Inter-group hops
        // are tagged `transit:true` so the animator skips the slam beat.
        let chipPos = { r: sourceCell.r, c: sourceCell.c };
        // Order groups: closest cell to source goes first; subsequent
        // groups are picked greedily from the chip's current position.
        const remainingGroups = groups.slice();
        const orderedGroupPaths = [];
        let refPos = { r: sourceCell.r, c: sourceCell.c };
        while (remainingGroups.length > 0) {
          // Pick the group whose nearest cell to refPos is closest.
          let bestGi = 0, bestD = Infinity;
          for (let gi = 0; gi < remainingGroups.length; gi++) {
            for (const cell of remainingGroups[gi]) {
              const d = dist2(cell, refPos);
              if (d < bestD) { bestD = d; bestGi = gi; }
            }
          }
          const group = remainingGroups.splice(bestGi, 1)[0];
          const path = buildGroupPath(group, refPos);
          orderedGroupPaths.push(path);
          refPos = path[path.length - 1];
        }
        const fullPath = [];
        for (let gi = 0; gi < orderedGroupPaths.length; gi++) {
          const path = orderedGroupPaths[gi];
          for (let i = 0; i < path.length; i++) {
            fullPath.push({
              r: path[i].r, c: path[i].c,
              transit: gi > 0 && i === 0,
            });
          }
        }

        // ── Walk + stamp ─────────────────────────────────────────────────
        for (const cell of fullPath) {
          const target = slotCellCenter(cell.r, cell.c);
          const dur = cell.transit ? TRANSIT_DURATION : HOP_DURATION;
          await new Promise(res => {
            gsap.to(chip, {
              x: target.x, y: target.y,
              duration: dur, ease: 'power2.inOut',
              onComplete: res,
            });
          });
          const sv = stampValueAt.get(cellKey(cell.r, cell.c)) || value;
          this._setStamp(cell.r, cell.c, sv);
          await new Promise(res => {
            gsap.timeline({ onComplete: res })
              .to(chip.scale, { x: 1.30, y: 0.75, duration: SLAM_DURATION, ease: 'power2.out' }, 0)
              .to(chip.scale, { x: 1.00, y: 1.00, duration: SLAM_DURATION, ease: 'back.out(2.4)' }, SLAM_DURATION);
          });
          await this._wait(PAUSE_AFTER);
        }

        // Done — chip fades out at the last cell.
        await new Promise(res => {
          gsap.timeline({ onComplete: () => { chip.destroy({ children: true }); res(); } })
            .to(chip,       { alpha: 0, duration: 0.22, ease: 'power2.in' }, 0)
            .to(chip.scale, { x: 0.5, y: 0.5, duration: 0.22, ease: 'power2.in' }, 0);
        });
      }

      // Wild traversal — chip flies from the ring position to each
      // engine-chosen cell in nearest-neighbour order, slamming a wild
      // down at each. Cells can be anywhere on the grid (the wild now
      // scatters 4-5 random positions, not a row/column).
      async _animateWildTraversal(sprite, ringCtr, fired) {
        const gs = L.gameScale;
        const chosenCells = fired.chosenCells || [];
        if (chosenCells.length === 0) {
          await new Promise(res => {
            gsap.timeline({ onComplete: () => { sprite.destroy({ children: true }); res(); } })
              .to(sprite,       { alpha: 0, duration: 0.22, ease: 'power2.in' }, 0)
              .to(sprite.scale, { x: 0.3, y: 0.3, duration: 0.26, ease: 'power2.in' }, 0);
          });
          return;
        }

        // The traveling "chip" IS the original token sprite. Quick pop
        // at the ring position so the activation reads, then walk.
        const chip = sprite;
        await new Promise(res => {
          gsap.timeline({ onComplete: res })
            .to(chip.scale, { x: 1.30, y: 1.30, duration: 0.16, ease: 'back.out(2.6)' })
            .to(chip.scale, { x: 1.00, y: 1.00, duration: 0.10, ease: 'sine.inOut' });
        });

        // Order the chosen cells by nearest-neighbour from the chip's
        // current position. Keeps the chip's flight path short and
        // readable across a scattered set of targets.
        const ordered = [];
        const remaining = chosenCells.slice();
        let curX = ringCtr.x, curY = ringCtr.y;
        while (remaining.length > 0) {
          let bestIdx = 0, bestDist = Infinity;
          for (let i = 0; i < remaining.length; i++) {
            const c = slotCellCenter(remaining[i].r, remaining[i].c);
            const dx = c.x - curX, dy = c.y - curY;
            const d = dx * dx + dy * dy;
            if (d < bestDist) { bestDist = d; bestIdx = i; }
          }
          const next = remaining.splice(bestIdx, 1)[0];
          ordered.push(next);
          const nc = slotCellCenter(next.r, next.c);
          curX = nc.x; curY = nc.y;
        }

        const HOP_DURATION    = 0.18;
        const SLAM_DURATION   = 0.08;
        const PAUSE_AFTER     = 40;
        for (const cell of ordered) {
          const target = slotCellCenter(cell.r, cell.c);
          await new Promise(res => {
            gsap.to(chip, {
              x: target.x, y: target.y,
              duration: HOP_DURATION, ease: 'power2.inOut',
              onComplete: res,
            });
          });
          const old = scene.symbols[cell.r][cell.c];
          if (old && !old.symbolWild) {
            const color = old.symbolColor;
            // Make the disappearance of the underlying symbol explicit:
            // pop it down to nothing BEFORE we swap in the wild, so the
            // player reads "the symbol is gone, the wild owns this cell now."
            // Lift the sprite out of the cell container into fxLayer so it
            // can fade independently of the new wild that's about to land.
            const popPos = slotCellCenter(cell.r, cell.c);
            const cellCont = scene.cells[cell.r][cell.c];
            this._killSpriteTweens(old);
            cellCont.removeChild(old);
            scene.symbols[cell.r][cell.c] = null;
            old.x = popPos.x; old.y = popPos.y;
            scene.fxLayer.addChild(old);
            gsap.timeline({ onComplete: () => { try { old.destroy({ children: true }); } catch (e) {} } })
              .to(old.scale, { x: 0.0, y: 0.0, duration: 0.20, ease: 'power2.in' }, 0)
              .to(old,       { alpha: 0,     duration: 0.20, ease: 'power2.in' }, 0);
            // Land the wild on the now-empty cell.
            this._setSlotSymbol(cell.r, cell.c, { color, wild: true });
            const sym = scene.symbols[cell.r][cell.c];
            if (sym) {
              gsap.fromTo(sym.scale,
                { x: 0.6, y: 0.6 },
                { x: 1, y: 1, duration: 0.28, ease: 'back.out(2.4)' });
            }
          }
          await new Promise(res => {
            gsap.timeline({ onComplete: res })
              .to(chip.scale, { x: 1.30, y: 0.75, duration: SLAM_DURATION, ease: 'power2.out' }, 0)
              .to(chip.scale, { x: 1.00, y: 1.00, duration: SLAM_DURATION, ease: 'back.out(2.4)' }, SLAM_DURATION);
          });
          await this._wait(PAUSE_AFTER);
        }
        // Chip fades out at the last cell.
        await new Promise(res => {
          gsap.timeline({ onComplete: () => { chip.destroy({ children: true }); res(); } })
            .to(chip,       { alpha: 0, duration: 0.22, ease: 'power2.in' }, 0)
            .to(chip.scale, { x: 0.5, y: 0.5, duration: 0.22, ease: 'power2.in' }, 0);
        });
      }

      _showFeatureBanner(text, accentHex) {
        const gs = L.gameScale;
        const banner = new PIXI.Container();
        const bg = new PIXI.Graphics();
        const padX = 28 * gs, padY = 14 * gs;
        const tt = new PIXI.Text(text, {
          fontFamily: FONT, fontSize: 32 * gs,
          fill: 0xFFECB3,
          fontWeight: 'bold', letterSpacing: 1.5,
        });
        tt.anchor.set(0.5);
        const w = tt.width + padX * 2;
        const h = tt.height + padY * 2;
        bg.lineStyle(3 * gs, accentHex, 1);
        bg.beginFill(0x2A1808, 0.92);
        bg.drawRoundedRect(-w / 2, -h / 2, w, h, h * 0.34);
        bg.endFill();
        banner.addChild(bg);
        banner.addChild(tt);
        banner.x = L.sw / 2;
        banner.y = L.frameY + L.frameH / 2;
        banner.alpha = 0;
        banner.scale.set(0.7);
        scene.fxLayer.addChild(banner);
        gsap.timeline({ onComplete: () => banner.destroy({ children: true }) })
          .to(banner,       { alpha: 1, duration: 0.20, ease: 'power2.out' }, 0)
          .to(banner.scale, { x: 1, y: 1, duration: 0.36, ease: 'back.out(2.2)' }, 0)
          .to(banner,       { y: banner.y - 30 * gs, duration: 0.90, ease: 'sine.out' }, 0.20)
          .to(banner,       { alpha: 0, duration: 0.40, ease: 'power2.in' }, 1.00);
      }

      _applyStickyWilds(stickyWilds) {
        for (const sw of stickyWilds || []) {
          const old = scene.symbols[sw.r][sw.c];
          if (old) {
            const c = old.symbolColor;
            this._setSlotSymbol(sw.r, sw.c, { color: c, wild: true });
          }
        }
      }

      async _playRefill(ev) {
        this._applyStickyWilds(ev.stickyWilds);
        const moveTweens = [];
        for (const m of ev.moves) {
          const sym = scene.symbols[m.from.r][m.from.c];
          if (!sym) continue;
          // Symbols MOVE with gravity. Stamps DON'T — they're positional
          // (per spec: stay on the grid for the duration of the spin).
          // A new symbol falling into a stamped cell visually inherits
          // the existing stamp at that position.
          scene.symbols[m.from.r][m.from.c] = null;
          scene.symbols[m.to.r][m.to.c]     = sym;
          const oldGlobal = sym.parent.toGlobal(new PIXI.Point(sym.x, sym.y));
          scene.cells[m.to.r][m.to.c].addChild(sym);
          const newLocal = scene.cells[m.to.r][m.to.c].toLocal(oldGlobal);
          sym.x = newLocal.x; sym.y = newLocal.y;
          moveTweens.push(new Promise(res => {
            gsap.to(sym, { x: 0, y: 0, duration: 0.25, ease: 'power2.in', onComplete: res });
          }));
        }
        await Promise.all(moveTweens);
        const spawnTweens = [];
        for (const s of ev.spawns) {
          const sym = makeSlotSymbol(s.cell, L.cellSize);
          scene.cells[s.r][s.c].addChild(sym);
          scene.symbols[s.r][s.c] = sym;
          const dropDist = L.cellSize * (s.r + 1) + 20;

          if (s.cell && s.cell.activator) {
            // BIG entry for the rare Activator. Falls from higher,
            // lands with a heavier impact, sprite squashes/elastics into
            // place, plus a gold ring burst at the landing point.
            sym.y = -dropDist * 1.5;
            sym.alpha = 0;
            sym.scale.set(1.6);
            const gs = L.gameScale;
            const ctr = slotCellCenter(s.r, s.c);
            spawnTweens.push(new Promise(res => {
              gsap.timeline({ onComplete: res })
                .to(sym,        { y: 0, duration: 0.55, ease: 'power3.in' }, 0)
                .to(sym,        { alpha: 1, duration: 0.18, ease: 'sine.out' }, 0)
                .to(sym.scale,  { x: 1.30, y: 1.30, duration: 0.18, ease: 'back.out(2.6)' }, 0.55)
                .to(sym.scale,  { x: 1.00, y: 1.00, duration: 0.40, ease: 'elastic.out(1.4, 0.45)' }, 0.73);
              // Landing burst — gold ring expanding out at the cell.
              const burst = new PIXI.Graphics();
              burst.lineStyle(4 * gs, 0xFFD54F, 1);
              burst.drawCircle(0, 0, L.cellSize * 0.45);
              burst.x = ctr.x; burst.y = ctr.y;
              burst.alpha = 0; burst.scale.set(0.35);
              scene.fxLayer.addChild(burst);
              gsap.timeline({ delay: 0.50, onComplete: () => burst.destroy() })
                .to(burst,       { alpha: 1, duration: 0.10, ease: 'power2.out' }, 0)
                .to(burst.scale, { x: 1.85, y: 1.85, duration: 0.55, ease: 'power2.out' }, 0)
                .to(burst,       { alpha: 0, duration: 0.40, ease: 'power2.in' }, 0.20);
            }));
          } else {
            sym.y = -dropDist; sym.alpha = 0.85;
            spawnTweens.push(new Promise(res => {
              gsap.timeline({ onComplete: res })
                .to(sym, { y: 0, duration: 0.30, ease: 'power2.in' })
                .to(sym, { alpha: 1, duration: 0.10, ease: 'sine.out' }, 0);
            }));
          }
        }
        await Promise.all(spawnTweens);
      }

      async play(spinResult, beforeTokens) {
        this.playing = true;
        try {
          await this._playInner(spinResult, beforeTokens);
        } finally {
          this.playing = false;
          // If a resize fired DURING the spin, rebuild() deferred itself.
          // Now that the animator is idle, run the catch-up rebuild so the
          // layout reflects the new viewport.
          if (typeof _runPendingRebuild === 'function') _runPendingRebuild();
        }
      }

      // ── Rush Hour: animate one movement pass ──────────────────────────
      // Each move flies the sprite from its cell to the next cell (or off
      // the edge for an exit) sequentially with a small delay between
      // them — petal-flow style.
      async _playRushMovePass(ev) {
        const moves = ev.moves || [];
        const HOP_DUR = 0.16;
        const EXIT_DUR = 0.32;
        const STEP_DELAY = 70;   // ms between consecutive moves

        // Per-tick traffic-light update. Lights are now per-CELL (not
        // per interior corner): each cell has 4 arm cones (N/E/S/W)
        // that show whether the car in that cell will move in that
        // direction.
        //   green   = this cell's car is moving in that arm THIS tick
        //   yellow  = this cell's car will move in that arm later in
        //             the pass (queued, not its turn yet)
        //   red     = no traffic in that arm this pass
        //   trail   = handled inside applyArmState — when an arm
        //             transitions from green to non-green, gsap fades
        //             the green cone to alpha 0 over ~450ms before
        //             snapping to the new state. Gives the player a
        //             motion-history afterglow.
        const armDirForArrow = { up: 0, right: 1, down: 2, left: 3 };
        const _COLS = (window.RushHour && window.RushHour.GAME && window.RushHour.GAME.COLS) || 4;
        const updateLights = (currentMoveIdx) => {
          if (!scene._trafficCells) return;
          // Per-cell-per-arm target state.
          //   • Cells with NO car / no move this pass → all 4 arms 'dim'
