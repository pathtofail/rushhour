          onTap: (close) => {
            close();
            // Auto-kick the next free spin once the modal has closed.
            // Small delay so the close animation finishes and the spin
            // button isn't busy from any in-flight tween.
            setTimeout(() => {
              if (game.state.freeSpinsBank > 0
                  && scene.spinBtn && !scene.spinBtn.busy
                  && _openSimpleModalCount === 0) {
                onSpinClick();
              }
            }, 200);
          },
        }],
      });
    }

    function openPaytableModal() {
      if (scene.paytableModal) return;
      const modal = new PIXI.Container();
      const sw = L.sw, sh = L.sh;
      const scale = Math.min(1, Math.min(sw / 900, sh / 900));

      // Dimmed backdrop, click-to-close.
      const backdrop = new PIXI.Graphics();
      backdrop.beginFill(0x000000, 0.72);
      backdrop.drawRect(0, 0, sw, sh);
      backdrop.endFill();
      backdrop.eventMode = 'static';
      backdrop.on('pointertap', (e) => { if (e.target === backdrop) closePaytableModal(); });
      modal.addChild(backdrop);

      // Panel.
      const panelW = Math.min(720 * scale, sw * 0.92);
      const panelH = Math.min(620 * scale, sh * 0.92);
      const panelX = (sw - panelW) / 2;
      const panelY = (sh - panelH) / 2;
      const panel = new PIXI.Graphics();
      panel.lineStyle(3 * scale, 0xC9A24A, 1);
      panel.beginFill(0x1A2238, 0.98);   // lifted slate (HUD pill level)
      panel.drawRoundedRect(panelX, panelY, panelW, panelH, 26 * scale);
      panel.endFill();
      panel.eventMode = 'static';
      panel.hitArea = new PIXI.Rectangle(panelX, panelY, panelW, panelH);
      modal.addChild(panel);

      // Title.
      const title = new PIXI.Text('Trail Catcher', {
        fontFamily: FONT, fontSize: 30 * scale, fill: 0xC9A24A,
      });
      title.anchor.set(0.5);
      title.x = panelX + panelW / 2; title.y = panelY + 28 * scale;
      modal.addChild(title);

      // Close button (×).
      const closeBtn = new PIXI.Container();
      const closeR = 22 * scale;
      const closeBg = new PIXI.Graphics();
      const drawClose = (hover) => {
        closeBg.clear();
        closeBg.lineStyle(2 * scale, 0xC9A24A, 1);
        closeBg.beginFill(hover ? 0x2C3552 : 0x1A2238, 0.95);
        closeBg.drawCircle(0, 0, closeR);
        closeBg.endFill();
      };
      drawClose(false);
      closeBtn.addChild(closeBg);
      const closeX = new PIXI.Text('×', {
        fontFamily: 'Arial, sans-serif', fontWeight: 'bold',
        fontSize: closeR * 1.7, fill: 0xFFFFFF,
      });
      closeX.anchor.set(0.5);
      closeBtn.addChild(closeX);
      closeBtn.x = panelX + panelW - 28 * scale;
      closeBtn.y = panelY + 30 * scale;
      closeBtn.eventMode = 'static';
      closeBtn.cursor = 'pointer';
      closeBtn.hitArea = new PIXI.Circle(0, 0, closeR);
      closeBtn.on('pointerover', () => drawClose(true));
      closeBtn.on('pointerout',  () => drawClose(false));
      closeBtn.on('pointertap',  () => closePaytableModal());
      modal.addChild(closeBtn);

      // Tabs.
      const tabs = [
        { key: 'paytable', label: 'Paytable' },
        { key: 'rules',    label: 'Rules' },
      ];
      const tabBarY = panelY + 70 * scale;
      const tabW = 140 * scale, tabH = 34 * scale, tabGap = 10 * scale;
      const tabsTotalW = tabs.length * tabW + (tabs.length - 1) * tabGap;
      const tabsStartX = panelX + (panelW - tabsTotalW) / 2;
      const tabSprites = [];
      tabs.forEach((tab, idx) => {
        const t = new PIXI.Container();
        const tx = tabsStartX + idx * (tabW + tabGap) + tabW / 2;
        t.x = tx; t.y = tabBarY;
        const bg = new PIXI.Graphics();
        const draw = (active, hover) => {
          bg.clear();
          bg.lineStyle(2 * scale, 0xC9A24A, 1);
          bg.beginFill(active ? 0x3F4A6E : (hover ? 0x2C3552 : 0x232B45), 1);
          bg.drawRoundedRect(-tabW / 2, -tabH / 2, tabW, tabH, tabH * 0.4);
          bg.endFill();
        };
        draw(idx === 0, false);
        t.addChild(bg);
        const lbl = new PIXI.Text(tab.label, {
          fontFamily: FONT, fontSize: 16 * scale,
          fill: idx === 0 ? 0xC9A24A : 0x8896BB,
        });
        lbl.anchor.set(0.5);
        t.addChild(lbl);
        t.eventMode = 'static'; t.cursor = 'pointer';
        t.hitArea = new PIXI.RoundedRectangle(-tabW / 2, -tabH / 2, tabW, tabH, tabH * 0.4);
        t.on('pointertap', () => setActiveTab(idx));
        t._draw = draw; t._lbl = lbl; t._key = tab.key;
        tabSprites.push(t);
        modal.addChild(t);
      });

      // ── Content panels ──
      const contentTop = tabBarY + tabH / 2 + 18 * scale;
      const contentBot = panelY + panelH - 24 * scale;

      // Paytable content: 8 symbols, sorted highest pay → lowest. Each
      // row reads "<swatch>  +$X.XX" where the cash amount is the per-
      // cell pay at the current bet. Top tier rows get a brighter border
      // so the "biggest pays" are visually emphasized (BB pattern).
      const paytableContent = new PIXI.Container();
      modal.addChild(paytableContent);
      const COLORS = [...window.RushHour.COLORS].sort((a, b) => b.basePay - a.basePay);
      const rowGap = 6 * scale;
      const rowW = panelW - 48 * scale;
      const rowX = panelX + 24 * scale;
      const padL = 12 * scale;
      const padR = 24 * scale;
      const swReserve = 0.16 * rowW;
      const swColCx   = rowX + padL + swReserve / 2;

      // Subtitle telling the player what the values mean + current bet.
      const subtitle = new PIXI.Text(
        `Cash paid per cluster cell  (bet ${fmtCash(player.bet)})`,
        { fontFamily: FONT, fontSize: 13 * scale, fill: 0xD4A017, letterSpacing: 1 }
      );
      subtitle.anchor.set(0.5, 0.5);
      subtitle.x = panelX + panelW / 2;
      subtitle.y = contentTop + 12 * scale;
      paytableContent.addChild(subtitle);

      // Rows.
      const rowsTop = contentTop + 32 * scale;
      const rowH = (contentBot - rowsTop - rowGap * (COLORS.length - 1)) / COLORS.length;
      for (let i = 0; i < COLORS.length; i++) {
        const col = COLORS[i];
        const isTop = i < 2;   // top 2 paying symbols get tier emphasis
        const ry = rowsTop + i * (rowH + rowGap);
        const card = new PIXI.Graphics();
        card.lineStyle(isTop ? 2.5 * scale : 1.5 * scale,
                       isTop ? 0xFFD54F : 0xC9A24A, isTop ? 1 : 0.85);
        card.beginFill(0x0E1424, 0.95);
        card.drawRoundedRect(rowX, ry, rowW, rowH, rowH * 0.32);
        card.endFill();
        paytableContent.addChild(card);

        // Color swatch.
        const sw2 = Math.min(rowH * 0.7, swReserve * 0.85);
        const swCenterY = ry + rowH / 2;
        const swatch = new PIXI.Graphics();
        swatch.lineStyle(2 * scale, 0x0E1424, 0.95);
        swatch.beginFill(colorToUint(col.hex), 1);
        swatch.drawRoundedRect(
          swColCx - sw2 / 2, swCenterY - sw2 / 2, sw2, sw2, sw2 * 0.25
        );
        swatch.endFill();
        paytableContent.addChild(swatch);

        // Cash value at current bet — top tiers get a brighter gold.
        const cash = col.basePay * player.bet;
        const val = new PIXI.Text(`+${fmtCash(cash)}`, {
          fontFamily: FONT, fontSize: Math.min(24 * scale, rowH * 0.65),
          fill: isTop ? 0xFFD54F : 0xFFECB3, fontWeight: 'bold',
        });
        val.anchor.set(1, 0.5);
        val.x = rowX + rowW - padR;
        val.y = swCenterY;
        paytableContent.addChild(val);
      }

      // Rules content (text).
      const rulesContent = new PIXI.Container();
      rulesContent.visible = false;
      modal.addChild(rulesContent);
      // Per-mode rules text — pulled from the active mode's hook so each
      // mode shows its own description.
      const rulesText = window.RushHour.getModeDef().getRulesText?.()
        ?? 'No rules available for this mode.';
      const rulesBody = new PIXI.Text(rulesText, {
        fontFamily: 'Arial, sans-serif',
        fontSize: 14 * scale,
        fill: 0xF5E6CC,
        lineHeight: 19 * scale,
        wordWrap: true,
        wordWrapWidth: panelW - 80 * scale,
      });
      rulesBody.x = panelX + 40 * scale;
      rulesBody.y = contentTop;
      rulesContent.addChild(rulesBody);

      // ── Rules scroll setup ────────────────────────────────────────────
      // Mask the rules content to the modal's content area; mouse wheel
      // translates rulesContent.y. A thin gold scrollbar runs along the
      // right edge to indicate scroll position. Paytable doesn't scroll.
      const scrollAreaLeft  = panelX + 24 * scale;
      const scrollAreaRight = panelX + panelW - 24 * scale;
      const scrollAreaTop   = contentTop;
      const scrollAreaBot   = contentBot;
      const scrollAreaH     = scrollAreaBot - scrollAreaTop;
      const rulesMask = new PIXI.Graphics();
      rulesMask.beginFill(0xFFFFFF);
      rulesMask.drawRect(scrollAreaLeft, scrollAreaTop,
                         scrollAreaRight - scrollAreaLeft, scrollAreaH);
      rulesMask.endFill();
      modal.addChild(rulesMask);
      rulesContent.mask = rulesMask;

      // Scrollbar (visible only when content overflows + rules tab is on).
      const sbW = 5 * scale;
      const sbX = scrollAreaRight - sbW - 2 * scale;
      const sbTrack = new PIXI.Graphics();
      sbTrack.beginFill(0x0E1424, 0.55);
      sbTrack.drawRoundedRect(sbX, scrollAreaTop, sbW, scrollAreaH, sbW / 2);
      sbTrack.endFill();
      modal.addChild(sbTrack);
      const sbThumb = new PIXI.Graphics();
      sbThumb.beginFill(0xC9A24A, 1);
      modal.addChild(sbThumb);

      const rulesTotalH = rulesBody.height;
      const rulesScrollMax = Math.max(0, rulesTotalH - scrollAreaH);
      const updateScrollbar = () => {
        sbThumb.clear();
        if (rulesScrollMax <= 0 || !rulesContent.visible) {
          sbTrack.visible = false;
          return;
        }
        sbTrack.visible = true;
        const thumbH = Math.max(20 * scale, scrollAreaH * (scrollAreaH / rulesTotalH));
        const ratio = -rulesContent.y / rulesScrollMax;
        const thumbY = scrollAreaTop + ratio * (scrollAreaH - thumbH);
        sbThumb.beginFill(0xC9A24A, 1);
        sbThumb.drawRoundedRect(sbX, thumbY, sbW, thumbH, sbW / 2);
        sbThumb.endFill();
      };
      updateScrollbar();

      const onWheel = (e) => {
        if (!scene.paytableModal) return;
        if (!rulesContent.visible) return;
        if (rulesScrollMax <= 0) return;
        e.preventDefault();
        rulesContent.y = Math.max(-rulesScrollMax,
                                   Math.min(0, rulesContent.y - e.deltaY));
        updateScrollbar();
      };
      window.addEventListener('wheel', onWheel, { passive: false });
      modal._onWheel = onWheel;

      function setActiveTab(activeIdx) {
        tabSprites.forEach((t, i) => {
          t._draw(i === activeIdx, false);
          t._lbl.style.fill = i === activeIdx ? 0xC9A24A : 0x8896BB;
        });
        paytableContent.visible = (tabSprites[activeIdx]._key === 'paytable');
        rulesContent.visible    = (tabSprites[activeIdx]._key === 'rules');
        // Reset rules scroll when switching back to rules.
        if (rulesContent.visible) rulesContent.y = 0;
        updateScrollbar();
      }

      modal.alpha = 0;
      app.stage.addChild(modal);
      scene.paytableModal = modal;
      gsap.to(modal, { alpha: 1, duration: 0.20, ease: 'power2.out' });
    }

    function closePaytableModal() {
      const m = scene.paytableModal;
      if (!m) return;
      if (m._onWheel) window.removeEventListener('wheel', m._onWheel);
      scene.paytableModal = null;
      gsap.to(m, {
        alpha: 0, duration: 0.18, ease: 'power2.in',
        onComplete: () => m.destroy({ children: true }),
      });
    }

    // Close paytable on Escape.
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Escape' && scene.paytableModal) closePaytableModal();
    });

    // ── Mode button (for the bottom row) ─────────────────────────────────
    // Pill-style: gold border + dark slate fill + cream label. Active mode
    // gets a slightly brighter slate fill + bold gold label.

    function makeAdjustButton(symbol, onTap) {
      const gs = L.gameScale;
      const r = 22 * gs;
      const c = new PIXI.Container();
      const g = new PIXI.Graphics();
      const draw = (hover = false) => {
        g.clear();
        g.lineStyle(2 * gs, 0xC9A24A, 0.95);
        g.beginFill(hover ? 0x2C3552 : 0x1A2238, 0.85);
        g.drawCircle(0, 0, r);
        g.endFill();
      };
      draw();
      c.addChild(g);
      const t = new PIXI.Text(symbol, {
        fontFamily: FONT, fontSize: 26 * gs, fill: 0xFFECB3, fontWeight: 'bold',
      });
      t.anchor.set(0.5);
      c.addChild(t);
      c.eventMode = 'static'; c.cursor = 'pointer';
      c.hitArea = new PIXI.Circle(0, 0, r);
      c.on('pointerover', () => { draw(true); gsap.to(c.scale, { x: 1.08, y: 1.08, duration: 0.12 }); });
      c.on('pointerout',  () => { draw(false); gsap.to(c.scale, { x: 1, y: 1, duration: 0.12 }); });
      c.on('pointertap', onTap);
      return c;
    }

    // ── Scene ────────────────────────────────────────────────────────────────
    // Layer order (back → front):
    //   frameContainer  — background panel + cell BGs + conveyor BGs
    //   slotLayer       — per-cell Containers w/ symbols + stamps (MASKED)
    //   conveyorLayer   — token sprites (unmasked, can sit anywhere on L)
    //   fxLayer         — floating texts on top
    const scene = {
      stage: app.stage,
      frameContainer: null, slotLayer: null, conveyorLayer: null, fxLayer: null,
      gridMask: null,
      cellBgs: null, cells: null, symbols: null, stamps: null,
      ringCellBgs: null, ringTokens: null,
      balancePill: null, betPill: null, winPill: null,
      betMinusBtn: null, betPlusBtn: null,
      spinBtn: null, infoBtn: null,
    };

    function buildScene() {
      L = layout();
      // Reset stage transform before tearing down children — if a resize
      // fires mid-shake (shakeStage), the new scene would render at a
      // non-zero offset and the UI shifts off-screen.
      gsap.killTweensOf(scene.stage);
      scene.stage.x = 0; scene.stage.y = 0;
      scene.stage.scale.set(1);
      scene.stage.removeChildren();
      const gs = L.gameScale;

      // (Background is the app's flat backgroundColor — no sprite.)
      // No big title — the mode-button row + GAME MODE caption (added at
      // the bottom of buildScene) own the top region instead.

      // 3. Frame container — backdrop + cell + ring backgrounds. Always
      // visible, never masked.
      const frame = new PIXI.Container();
      scene.frameContainer = frame;
      scene.stage.addChild(frame);

      // Backdrop panel under the whole frame.
      const panel = new PIXI.Graphics();
      panel.lineStyle(3 * gs, 0xC9A24A, 0.95);   // gold border
      panel.beginFill(0x1A2238, 0.95);           // panel: slightly raised dark
      panel.drawRoundedRect(
        L.frameX - 14 * gs, L.frameY - 14 * gs,
        L.frameSize + 28 * gs, L.frameH + 28 * gs,
        18 * gs
      );
      panel.endFill();
      frame.addChild(panel);

      // 4. Slot cell backgrounds.
      // Slot cells are placed inside the frame's inner area. Base mode
      // leaves the LEFT column at frame visC=0 (no left conveyor); All
      // Around inset by 1 on each side so all four edges have conveyor.
      scene.cellBgs = []; scene.cells = []; scene.symbols = []; scene.stamps = [];
      const slotColOffset = (MODE === 'allAround' || MODE === 'rush') ? 1 : 0;
      for (let r = 0; r < GAME.ROWS; r++) {
        scene.cellBgs[r] = [];
        for (let c = 0; c < GAME.COLS; c++) {
          const visR = r + 1, visC = c + slotColOffset;
          const x = L.frameX + (L.cellSize + L.cellGap) * visC;
          const y = L.frameY + (L.cellSize + L.cellGap) * visR;
          const bg = new PIXI.Graphics();
          bg.lineStyle(1.5 * gs, 0x3F4A6E, 0.7);   // slate border, subtle
          bg.beginFill(0x232B45, 1);               // dark slate cell
          bg.drawRoundedRect(x, y, L.cellSize, L.cellSize, 8 * gs);
          bg.endFill();
          frame.addChild(bg);
          scene.cellBgs[r][c] = bg;
        }
      }

      // 5. Ring cells (conveyor — top + right column).
      scene.ringCellBgs = {};
      scene.ringTokens = {};
      // RING_SIZE collectible cells (pos 1..RING_SIZE) — the actual
      // conveyor where tokens travel and can be intercepted.
      for (let pos = 1; pos <= RING_SIZE; pos++) {
        const ctr = ringCellCenter(pos);
        if (!ctr) continue;
        const bg = new PIXI.Graphics();
        bg.lineStyle(1.5 * gs, 0xC9A24A, 0.9);   // conveyor: gold border
        bg.beginFill(0x1B2238, 0.95);            // dark base, gold reads as "loot path"
        bg.drawRoundedRect(
          ctr.x - L.cellSize / 2, ctr.y - L.cellSize / 2,
          L.cellSize, L.cellSize, 8 * gs
        );
        bg.endFill();
        // Rush Hour: paint a chevron arrow on every non-corner conveyor
        // cell pointing OUTWARD (the direction a car would exit through
        // that slot). Decorative — communicates "exits happen here".
        if (MODE === 'rush') {
          const C = GAME.COLS, R = GAME.ROWS;
          const outDir =
            (pos >= 1 && pos <= C)                       ? 'up' :
            (pos >= C + 1 && pos <= C + R)               ? 'right' :
            (pos >= C + R + 1 && pos <= 2 * C + R)       ? 'down' :
            (pos >= 2 * C + R + 1 && pos <= 2 * (C + R)) ? 'left' :
            null;
          if (outDir) {
            bg.lineStyle(3 * gs, 0xFFE082, 0.95);
            const sz = L.cellSize * 0.22;
            // Chevron defined in a "right-pointing" frame; rotate to outDir.
            const angle =
              outDir === 'right' ?  0 :
              outDir === 'down'  ?  Math.PI / 2 :
              outDir === 'left'  ?  Math.PI :
              /* up */              -Math.PI / 2;
            const cos = Math.cos(angle), sin = Math.sin(angle);
            const seg = (x1, y1, x2, y2) => {
              bg.moveTo(ctr.x + x1 * cos - y1 * sin, ctr.y + x1 * sin + y1 * cos);
              bg.lineTo(ctr.x + x2 * cos - y2 * sin, ctr.y + x2 * sin + y2 * cos);
            };
            seg(-sz, 0,  sz, 0);   // shaft
            seg(  0,-sz, sz, 0);   // upper barb
            seg(  0, sz, sz, 0);   // lower barb
          }
        }
        frame.addChild(bg);
        scene.ringCellBgs[pos] = bg;
        scene.ringTokens[pos] = null;
      }

      // Creating tile (pos 0) — LEFT of pos 1. Visually distinct portal
      // shape. Each spin it puffs smoke; sometimes a new token emerges.
      {
        const ctr = ringCellCenter(0);
        const bg = new PIXI.Graphics();
        bg.lineStyle(2 * gs, 0x4FB2A8, 0.95);
        bg.beginFill(0x163E40, 0.95);
        bg.drawRoundedRect(
          ctr.x - L.cellSize / 2, ctr.y - L.cellSize / 2,
          L.cellSize, L.cellSize, 10 * gs
        );
        bg.endFill();
        // Inner spawn-port ring.
        bg.lineStyle(1.5 * gs, 0x6FE0D6, 0.7);
        bg.drawCircle(ctr.x, ctr.y, L.cellSize * 0.30);
        bg.lineStyle(1 * gs, 0x6FE0D6, 0.4);
        bg.drawCircle(ctr.x, ctr.y, L.cellSize * 0.18);
        frame.addChild(bg);
        scene.ringCellBgs[0] = bg;
        // Save the centre point — animator uses it for smoke puffs.
        scene.creatingTileCtr = { x: ctr.x, y: ctr.y };
      }

      // Destroying tile (pos FINISH_POS).
      //   Base mode  — its own crusher cell to the right of the conveyor.
      //   All Around — same physical cell as the creator (TL corner). On
      //                destroy the creator visual is briefly replaced with
      //                a red-X overlay; see _flashDestroyAt() in animator.
      if (MODE === 'allAround' || MODE === 'rush') {
        const ctr = ringCellCenter(FINISH_POS);
        scene.destroyingTileCtr = { x: ctr.x, y: ctr.y };
        // No separate cell drawn — the creator block above already drew
        // the TL corner.
      } else {
        const ctr = ringCellCenter(FINISH_POS);
        const bg = new PIXI.Graphics();
        bg.lineStyle(2 * gs, 0xC04848, 0.95);
        bg.beginFill(0x401818, 0.95);
        bg.drawRoundedRect(
          ctr.x - L.cellSize / 2, ctr.y - L.cellSize / 2,
          L.cellSize, L.cellSize, 10 * gs
        );
        bg.endFill();
        bg.lineStyle(2.5 * gs, 0xE8786C, 0.8);
        const off = L.cellSize * 0.22;
        bg.moveTo(ctr.x - off, ctr.y - off); bg.lineTo(ctr.x + off, ctr.y + off);
        bg.moveTo(ctr.x + off, ctr.y - off); bg.lineTo(ctr.x - off, ctr.y + off);
        frame.addChild(bg);
        scene.ringCellBgs[FINISH_POS] = bg;
        scene.destroyingTileCtr = { x: ctr.x, y: ctr.y };
      }

      const drawDot = (fromPos, toPos) => {
        const a = ringCellCenter(fromPos), b = ringCellCenter(toPos);
        if (!a || !b) return;
        const dot = new PIXI.Graphics();
        dot.beginFill(0xC9A24A, 0.55);   // gold connector dots
        dot.drawCircle((a.x + b.x) / 2, (a.y + b.y) / 2, 2.5 * gs);
        dot.endFill();
        frame.addChild(dot);
      };
      // Connectors: 0→1 (entry from creating tile), 1..RING_SIZE (along
      // conveyor), RING_SIZE→FINISH_POS (exit toward destroying tile).
      for (let p = 0; p < FINISH_POS; p++) drawDot(p, p + 1);

      // ── All Around: 3 corner ×2 markers ──────────────────────────────
      // Visual gates between sides where tokens upgrade tier. Drawn in
      // the frame's outer corner cells (TR, BR, BL). The TL corner is
      // reserved for the creator + destroyer.
      if (MODE === 'allAround') {
        const cornerCells = [
          { visR: 0,             visC: GAME.COLS + 1, label: 'TR' },
          { visR: GAME.ROWS + 1, visC: GAME.COLS + 1, label: 'BR' },
          { visR: GAME.ROWS + 1, visC: 0,             label: 'BL' },
        ];
        for (const cc of cornerCells) {
          const x = L.frameX + (L.cellSize + L.cellGap) * cc.visC;
          const y = L.frameY + (L.cellSize + L.cellGap) * cc.visR;
          const bg = new PIXI.Graphics();
          bg.lineStyle(2 * gs, 0xFFD54F, 1);              // bright gold
          bg.beginFill(0x3A2810, 0.95);                   // dark warm
          bg.drawRoundedRect(x, y, L.cellSize, L.cellSize, 10 * gs);
          bg.endFill();
          frame.addChild(bg);
          const txt = new PIXI.Text('×2', {
            fontFamily: FONT, fontSize: L.cellSize * 0.45,
            fill: 0xFFD54F, fontWeight: 'bold',
            stroke: 0x2A1808, strokeThickness: 3 * gs,
          });
          txt.anchor.set(0.5);
          txt.x = x + L.cellSize / 2;
          txt.y = y + L.cellSize / 2;
          frame.addChild(txt);
        }
      }

      // 6b. Cell mult-text layer — big "N×" text BEHIND symbols. Per the
      // user's spec: "the grid has the multiplier, not the symbol — symbols
      // drop ON TO the multipliers." So the big text is painted on the
      // grid surface and partially obscured by whatever symbol is on top
      // of it. The small upper-right badge (layer 6e below) carries the
      // legible read-out for the player.
      const cellMultTextLayer = new PIXI.Container();
      scene.cellMultTextLayer = cellMultTextLayer;
      scene.stage.addChild(cellMultTextLayer);
      scene.cellMultTexts = [];
      for (let r = 0; r < GAME.ROWS; r++) {
        scene.cellMultTexts[r] = [];
        for (let c = 0; c < GAME.COLS; c++) scene.cellMultTexts[r][c] = null;
      }

      // 6c. Slot layer — symbol containers (above the tint + big text).
      const slotLayer = new PIXI.Container();
      scene.slotLayer = slotLayer;
      scene.stage.addChild(slotLayer);
      for (let r = 0; r < GAME.ROWS; r++) {
        scene.cells[r] = []; scene.symbols[r] = []; scene.stamps[r] = [];
        for (let c = 0; c < GAME.COLS; c++) {
          const cont = new PIXI.Container();
          const ctr = slotCellCenter(r, c);
          cont.x = ctr.x; cont.y = ctr.y;
          slotLayer.addChild(cont);
          scene.cells[r][c] = cont;
          scene.symbols[r][c] = null;
          scene.stamps[r][c] = null;
        }
      }
      if (currentGrid) {
        for (let r = 0; r < GAME.ROWS; r++) {
          for (let c = 0; c < GAME.COLS; c++) {
            const cell = currentGrid[r][c];
            if (!cell) continue;
            const sym = makeSlotSymbol(cell, L.cellSize);
            scene.cells[r][c].addChild(sym);
            scene.symbols[r][c] = sym;
          }
        }
      }

      // 6d. Tile badge layer — small upper-right pill ON TOP of the symbol
      // showing the multiplier value as a legible read-out (BB pattern).
      const tileBadgeLayer = new PIXI.Container();
      scene.tileBadgeLayer = tileBadgeLayer;
      scene.stage.addChild(tileBadgeLayer);
      scene.tileBadges = [];
      for (let r = 0; r < GAME.ROWS; r++) {
        scene.tileBadges[r] = [];
        for (let c = 0; c < GAME.COLS; c++) scene.tileBadges[r][c] = null;
      }

      // Mask the slot ROWS×COLS region for all four layers (tint, big
      // text, symbols, badge).
      const slotColStart = (MODE === 'allAround' || MODE === 'rush') ? 1 : 0;
      const slotLeft = L.frameX + (L.cellSize + L.cellGap) * slotColStart;
      const slotRight = slotLeft + (L.cellSize + L.cellGap) * GAME.COLS - L.cellGap;
      const slotTop = L.frameY + (L.cellSize + L.cellGap) * 1;
      const slotBottom = L.frameY + (L.cellSize + L.cellGap) * (GAME.ROWS + 1) - L.cellGap;
      const gridMask = new PIXI.Graphics();
      gridMask.beginFill(0xFFFFFF);
      gridMask.drawRect(slotLeft, slotTop, slotRight - slotLeft, slotBottom - slotTop);
      gridMask.endFill();
      scene.stage.addChild(gridMask);
      slotLayer.mask = gridMask;
      cellMultTextLayer.mask = gridMask;
      tileBadgeLayer.mask = gridMask;
      scene.gridMask = gridMask;

      // 7. Conveyor token layer — sits ABOVE the slot layer (so a token
      // animation overlapping the slot grid renders in front of symbols).
      // Not masked — tokens travel along the L outside the slot bounds.
      const conveyorLayer = new PIXI.Container();
      scene.conveyorLayer = conveyorLayer;
      scene.stage.addChild(conveyorLayer);

      // 8. FX layer on top of everything.
      const fx = new PIXI.Container();
      scene.fxLayer = fx;
      scene.stage.addChild(fx);

      // HUD row anchored relative to the FRAME's bottom (BB pattern), not
      // pinned to the canvas bottom. Layout:
      //   [info]  [balance]  [win]  [− bet +]  [spin]
      const pillW   = 200 * gs;
      const pillH   =  58 * gs;
      const pillGap =  14 * gs;
      const winPillW = pillW * 1.35;
      const adjR    =  22 * gs;
      const btnSize = 130 * gs;
      const infoSize = 60 * gs;

      const fieldW = pillW + pillGap + winPillW + pillGap + adjR + pillW + adjR;
      const fieldLeft = (L.sw - fieldW) / 2;

      const balanceCX = fieldLeft + pillW / 2;
      const winCX     = balanceCX + pillW / 2 + pillGap + winPillW / 2;
      const betCX     = winCX + winPillW / 2 + pillGap + adjR + pillW / 2;
      const minusCX   = betCX - pillW / 2;
      const plusCX    = betCX + pillW / 2;
      const infoCX    = fieldLeft - pillGap - infoSize / 2;
      const spinCX    = (betCX + pillW / 2 + adjR) + pillGap + btnSize / 2;
      // Anchor: a breathing gap below the frame, plus pill height.
      const uiGapBelowFrame = 36 * gs;
      const hudCY = L.frameY + L.frameH + uiGapBelowFrame + pillH / 2;

      // Balance pill
      scene.balancePill = makePill({
        x: balanceCX, y: hudCY, label: 'BALANCE',
        value: fmtCash(player.balance), width: pillW,
      });
      scene.stage.addChild(scene.balancePill);

      // Win pill (wider — accommodates big wins)
      scene.winPill = makePill({
        x: winCX, y: hudCY, label: 'WIN',
        value: fmtCash(0), width: winPillW, accent: 0x6FD2FF,
      });
      scene.stage.addChild(scene.winPill);

      // Bet pill (interactive — click cycles up; − / + buttons too)
      scene.betPill = makePill({
        x: betCX, y: hudCY, label: 'BET',
        value: fmtCash(player.bet), width: pillW, interactive: true,
        onClick: () => cycleBet(+1),
      });
      scene.stage.addChild(scene.betPill);

      scene.betMinusBtn = makeAdjustButton('−', () => cycleBet(-1));
      scene.betMinusBtn.x = minusCX; scene.betMinusBtn.y = hudCY;
      scene.stage.addChild(scene.betMinusBtn);
      scene.betPlusBtn = makeAdjustButton('+', () => cycleBet(+1));
      scene.betPlusBtn.x = plusCX; scene.betPlusBtn.y = hudCY;
      scene.stage.addChild(scene.betPlusBtn);

      // (BUY FEATURE button intentionally not rendered. The helpers
      // — canBuyFeature / featureCost / featureSpinCount / startFeature
      // / openBuyFeatureModal — are still defined and callable from the
      // console, in case we want to surface this later.)
      scene.buyBtn = null;

      // Info button — opens the paytable modal. Hover/press scaling
      // matches BB's interactive sprite pattern.
      scene.infoBtn = new PIXI.Sprite(infoButtonTexture);
      scene.infoBtn.anchor.set(0.5);
      scene.infoBtn.scale.set(infoSize / infoButtonTexture.height);
      scene.infoBtn.x = infoCX; scene.infoBtn.y = hudCY;
      scene.infoBtn.eventMode = 'static'; scene.infoBtn.cursor = 'pointer';
      const infoBaseScale = scene.infoBtn.scale.x;
      scene.infoBtn.on('pointerover', () => gsap.to(scene.infoBtn.scale, { x: infoBaseScale * 1.08, y: infoBaseScale * 1.08, duration: 0.12 }));
      scene.infoBtn.on('pointerout',  () => gsap.to(scene.infoBtn.scale, { x: infoBaseScale,        y: infoBaseScale,        duration: 0.12 }));
      scene.infoBtn.on('pointerdown', () => gsap.to(scene.infoBtn.scale, { x: infoBaseScale * 0.92, y: infoBaseScale * 0.92, duration: 0.08 }));
      scene.infoBtn.on('pointerup',   () => gsap.to(scene.infoBtn.scale, { x: infoBaseScale * 1.08, y: infoBaseScale * 1.08, duration: 0.10 }));
      scene.infoBtn.on('pointerupoutside', () => gsap.to(scene.infoBtn.scale, { x: infoBaseScale, y: infoBaseScale, duration: 0.10 }));
      scene.infoBtn.on('pointertap',  () => openPaytableModal());
      scene.stage.addChild(scene.infoBtn);

      // Spin button (sprite, rotates while busy)
      const btn = new PIXI.Sprite(spinButtonTexture);
      btn.anchor.set(0.5);
      btn.scale.set(btnSize / spinButtonTexture.height);
      btn.x = spinCX; btn.y = hudCY;
      btn.eventMode = 'static'; btn.cursor = 'pointer';
      const baseScale = btn.scale.x;
      btn.on('pointerover', () => {
        if (btn.busy) return;
        gsap.to(btn.scale, { x: baseScale * 1.06, y: baseScale * 1.06, duration: 0.12 });
      });
      btn.on('pointerout', () => {
        if (btn.busy) return;
        gsap.to(btn.scale, { x: baseScale, y: baseScale, duration: 0.12 });
      });
      btn.on('pointerdown', () => {
        if (btn.busy) return;
        gsap.to(btn.scale, { x: baseScale * 0.94, y: baseScale * 0.94, duration: 0.08 });
      });
      btn.on('pointerup', () => {
        gsap.to(btn.scale, { x: baseScale, y: baseScale, duration: 0.12, ease: 'back.out(2)' });
      });
      btn.on('pointertap', () => onSpinClick());
      btn._setBusy = (b) => {
        btn.busy = b;
        btn.alpha = b ? 0.55 : 1;
        btn.cursor = b ? 'default' : 'pointer';
        if (b) {
          btn._spinTween = gsap.to(btn, {
            rotation: btn.rotation + Math.PI * 2,
            duration: 1.2, ease: 'none', repeat: -1,
          });
        } else {
          if (btn._spinTween) { btn._spinTween.kill(); btn._spinTween = null; }
          gsap.to(btn, { rotation: 0, duration: 0.3, ease: 'power2.out' });
        }
      };
      scene.stage.addChild(btn);
      scene.spinBtn = btn;

      // ── Debug RTP overlay (BB pattern). Low-contrast text near the
      // bottom edge — shows live measured RTP, spin count, hit rate.
      scene.rtpText = new PIXI.Text('RTP 0.00%  |  Spins 0', {
        fontFamily: FONT, fontSize: 13 * gs, fill: 0xFFE0A0,
      });
      scene.rtpText.anchor.set(0.5);
      scene.rtpText.alpha = 0.55;
      scene.rtpText.x = L.sw / 2;
      scene.rtpText.y = L.sh - 18 * gs;
      scene.stage.addChild(scene.rtpText);

      // Per-mode scene widget hook (BB-style). Currently a no-op for
      // rush, kept so future widgets can plug in here.
      window.RushHour.getModeDef().buildSceneFeatureWidget?.(scene, app, { L });

      // Sync HUD state (gating, free-spin banner) on first paint AND every
      // rebuild so resize-during-feature still shows the correct controls.
      refreshHUD();
    }

    // Tracks the last balance value DISPLAYED on the pill (not necessarily
    // the live player.balance). Used as the count-up source so subsequent
    // updates animate from the visible value, not the engine value.
    let _displayedBalance = null;
    function refreshHUD(opts) {
      // Balance is animated when changing; instant-set on initial paint /
      // bet cycles to avoid distracting tweens. opts.animateBalance = true
      // lets call sites opt in to the animation (spin payouts).
      if (scene.balancePill && scene.balancePill.valText) {
        if (_displayedBalance == null) _displayedBalance = player.balance;
        if (opts && opts.animateBalance) {
          tweenCount(scene.balancePill.valText, _displayedBalance, player.balance);
        } else {
          scene.balancePill.valText.text = fmtCash(player.balance);
          if (scene.balancePill.valText._countTween) {
            scene.balancePill.valText._countTween.kill();
            scene.balancePill.valText._countTween = null;
          }
        }
        _displayedBalance = player.balance;
      }
      if (scene.betPill)     scene.betPill.valText.text     = fmtCash(player.bet);
      refreshBetControlsEnabled();
      updateSpinButtonState();
      refreshFreeSpinBanner();
      if (scene.buyBtn && scene.buyBtn._refresh) scene.buyBtn._refresh();
      updateRtpText();
    }
    // Live debug overlay — RTP / spin count / avg win pinned to the bottom
    // of the canvas. Low-contrast so it doesn't compete with the HUD pills.
    function updateRtpText() {
      if (!scene.rtpText) return;
      const s = window.RushHour.stats;
      const pct = (s.rtp * 100).toFixed(2);
      scene.rtpText.text = `RTP ${pct}%   |   Spins ${s.spins}   |   Hit ${(s.hitRate * 100).toFixed(1)}%   |   Avg win ${s.avgWin.toFixed(2)}`;
    }
    function setWinDisplay(amount) {
      if (!scene.winPill || !scene.winPill.valText) return;
      // Smooth count-up from the currently-displayed value to the target.
      const t = scene.winPill.valText;
      const fromVal = _readWinDisplay();
      tweenCount(t, fromVal, amount);
    }
    function _readWinDisplay() {
      if (!scene.winPill || !scene.winPill.valText) return 0;
      const txt = scene.winPill.valText.text || '$0.00';
      // Strip $ and commas to parse.
      const n = parseFloat(txt.replace(/[$,]/g, ''));
      return isNaN(n) ? 0 : n;
    }

    // ── Spin / bet gating (BB pattern) ───────────────────────────────────────
    function isSpinning() {
      return !!(scene.spinBtn && scene.spinBtn.busy);
    }
    function inFreeSpinFeature() {
      return !!(game && game.state && (game.state.inFreeSpin || game.state.freeSpinsBank > 0));
    }
    function canAffordSpin() {
      if (inFreeSpinFeature()) return true;
      return player.balance >= player.bet;
    }
    function refreshBetControlsEnabled() {
      // Bet controls are disabled while a spin is in flight OR while the
      // free-spin feature is running (locked bet).
      const lock = isSpinning() || inFreeSpinFeature();
      const apply = (obj) => {
        if (!obj) return;
        obj.alpha = lock ? 0.4 : 1;
        obj.eventMode = lock ? 'none' : 'static';
        obj.cursor = lock ? 'default' : 'pointer';
      };
      apply(scene.betPill);
      apply(scene.betMinusBtn);
      apply(scene.betPlusBtn);
    }
    function updateSpinButtonState() {
      const btn = scene.spinBtn;
      if (!btn) return;
      // Spin button only goes "dim/disabled" when the player can't afford.
      // While spinning, _setBusy already handles alpha + rotation, so we
      // don't fight it here.
      if (btn.busy) return;
      const ok = canAffordSpin();
      btn.alpha = ok ? 1 : 0.5;
      btn.cursor = ok ? 'pointer' : 'default';
    }
    // ── Buy-feature (BB pattern) ─────────────────────────────────────────────
    // Cost = bet × 100; awards SCATTER_TRIGGER_SPINS free spins.
    const FEATURE_COST_MULT = 100;
    function featureCost() { return player.bet * FEATURE_COST_MULT; }
    function featureSpinCount() {
      return window.RushHour.SCATTER_TRIGGER_SPINS || 10;
    }
    function canBuyFeature() {
      return !inFreeSpinFeature() && player.balance >= featureCost();
    }
    function startFeature() {
      const cost = featureCost();
      const spins = featureSpinCount();
      if (player.balance < cost) return;
      player.balance -= cost;
      game.state.freeSpinsBank += spins;
      refreshHUD({ animateBalance: true });
      // Kick off the first feature spin after the dialog closes.
      setTimeout(() => onSpinClick(), 350);
    }
    function openBuyFeatureModal() {
      if (!canBuyFeature()) return;
      const cost = featureCost();
      const spins = featureSpinCount();
      _openSimpleModal({
        title: 'Buy Feature',
        bodyLines: [
          'Are you sure you want to buy',
          `${spins} free spins for ${fmtCash(cost)}?`,
          ' ',
          'Free spins use your CURRENT bet.',
          'Tokens still spawn and travel along the conveyor.',
        ],
        buttons: [
          { label: 'CANCEL', fill: 0xB22A2A, hoverFill: 0xD43C3C, stroke: 0xFF6B6B,
            onTap: (close) => close() },
          { label: 'YES',    fill: 0x2E7D32, hoverFill: 0x3FA143, stroke: 0x7FE080,
            onTap: (close) => { close(); startFeature(); } },
        ],
      });
    }

    function flashInsufficientBalance() {
      const p = scene.balancePill;
      if (!p) return;
      gsap.killTweensOf(p.scale);
      gsap.fromTo(p.scale,
        { x: 1.08, y: 1.08 },
        { x: 1, y: 1, duration: 0.40, ease: 'back.out(2)' });
      const v = p.valText;
      if (!v) return;
      const orig = v.style.fill;
      v.style.fill = 0xE05A5A;
      setTimeout(() => { v.style.fill = orig; }, 380);
    }
    function refreshFreeSpinBanner() {
      // BB-style square banner anchored to the LEFT of the slot grid,
      // top-aligned with the grid top edge. Two stacked lines:
      // "FREE SPINS" title + "N LEFT" count. Created lazily and torn
      // down when the bank empties.
      const left = (game && game.state) ? game.state.freeSpinsBank : 0;
      if (left > 0) {
        const gs = L.gameScale;
        if (!scene.freeSpinBanner) {
          const bSize = 130 * gs;
          // Anchor to the LEFT of the frame (not the slot grid) so in
          // All Around mode the banner sits outside the conveyor's
          // left column, not on top of it. Clamp to canvas left edge
          // if the frame is hugging the canvas.
          const slotTop = L.frameY + (L.cellSize + L.cellGap) * 1;
          const leftGap = 24 * gs;
          let bx = L.frameX - leftGap - bSize / 2;
          if (bx - bSize / 2 < 8 * gs) bx = bSize / 2 + 8 * gs;
          const by = slotTop + bSize / 2;
          const cont = new PIXI.Container();
          cont.x = bx; cont.y = by;
          const bg = new PIXI.Graphics();
          bg.lineStyle(2.5 * gs, 0xC9A24A, 1);
          bg.beginFill(0x1A2238, 0.95);
          bg.drawRoundedRect(-bSize / 2, -bSize / 2, bSize, bSize, bSize * 0.18);
          bg.endFill();
          cont.addChild(bg);
          const title = new PIXI.Text('FREE SPINS', {
            fontFamily: FONT, fontSize: 15 * gs,
            fill: 0xFFECB3, letterSpacing: 0.6,
          });
          title.anchor.set(0.5);
          title.y = -bSize * 0.22;
          cont.addChild(title);
          const count = new PIXI.Text(`${left} LEFT`, {
            fontFamily: FONT, fontSize: 22 * gs,
            fill: 0xFFD54F, fontWeight: 'bold',
          });
          count.anchor.set(0.5);
          count.y = bSize * 0.17;
          cont.addChild(count);
          cont._countText = count;
          scene.stage.addChild(cont);
          scene.freeSpinBanner = cont;
        } else {
          scene.freeSpinBanner._countText.text = `${left} LEFT`;
        }
      } else if (scene.freeSpinBanner) {
        scene.freeSpinBanner.parent && scene.freeSpinBanner.parent.removeChild(scene.freeSpinBanner);
        scene.freeSpinBanner.destroy({ children: true });
        scene.freeSpinBanner = null;
      }
    }

    // ── Animator ─────────────────────────────────────────────────────────────
    class SpinAnimator {
      constructor() {
        this.runningWin = 0;
        this.playing = false;
        // Activator-mode spin-charged multiplier: a "×N" badge sits at
        // the centre of the slot grid while it accumulates from each
        // multiplier activator that fires this spin. At end of spin the
        // engine emits a `multiplierApply` event; the badge slams onto
        // the win pill and the total bumps. If no clusters paid this
        // spin, the badge fades out (fizzle).
        this._chargedMultValue = 0;
        this._chargedMultBadge = null;
        // Where the badge currently sits on screen. Set to the ring slot
        // of the FIRST multiplier activator that fires this spin; later
        // activators send mini-badges flying TO this position.
        this._chargedMultBadgePos = null;
      }

      _multCenterPos() {
        return {
          x: L.frameX + L.frameSize / 2,
          y: L.frameY + L.frameH / 2,
        };
      }

      // Make sure the charge badge exists at the given screen position
      // (conveyor ring slot of the first activator). Returns the badge.
      _ensureChargeBadge(atPos) {
        if (this._chargedMultBadge) return this._chargedMultBadge;
        const gs = L.gameScale;
        const ctr = atPos || this._multCenterPos();
        this._chargedMultBadgePos = { x: ctr.x, y: ctr.y };
        const cont = new PIXI.Container();
        cont.x = ctr.x; cont.y = ctr.y;
        // Outer crackle ring — slowly rotates while charging.
        const crackle = new PIXI.Graphics();
        crackle.lineStyle(2 * gs, 0xFFE082, 0.85);
        const cR = L.cellSize * 1.15;
        // Dashed ring built from short arcs so rotation reads.
        const dashes = 12;
        for (let i = 0; i < dashes; i++) {
          const a0 = (i / dashes) * Math.PI * 2;
          const a1 = a0 + (Math.PI * 2 / dashes) * 0.55;
          crackle.arc(0, 0, cR, a0, a1);
          crackle.moveTo(0, 0);
        }
        cont.addChild(crackle);
        // Halo — pulses alpha + scale in a charging loop.
        const halo = new PIXI.Graphics();
        halo.beginFill(0xFFD54F, 0.20);
        halo.drawCircle(0, 0, L.cellSize * 1.05);
        halo.endFill();
        cont.addChild(halo);
        const ring = new PIXI.Graphics();
        ring.lineStyle(5 * gs, 0xFFD54F, 1);
        ring.drawCircle(0, 0, L.cellSize * 0.85);
        cont.addChild(ring);
        const txt = new PIXI.Text(`×0`, {
          fontFamily: FONT, fontSize: L.cellSize * 0.85,
          fill: 0xFFD54F, stroke: 0x2A1808, strokeThickness: 6 * gs,
          fontWeight: 'bold',
        });
        txt.anchor.set(0.5);
        cont.addChild(txt);
        cont._txt = txt;
        cont._halo = halo;
        cont._ring = ring;
        cont._crackle = crackle;
        cont.alpha = 0;
        cont.scale.set(0.4);
        scene.fxLayer.addChild(cont);
        this._chargedMultBadge = cont;
        // Charging loops — kept on the badge so we can kill them when
        // the badge is consumed (apply / fizzle).
        cont._chargeTweens = [];
        // Crackle ring slowly rotates.
        cont._chargeTweens.push(gsap.to(crackle, {
          rotation: Math.PI * 2, duration: 4.5,
          ease: 'none', repeat: -1,
        }));
        // Halo breathes — alpha + scale.
        cont._chargeTweens.push(gsap.to(halo, {
          alpha: 0.45, duration: 0.85,
          ease: 'sine.inOut', repeat: -1, yoyo: true,
        }));
        cont._chargeTweens.push(gsap.to(halo.scale, {
          x: 1.18, y: 1.18, duration: 0.85,
          ease: 'sine.inOut', repeat: -1, yoyo: true,
        }));
        // Inner ring shimmers thickness via alpha.
        cont._chargeTweens.push(gsap.to(ring, {
          alpha: 0.55, duration: 0.55,
          ease: 'sine.inOut', repeat: -1, yoyo: true,
        }));
        // Number text gets a tiny breathing pulse.
        cont._chargeTweens.push(gsap.to(txt.scale, {
          x: 1.06, y: 1.06, duration: 0.70,
          ease: 'sine.inOut', repeat: -1, yoyo: true,
        }));
        return cont;
      }

      // Stop the charging loops on a badge so it can fly / fade cleanly.
      _stopChargeLoops(badge) {
        if (!badge || !badge._chargeTweens) return;
        for (const tw of badge._chargeTweens) {
          try { tw.kill(); } catch (e) { /* noop */ }
        }
        badge._chargeTweens = null;
      }

      // Multiplier activator fired. The charge badge LIVES on the
      // conveyor (at the ring slot of the first activator that fires
      // this spin) and sits there charging while cascades happen
      // underneath. Subsequent activators on the same spin send a
      // mini-badge FROM their own ring slot TO the badge's position,
      // adding to its value with a pulse.
      async _addToMultiplierCharge(value, fromCtr) {
        const gs = L.gameScale;
        const wasFresh = (this._chargedMultValue === 0);
        // First charge of the spin: spawn the badge at the activator's
        // ring slot. No flier needed.
        if (wasFresh) {
          const badge = this._ensureChargeBadge(fromCtr);
          this._chargedMultValue += value;
          badge._txt.text = `×${this._chargedMultValue}`;
          await new Promise(res => {
            gsap.timeline({ onComplete: res })
              .to(badge,       { alpha: 1, duration: 0.18, ease: 'power2.out' }, 0)
              .to(badge.scale, { x: 1.0, y: 1.0, duration: 0.34, ease: 'back.out(2.4)' }, 0);
          });
          return;
        }
        // Subsequent charge: fly mini-badge from its activator slot to
        // the existing badge's position; bump value on arrival.
        const badge = this._chargedMultBadge;
        const target = this._chargedMultBadgePos;
        const flier = new PIXI.Text(`×${value}`, {
          fontFamily: FONT, fontSize: L.cellSize * 0.55,
          fill: 0xFFD54F, stroke: 0x2A1808, strokeThickness: 5 * gs,
          fontWeight: 'bold',
        });
        flier.anchor.set(0.5);
        flier.x = fromCtr.x; flier.y = fromCtr.y;
        flier.alpha = 0; flier.scale.set(0.5);
        scene.fxLayer.addChild(flier);
        await new Promise(res => {
          gsap.timeline({ onComplete: res })
            .to(flier,       { alpha: 1, duration: 0.14, ease: 'power2.out' }, 0)
            .to(flier.scale, { x: 1.10, y: 1.10, duration: 0.20, ease: 'back.out(2.6)' }, 0)
            .to(flier,       { x: target.x, y: target.y, duration: 0.50, ease: 'power2.inOut' }, 0.18);
        });
        // Bump charged total + pulse the badge.
        this._chargedMultValue += value;
        badge._txt.text = `×${this._chargedMultValue}`;
        gsap.timeline()
          .to(badge.scale, { x: 1.20, y: 1.20, duration: 0.18, ease: 'back.out(2.4)' }, 0)
          .to(badge.scale, { x: 1.00, y: 1.00, duration: 0.30, ease: 'elastic.out(1.4, 0.4)' }, 0.18);
        // Fade flier where the badge sits.
        await new Promise(res => {
          gsap.timeline({ onComplete: () => { flier.destroy(); res(); } })
            .to(flier, { alpha: 0, duration: 0.18, ease: 'power2.in' }, 0)
            .to(flier.scale, { x: 1.50, y: 1.50, duration: 0.18, ease: 'power2.in' }, 0);
        });
      }

      // End-of-spin reveal: badge flies from the conveyor to centre,
      // win amount flies from the win pill to centre, the two collide
      // (multiply animation) and the bonus is added to the running win.
      async _applyMultiplierCharge(ev) {
        if (!this._chargedMultBadge) return;
        const badge = this._chargedMultBadge;
        const gs = L.gameScale;
        const center = this._multCenterPos();
        // Stop the charging loops so we have clean control over the
        // badge for the reveal animation.
        this._stopChargeLoops(badge);
        if (badge._halo) { badge._halo.scale.set(1, 1); badge._halo.alpha = 0.20; }
        if (badge._ring) { badge._ring.alpha = 1; }
        if (badge._txt)  { badge._txt.scale.set(1, 1); }
        // Stage 1 — pulse the badge in place.
        await new Promise(res => {
          gsap.timeline({ onComplete: res })
            .to(badge.scale, { x: 1.30, y: 1.30, duration: 0.22, ease: 'back.out(2.4)' }, 0)
            .to(badge.scale, { x: 1.00, y: 1.00, duration: 0.18, ease: 'power2.out' }, 0.22);
        });
        // Stage 2 — badge flies from conveyor to centre. In parallel,
        // a flying "win amount" text leaves the win pill toward centre.
        const baseAmount = (ev.baseAmount || 0) * player.bet;
        const winFlier = new PIXI.Text(`+${fmtCash(baseAmount)}`, {
          fontFamily: FONT, fontSize: L.cellSize * 0.50,
          fill: 0xFFE082, stroke: 0x2A1808, strokeThickness: 5 * gs,
          fontWeight: 'bold',
        });
        winFlier.anchor.set(0.5);
        const winSrc = scene.winPill
          ? { x: scene.winPill.x, y: scene.winPill.y }
          : { x: center.x, y: center.y + L.cellSize * 1.6 };
        winFlier.x = winSrc.x; winFlier.y = winSrc.y;
        winFlier.alpha = 0; winFlier.scale.set(0.6);
        scene.fxLayer.addChild(winFlier);
        // Badge approaches centre from above (stops just above midline).
        const badgeStop = { x: center.x - L.cellSize * 0.55, y: center.y };
        const winStop   = { x: center.x + L.cellSize * 0.55, y: center.y };
        await Promise.all([
          new Promise(res => {
            gsap.timeline({ onComplete: res })
              .to(badge, { x: badgeStop.x, y: badgeStop.y, duration: 0.55, ease: 'power2.inOut' }, 0);
          }),
          new Promise(res => {
            gsap.timeline({ onComplete: res })
              .to(winFlier,       { alpha: 1, duration: 0.18, ease: 'power2.out' }, 0)
              .to(winFlier.scale, { x: 1.00, y: 1.00, duration: 0.30, ease: 'back.out(2.2)' }, 0)
              .to(winFlier,       { x: winStop.x, y: winStop.y, duration: 0.55, ease: 'power2.inOut' }, 0.10);
          }),
        ]);
        // Stage 3 — collide: badge + amount slam together, equals sign
        // appears, then the multiplied result pops at centre. Old
        // tokens fade.
        const total = baseAmount + (ev.bonusAmount || 0) * player.bet;
        const result = new PIXI.Text(fmtCash(total), {
          fontFamily: FONT, fontSize: L.cellSize * 0.95,
          fill: 0xFFE082, stroke: 0x2A1808, strokeThickness: 7 * gs,
          fontWeight: 'bold',
        });
        result.anchor.set(0.5);
        result.x = center.x; result.y = center.y;
        result.alpha = 0; result.scale.set(0.4);
        scene.fxLayer.addChild(result);
        await new Promise(res => {
          gsap.timeline({ onComplete: res })
            .to(badge,    { x: center.x, y: center.y, duration: 0.20, ease: 'power2.in' }, 0)
            .to(winFlier, { x: center.x, y: center.y, duration: 0.20, ease: 'power2.in' }, 0)
            .to(badge,    { alpha: 0, duration: 0.18, ease: 'power2.in' }, 0.18)
            .to(winFlier, { alpha: 0, duration: 0.18, ease: 'power2.in' }, 0.18)
            .to(result,       { alpha: 1, duration: 0.20, ease: 'power2.out' }, 0.18)
            .to(result.scale, { x: 1.10, y: 1.10, duration: 0.36, ease: 'back.out(2.6)' }, 0.18);
        });
        // Stage 4 — push bonus into the running win pill, then fade
        // the result text (it leaves a sparkle stream toward the win
        // pill so the player tracks the cash to the HUD).
        const bonus = (ev.bonusAmount || 0) * player.bet;
        if (scene.winPill) {
          spawnSparkleStream(
            scene.fxLayer, center.x, center.y,
            scene.winPill.x, scene.winPill.y, 22
          );
        }
        this._addToRunningWin(bonus);
        await new Promise(res => {
          gsap.timeline({ onComplete: () => {
              result.destroy(); badge.destroy({ children: true }); winFlier.destroy(); res();
            } })
            .to(result, { alpha: 0, duration: 0.34, ease: 'power2.in' }, 0.40)
            .to(result.scale, { x: 1.30, y: 1.30, duration: 0.34, ease: 'power2.out' }, 0.40);
        });
        this._chargedMultBadge = null;
        this._chargedMultValue = 0;
        this._chargedMultBadgePos = null;
      }

      // Fizzle: charge accumulated but no clusters paid this spin.
      // Engine emits no multiplierApply event in that case; we fade
      // the badge away and stamp a "FIZZLE" label over it so it's
      // clearly identifiable as the fizzle beat.
      _fizzleMultiplierCharge() {
        if (!this._chargedMultBadge) return;
        const badge = this._chargedMultBadge;
        const gs = L.gameScale;
        this._stopChargeLoops(badge);
        const fizzle = new PIXI.Text('FIZZLE', {
          fontFamily: FONT, fontSize: L.cellSize * 0.42,
          fill: 0xE8786C, stroke: 0x2A1808, strokeThickness: 5 * gs,
          fontWeight: 'bold', letterSpacing: 1.5,
        });
        fizzle.anchor.set(0.5);
        fizzle.x = badge.x; fizzle.y = badge.y;
        fizzle.alpha = 0; fizzle.scale.set(0.5);
        scene.fxLayer.addChild(fizzle);
        gsap.timeline({ onComplete: () => { fizzle.destroy(); } })
          .to(fizzle,       { alpha: 1, duration: 0.16, ease: 'power2.out' }, 0)
          .to(fizzle.scale, { x: 1, y: 1, duration: 0.24, ease: 'back.out(2.4)' }, 0)
          .to(fizzle,       { alpha: 0, duration: 0.30, ease: 'power2.in' }, 0.45);
        gsap.timeline({ onComplete: () => { badge.destroy({ children: true }); } })
          .to(badge,       { alpha: 0, duration: 0.40, ease: 'power2.in' }, 0)
          .to(badge.scale, { x: 0.6, y: 0.6, duration: 0.40, ease: 'power2.in' }, 0);
        this._chargedMultBadge = null;
        this._chargedMultValue = 0;
        this._chargedMultBadgePos = null;
      }

      _addToRunningWin(amount) {
        this.runningWin += amount;
        setWinDisplay(this.runningWin);
        if (scene.winPill) {
          gsap.killTweensOf(scene.winPill.scale);
          gsap.fromTo(scene.winPill.scale,
            { x: 1.06, y: 1.06 },
            { x: 1, y: 1, duration: 0.30, ease: 'back.out(2)' });
        }
        // Big-bet pulse: any single contribution reaching the bet threshold
        // gets the elastic pop on the win value.
        if (amount >= player.bet) pulseWinPill();
      }
      async _wait(ms) { return new Promise(res => setTimeout(res, ms)); }

      // Kill any in-flight tweens on a sprite (and its scale/position)
      // before destroying it — a lingering tween writing to a destroyed
      // PIXI transform throws every frame.
      _killSpriteTweens(s) {
        if (!s) return;
        gsap.killTweensOf(s);
        if (s.scale) gsap.killTweensOf(s.scale);
        if (s.position) gsap.killTweensOf(s.position);
      }
      _setSlotSymbol(r, c, cell) {
        const old = scene.symbols[r][c];
        if (old) {
          this._killSpriteTweens(old);
          scene.cells[r][c].removeChild(old);
          old.destroy({ children: true });
        }
        if (!cell) { scene.symbols[r][c] = null; return null; }
        const sym = makeSlotSymbol(cell, L.cellSize);
        scene.cells[r][c].addChild(sym);
        scene.symbols[r][c] = sym;
        return sym;
      }
      // Set or update a cell's multiplier stamp. Big "N×" text behind the
      // symbol + small upper-right pill badge on top. value <= 1 clears.
      // Stamps are POSITIONAL — they live on cell coordinates, never travel
      // with falling symbols (per spec: stamps stay for the spin).
      _setStamp(r, c, value) {
        const ctr = slotCellCenter(r, c);
        // ── Big text
        const oldText = scene.cellMultTexts[r][c];
        if (oldText) {
          gsap.killTweensOf(oldText);
          gsap.killTweensOf(oldText.scale);
          if (oldText.parent) oldText.parent.removeChild(oldText);
          oldText.destroy();
          scene.cellMultTexts[r][c] = null;
        }
        // ── Upper-right badge
        const oldBadge = scene.tileBadges && scene.tileBadges[r][c];
        if (oldBadge) {
          gsap.killTweensOf(oldBadge);
          gsap.killTweensOf(oldBadge.scale);
          if (oldBadge.parent) oldBadge.parent.removeChild(oldBadge);
          oldBadge.destroy({ children: true });
          scene.tileBadges[r][c] = null;
        }
        scene.stamps[r][c] = null;

        if (!value || value <= 1) return null;

        // Big "N×" text painted on the GRID, BEHIND the symbol — the
        // multiplier sitting on the grid surface. (The gold halo circle
        // that used to live behind this text was dropped per spec.)
        const text = makeCellMultText(value, L.cellSize, ctr.x, ctr.y);
        scene.cellMultTextLayer.addChild(text);
        scene.cellMultTexts[r][c] = text;
        gsap.to(text,       { alpha: 0.85, duration: 0.22, ease: 'power2.out' });
        gsap.to(text.scale, { x: 1, y: 1, duration: 0.36, ease: 'back.out(2)' });

        // Small upper-right pill badge ON TOP of the symbol — the player's
        // legible read-out. The cell-top corner uses slot-grid screen coords.
        const cellLeft = ctr.x - L.cellSize / 2;
        const cellTop  = ctr.y - L.cellSize / 2;
        const badge = makeTileBadge(value, L.cellSize, cellLeft, cellTop);
        scene.tileBadgeLayer.addChild(badge);
        scene.tileBadges[r][c] = badge;
        badge.alpha = 0;
        badge.scale.set(0.6);
        gsap.to(badge,       { alpha: 1, duration: 0.20, ease: 'power2.out' });
        gsap.to(badge.scale, { x: 1, y: 1, duration: 0.34, ease: 'back.out(2)' });

        scene.stamps[r][c] = text;   // back-compat for _animateMultiplierTraversal
        text._stampValue = value;    // queried by traversal logic to decide skip-vs-bump
        return text;
      }

      _clearAllStamps() {
        for (let r = 0; r < GAME.ROWS; r++) {
          for (let c = 0; c < GAME.COLS; c++) {
            const text = scene.cellMultTexts && scene.cellMultTexts[r][c];
            if (text) {
              gsap.killTweensOf(text);
              gsap.killTweensOf(text.scale);
              if (text.parent) text.parent.removeChild(text);
              text.destroy();
              scene.cellMultTexts[r][c] = null;
            }
            const badge = scene.tileBadges && scene.tileBadges[r][c];
            if (badge) {
              gsap.killTweensOf(badge);
              gsap.killTweensOf(badge.scale);
              if (badge.parent) badge.parent.removeChild(badge);
              badge.destroy({ children: true });
              scene.tileBadges[r][c] = null;
            }
            if (scene.stamps && scene.stamps[r]) scene.stamps[r][c] = null;
          }
        }
      }
      // Hard-snap restore — used only on full scene rebuild (resize).
      // For spin-to-spin animation we never destroy + recreate tokens;
      // we add/move/remove them based on engine events.
      _restoreConveyor(tokens) {
        for (let pos = 1; pos <= RING_SIZE; pos++) {
          const old = scene.ringTokens[pos];
          if (old) {
            this._killSpriteTweens(old);
            if (old.parent) old.parent.removeChild(old);
            old.destroy({ children: true });
          }
          scene.ringTokens[pos] = null;
        }
        for (const t of tokens) {
          if (t.pos >= 1 && t.pos <= RING_SIZE) {
            const sprite = makeTokenSprite(t, L.cellSize);
            const ctr = ringCellCenter(t.pos);
            sprite.x = ctr.x; sprite.y = ctr.y;
            scene.conveyorLayer.addChild(sprite);
            scene.ringTokens[t.pos] = sprite;
          }
        }
      }

      // A freshly-spawned token slides IN from off-grid pos 0 (one cell
      // left of pos 1) into pos 1. Engine flags it spawnedThisSpin so the
      // shift step keeps it at pos 1 for one full spin (intercept window).
      async _animateTokenSpawn(token, slideDuration = 0.36) {
        const sprite = makeTokenSprite(token, L.cellSize);
        const start  = ringCellCenter(0);
        const target = ringCellCenter(token.pos);
        sprite.x = start.x; sprite.y = start.y;
        sprite.alpha = 0; sprite.scale.set(0.85);
        scene.conveyorLayer.addChild(sprite);
        scene.ringTokens[token.pos] = sprite;
        return new Promise(res => {
          gsap.timeline({ onComplete: res })
            .to(sprite,       { alpha: 1, duration: 0.18, ease: 'power2.out' }, 0)
            .to(sprite.scale, { x: 1, y: 1, duration: 0.30, ease: 'back.out(2)' }, 0)
            .to(sprite,       { x: target.x, y: target.y, duration: slideDuration, ease: 'power2.inOut' }, 0);
        });
      }

      // Surviving tokens slide forward by 1 cell. Tokens reaching FINISH_POS
      // slide there and fade out. Pass `skipPositions` (a Set of pre-shift
      // ring positions) for tokens that won't shift this spin.
      async _animateConveyorShift(skipPositions = new Set(), duration = 0.32, snapshotTokens = []) {
        const tweens = [];
        // Build a lookup of engine tokens by their NEW position. We read
        // from the SNAPSHOT (post-shift, pre-cascade) — not from live
        // game.state.conveyor — because by the time this animation runs,
        // intercepted tokens have already been spliced out of the live
        // state. The snapshot still has them with their upgradedThisShift
        // flags intact.
        const tokenByNewPos = new Map();
        for (const t of snapshotTokens) tokenByNewPos.set(t.pos, t);
        if (MODE === 'allAround') {
          console.log('[AA ANIMATOR] snapshot tokens:',
            snapshotTokens.map(t => `${t.type}@${t.pos}${t.upgradedThisShift ? ' UP' : ''}`).join(', ') || '(empty)');
          console.log('[AA ANIMATOR] sprite occupancy:',
            Object.keys(scene.ringTokens || {}).filter(k => scene.ringTokens[k]).join(', '));
          console.log('[AA ANIMATOR] skipPositions:', [...skipPositions].join(', ') || '(none)');
        }
        // Iterate from FAR end to NEAR end so we don't overwrite scene.ringTokens
        // entries while we're still reading them.
        for (let pos = RING_SIZE; pos >= 1; pos--) {
          if (skipPositions.has(pos)) continue;
          const sprite = scene.ringTokens[pos];
          if (!sprite) continue;
          const newPos = pos + 1;
          if (newPos >= FINISH_POS) {
            const target = ringCellCenter(FINISH_POS);
            const fadeDur = Math.min(0.20, duration * 0.4);
            tweens.push(new Promise(res => {
              gsap.timeline({
                onComplete: () => {
                  if (scene.destroyingTileCtr) {
                    spawnDestroyEffect(
                      scene.fxLayer,
                      scene.destroyingTileCtr.x, scene.destroyingTileCtr.y,
                    );
                    if (MODE === 'allAround') this._flashDestroyAt(scene.destroyingTileCtr);
                  }
                  sprite.destroy({ children: true });
                  res();
                },
              })
                .to(sprite, { x: target.x, y: target.y, duration, ease: 'power2.inOut' })
                .to(sprite, { alpha: 0, duration: fadeDur, ease: 'power2.in' }, duration - fadeDur + 0.05);
            }));
            scene.ringTokens[pos] = null;
            continue;
          }

          const t = tokenByNewPos.get(newPos);
          const upgraded = !!(t && t.upgradedThisShift) && MODE === 'allAround';
          if (MODE === 'allAround') {
            const isCornerKey = (pos === 6 && newPos === 7) || (pos === 12 && newPos === 13) || (pos === 18 && newPos === 19);
            console.log(`[AA ANIMATOR] ${pos}→${newPos}${isCornerKey ? ' [CORNER]' : ''} snapshot-token=${t ? `${t.type} flag=${!!t.upgradedThisShift}` : 'MISSING'} → branch=${upgraded ? 'DETOUR (upgrade)' : 'STRAIGHT SLIDE'}${isCornerKey && !upgraded ? ' ⚠️ DIAGONAL!' : ''}`);
          }
          if (upgraded) {
            // Detour through the corner cell, do a BIG upgrade flash, then
            // continue to the new position. Engine flag is cleared once
            // the upgrade plays.
            const cornerCtr = cornerCellCenter(`${pos}->${newPos}`);
            const finalCtr  = ringCellCenter(newPos);
            scene.ringTokens[pos] = null;
            tweens.push((async () => {
              const newSprite = await this._animateUpgradeAt(
                sprite, t, cornerCtr, finalCtr, duration
              );
              scene.ringTokens[newPos] = newSprite;
              t.upgradedThisShift = false;
            })());
          } else {
            // Straight slide.
            const target = ringCellCenter(newPos);
            tweens.push(new Promise(res => {
              gsap.to(sprite, {
                x: target.x, y: target.y,
                duration, ease: 'power2.inOut',
                onComplete: res,
              });
            }));
            scene.ringTokens[pos] = null;
            scene.ringTokens[newPos] = sprite;
          }
        }
        await Promise.all(tweens);
      }

      // BIG corner upgrade beat — slide to corner, scale-up + flash +
      // label swap at the corner cell, slide to the final position with
      // the upgraded sprite. Returns the new sprite (since the original
      // is destroyed during the swap).
      async _animateUpgradeAt(oldSprite, token, cornerCtr, finalCtr, totalDuration = 1.0) {
        const slideIn  = totalDuration * 0.35;
        const flashIn  = 0.18;
        const flashSettle = 0.16;
        const slideOut = totalDuration * 0.35;

        // Phase 1: slide INTO the corner.
        await new Promise(res => {
          gsap.to(oldSprite, {
            x: cornerCtr.x, y: cornerCtr.y,
            duration: slideIn, ease: 'power2.in',
            onComplete: res,
          });
        });

        // Corner cell flash (gold pulse on the ×2 marker behind the chip).
        this._flashCornerAt(cornerCtr);

        // Phase 2: scale UP — the upgrade beat.
        await new Promise(res => {
          gsap.to(oldSprite.scale, {
            x: 1.55, y: 1.55,
            duration: flashIn, ease: 'back.out(2.6)',
            onComplete: res,
          });
        });

        // Phase 3: cross-fade into the upgraded sprite (new tier label).
        const newSprite = makeTokenSprite(token, L.cellSize);
        newSprite.x = cornerCtr.x; newSprite.y = cornerCtr.y;
        newSprite.scale.set(1.55);
        newSprite.alpha = 0;
        scene.conveyorLayer.addChild(newSprite);
        await new Promise(res => {
          gsap.timeline({
            onComplete: () => {
              if (oldSprite.parent) oldSprite.parent.removeChild(oldSprite);
              oldSprite.destroy({ children: true });
              res();
            },
          })
            .to(oldSprite, { alpha: 0, duration: 0.16, ease: 'power2.in' }, 0)
            .to(newSprite, { alpha: 1, duration: 0.16, ease: 'power2.out' }, 0);
        });

        // Phase 4: settle scale.
        await new Promise(res => {
          gsap.to(newSprite.scale, {
            x: 1.0, y: 1.0,
            duration: flashSettle, ease: 'power2.inOut',
            onComplete: res,
          });
        });

        // Phase 5: slide OUT to the final position.
        await new Promise(res => {
          gsap.to(newSprite, {
            x: finalCtr.x, y: finalCtr.y,
            duration: slideOut, ease: 'power2.out',
            onComplete: res,
          });
        });

        return newSprite;
      }

      // Brief gold pulse over a corner ×2 cell when a token crosses it.
      _flashCornerAt({ x, y }) {
        const gs = L.gameScale;
        const sz = L.cellSize;
        const ring = new PIXI.Graphics();
        ring.lineStyle(4 * gs, 0xFFD54F, 1);
        ring.drawRoundedRect(-sz / 2, -sz / 2, sz, sz, 10 * gs);
        ring.x = x; ring.y = y; ring.alpha = 0;
        scene.fxLayer.addChild(ring);
        gsap.timeline({ onComplete: () => ring.destroy() })
          .to(ring,        { alpha: 1, duration: 0.10, ease: 'power2.out' }, 0)
          .to(ring.scale,  { x: 1.40, y: 1.40, duration: 0.55, ease: 'power2.out' }, 0)
          .to(ring,        { alpha: 0, duration: 0.45, ease: 'power2.in' }, 0.20);
      }

      // BIG burst played when an Activator fires — concentric expanding
      // ring + 8 sparks flying outward + bright flash dot. Used in
      // Activator mode when a token is intercepted via an activator.
      _activatorActivateBurst({ x, y }) {
        const gs = L.gameScale;
        // Bright center flash.
        const flash = new PIXI.Graphics();
        flash.beginFill(0xFFFFFF, 1);
        flash.drawCircle(0, 0, L.cellSize * 0.40);
        flash.endFill();
        flash.x = x; flash.y = y;
        flash.alpha = 0; flash.scale.set(0.3);
        scene.fxLayer.addChild(flash);
        gsap.timeline({ onComplete: () => flash.destroy() })
          .to(flash,       { alpha: 0.85, duration: 0.08, ease: 'power2.out' }, 0)
          .to(flash.scale, { x: 1.5, y: 1.5, duration: 0.30, ease: 'power2.out' }, 0)
          .to(flash,       { alpha: 0, duration: 0.30, ease: 'power2.in' }, 0.08);
        // Expanding gold ring.
        const ring = new PIXI.Graphics();
        ring.lineStyle(5 * gs, 0xFFD54F, 1);
        ring.drawCircle(0, 0, L.cellSize * 0.45);
        ring.x = x; ring.y = y;
        ring.alpha = 0;
        scene.fxLayer.addChild(ring);
        gsap.timeline({ onComplete: () => ring.destroy() })
          .to(ring,        { alpha: 1, duration: 0.10, ease: 'power2.out' }, 0)
          .to(ring.scale,  { x: 2.6, y: 2.6, duration: 0.65, ease: 'power2.out' }, 0)
          .to(ring,        { alpha: 0, duration: 0.50, ease: 'power2.in' }, 0.20);
        // Sparks shooting outward in 8 directions.
        for (let i = 0; i < 8; i++) {
          const angle = (i / 8) * Math.PI * 2;
          const spark = new PIXI.Graphics();
          spark.beginFill(0xFFD54F, 1);
          spark.drawCircle(0, 0, 5 * gs);
          spark.endFill();
          spark.x = x; spark.y = y;
          scene.fxLayer.addChild(spark);
          const dist = L.cellSize * 1.20;
          gsap.timeline({ onComplete: () => spark.destroy() })
            .to(spark, {
              x: x + Math.cos(angle) * dist,
              y: y + Math.sin(angle) * dist,
              duration: 0.50, ease: 'power2.out',
            }, 0)
            .to(spark.scale, { x: 0.35, y: 0.35, duration: 0.50, ease: 'power2.out' }, 0)
            .to(spark, { alpha: 0, duration: 0.30, ease: 'power2.in' }, 0.20);
        }
      }

      // Briefly overlay a red X on the TL corner cell to signal a token
      // being destroyed (All Around — factory + destroyer share that
      // cell). Drawn on the fx layer so it sits above everything; fades
      // back out in ~0.4s.
      _flashDestroyAt({ x, y }) {
        const gs = L.gameScale;
        const sz = L.cellSize;
        const cont = new PIXI.Container();
        cont.x = x; cont.y = y;
        const bg = new PIXI.Graphics();
        bg.beginFill(0x8E1A1A, 0.92);
        bg.drawRoundedRect(-sz / 2, -sz / 2, sz, sz, 10 * gs);
        bg.endFill();
        bg.lineStyle(3 * gs, 0xFF6E6E, 1);
        const off = sz * 0.26;
        bg.moveTo(-off, -off); bg.lineTo(off, off);
        bg.moveTo(off, -off);  bg.lineTo(-off, off);
        cont.addChild(bg);
        cont.alpha = 0;
        scene.fxLayer.addChild(cont);
        gsap.timeline({ onComplete: () => cont.destroy({ children: true }) })
          .to(cont,       { alpha: 1, duration: 0.10, ease: 'power2.out' }, 0)
          .to(cont.scale, { x: 1.10, y: 1.10, duration: 0.14, ease: 'back.out(2.4)' }, 0)
          .to(cont,       { alpha: 0, duration: 0.20, ease: 'power2.in' }, 0.20)
          .to(cont.scale, { x: 0.92, y: 0.92, duration: 0.20, ease: 'power2.in' }, 0.20);
      }

      // Real "spin": drop the existing grid out (downward fall), then
      // drop the new grid in from above with a stagger per column.
      async _spinDropOut() {
        const tweens = [];
        const dropDist = L.cellSize * 7;
        for (let r = 0; r < GAME.ROWS; r++) {
          for (let c = 0; c < GAME.COLS; c++) {
            const cellContainer = scene.cells[r] && scene.cells[r][c];
            // Drop EVERY child of the cell container — not just whatever
            // scene.symbols tracks. Anything left in the container from
            // an interrupted animation, an unfired activator, an orphan
            // wild paint, etc. gets caught and cleared. scene.symbols is
            // also nulled out at the end so the new spin starts fresh.
            if (cellContainer) {
              const children = cellContainer.children.slice();
              for (const sym of children) {
                if (!sym) continue;
                this._killSpriteTweens(sym);
                tweens.push(new Promise(res => {
                  gsap.to(sym, {
                    y: sym.y + dropDist,
                    duration: 0.25 + (4 - r) * 0.02,
                    ease: 'power2.in',
                    delay: c * 0.02,
                    onComplete: () => {
                      if (sym.parent) sym.parent.removeChild(sym);
                      if (sym.destroy) sym.destroy({ children: true });
                      res();
                    },
                  });
                }));
              }
            }
            scene.symbols[r][c] = null;
            // Drop stamp big text along with its symbol.
            const txt = scene.cellMultTexts && scene.cellMultTexts[r][c];
            if (txt) {
              gsap.to(txt, {
                y: txt.y + dropDist,
                duration: 0.25, ease: 'power2.in',
                onComplete: () => {
                  if (txt.parent) txt.parent.removeChild(txt);
                  txt.destroy();
                  scene.cellMultTexts[r][c] = null;
                  if (scene.stamps && scene.stamps[r]) scene.stamps[r][c] = null;
                },
              });
            }
            const badge = scene.tileBadges && scene.tileBadges[r][c];
            if (badge) {
              gsap.to(badge, {
                y: badge.y + dropDist,
                duration: 0.25, ease: 'power2.in',
                onComplete: () => {
                  if (badge.parent) badge.parent.removeChild(badge);
                  badge.destroy({ children: true });
                  scene.tileBadges[r][c] = null;
                },
              });
            }
          }
        }
        await Promise.all(tweens);
      }

      async _spinDropIn(grid) {
        const tweens = [];
        for (let r = 0; r < GAME.ROWS; r++) {
          for (let c = 0; c < GAME.COLS; c++) {
            const cell = grid[r][c];
            if (!cell) continue;
            const sym = makeSlotSymbol(cell, L.cellSize);
            scene.cells[r][c].addChild(sym);
            scene.symbols[r][c] = sym;
            const dropDist = L.cellSize * (r + 2) + 40;
            sym.y = -dropDist;
            tweens.push(new Promise(res => {
              gsap.to(sym, {
                y: 0,
                duration: 0.30 + r * 0.04,
                ease: 'back.out(1.4)',
                delay: c * 0.04,
                onComplete: res,
              });
            }));
          }
        }
        await Promise.all(tweens);
      }

      _spawnPayText(x, y, amount, big = false) {
        const t = new PIXI.Text(`+${fmtCash(amount)}`, {
          fontFamily: FONT,
          fontSize: (big ? 38 : 26) * L.gameScale,
          fill: big ? 0xFFD54F : 0x6FA8C2,
          stroke: 0x2A1808, strokeThickness: 5 * L.gameScale,
          fontWeight: 'bold',
        });
        t.anchor.set(0.5); t.x = x; t.y = y; t.alpha = 0;
        t.scale.set(0.5);
        scene.fxLayer.addChild(t);
        gsap.timeline({ onComplete: () => t.destroy() })
          .to(t,       { alpha: 1, duration: 0.18, ease: 'power2.out' }, 0)
          .to(t.scale, { x: 1, y: 1, duration: 0.32, ease: 'back.out(2.4)' }, 0)
          .to(t,       { y: y - 70 * L.gameScale, duration: 1.10, ease: 'power2.out' }, 0.18)
          .to(t,       { alpha: 0, duration: 0.30, ease: 'power2.in' }, 1.05);
      }

      // Show + pay + pop a single cluster end-to-end. Returns a Promise
      // that resolves once the cluster's cells are fully cleared.
      async _showOneCluster(cl) {
        const highlights = [];
        for (const xy of cl.cells) {
          const sym = scene.symbols[xy.r][xy.c];
          if (sym) {
            gsap.killTweensOf(sym.scale);
            gsap.fromTo(sym.scale,
              { x: 1.00, y: 1.00 },
              { x: 1.10, y: 1.10, duration: 0.60, ease: 'elastic.out(1.4, 0.35)' });
          }
          const cellCtr = scene.cells[xy.r] && scene.cells[xy.r][xy.c];
          if (cellCtr) {
            const hl = new PIXI.Graphics();
            hl.beginFill(0xC9A24A, 0.92);
            hl.drawRoundedRect(
              -L.cellSize * 0.46, -L.cellSize * 0.46,
              L.cellSize * 0.92,  L.cellSize * 0.92, 8 * L.gameScale
            );
            hl.endFill();
            hl.alpha = 0;
            cellCtr.addChildAt(hl, 0);
            highlights.push(hl);
            gsap.to(hl, { alpha: 1, duration: 0.18, ease: 'power2.out' });
          }
        }
        await this._wait(420);
        let cx = 0, cy = 0;
        for (const xy of cl.cells) {
          const p = slotCellCenter(xy.r, xy.c);
          cx += p.x; cy += p.y;
        }
        cx /= cl.cells.length; cy /= cl.cells.length;
        const amount = cl.pay * player.bet;
        this._spawnPayText(cx, cy, amount, amount >= 5 * player.bet);
        this._addToRunningWin(amount);
        await this._wait(280);
        const popPromises = [];
        for (const xy of cl.cells) {
          const sym = scene.symbols[xy.r][xy.c];
          if (!sym) continue;
          popPromises.push(new Promise(res => {
            gsap.timeline({ onComplete: res })
              .to(sym.scale, { x: 1.4, y: 1.4, duration: 0.16, ease: 'back.out(2)' })
              .to(sym,       { alpha: 0,        duration: 0.22, ease: 'power2.in' }, '<0.04')
              .to(sym.scale, { x: 0.2, y: 0.2, duration: 0.22, ease: 'power2.in' }, '<');
          }));
        }
        await Promise.all(popPromises);
        for (const hl of highlights) {
          gsap.killTweensOf(hl);
          if (hl.parent) hl.parent.removeChild(hl);
          hl.destroy();
        }
        for (const xy of cl.cells) {
          this._setSlotSymbol(xy.r, xy.c, null);
        }
      }

      async _playClusters(ev, opts = {}) {
        // When wilds are involved (engine-tagged cluster cells with
        // wild=true, or caller flagged it), sequence the cluster shows.
        // Order: closest cluster to wild anchor first — that's the
        // cluster the wild was activated by — and continue outward.
        // Without wilds, all clusters bloom in parallel (the old path
        // reads fine for small all-coloured clusters).
        const wildsInvolved = !!opts.wildsInvolved
